}
// After photos only (Before photos are the Needed list's shelf photos; they go with their notes). slot = one store, or null for all.
function clearShots(slot) {
  const msg = slot == null ? "Remove the After photos of every store from this phone? Save or send the ones you need first."
    : `Remove the After photos of ${storeOf(slot) ? `store#${esc(storeOf(slot))}` : "this store"} from this phone? Save or send them first.`;
  return confirmDialog(msg, { ok: "Remove", danger: true }).then(ok => {
    if (!ok) return false;
    const snap = snapshot();
    state.shots = state.shots.filter(x => x.when === "before" || (slot != null && x.slot !== slot));
    lastShotId = null; save(); renderAll(); scheduleSweep();
    toast("Photos removed", snap);
    return true;
  });
}

// ---- One After photo: zoom, save to the phone's Photos, move, delete ----
function openShot(x, onChange) {
  const name = () => `${KIND_LABEL[x.kind]}-${WHEN_LABEL[x.when === "before" ? "before" : "after"]}-${new Date(x.at).toISOString().slice(0, 16).replace(/[-:T]/g, "")}.jpg`;
  const s = el(`<div class="sheet check-sheet shot-sheet"><div class="handle"></div><h2></h2>
    <div class="zoom-stage"><img alt=""><span class="zoom-hint">Pinch to zoom</span></div>
    <div class="row"><button class="btn sm grow" data-a="save">${icon("download")}Save to Photos</button><button class="btn sm grow quiet" data-a="more">More…</button></div>
    <button class="btn primary block" data-a="close">Done</button></div>`);
  const close = openLayer(s, { onClose: () => { if (onChange) onChange(); renderAll(); } });
  const head = () => { s.querySelector("h2").textContent = `${storeOf(x.slot) ? `#${storeOf(x.slot)} · ` : ""}${WHEN_LABEL[x.when === "before" ? "before" : "after"]} · ${KIND_LABEL[x.kind]} · ${new Date(x.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}`; };
  head();
  const img = s.querySelector("img");
  zoomStage(img, s.querySelector(".zoom-stage"));
  photoURL(x.photo).then(u => { img.src = u || ""; heroInto(img); });
  s.querySelector('[data-a="close"]').onclick = close;
  s.querySelector('[data-a="save"]').onclick = async () => {
    const blob = await getPhoto(x.photo).catch(() => null); if (!blob) return toast("This photo is missing");
    const file = new File([blob], name(), { type: "image/jpeg" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    toast("Press and hold the photo, then choose Save to Photos");
  };
  s.querySelector('[data-a="more"]').onclick = async () => {
    const pick = await menu("This photo", [
      { label: x.kind === "aisle" ? "Move to Display" : "Move to Aisle", value: "kind" },
      { label: "Delete photo", value: "delete", danger: true }]);
    if (pick === "kind") { x.kind = x.kind === "aisle" ? "display" : "aisle"; save(); head(); toast(`Moved to ${KIND_LABEL[x.kind]}`); }
    else if (pick === "delete") {
      const snap = snapshot();
      state.shots = state.shots.filter(y => y.id !== x.id); if (lastShotId === x.id) lastShotId = null;
      save(); close(); scheduleSweep(); toast("Photo deleted", snap);
    }
  };
}
// ---------- Products: the brand + flavor combinations the list recognizes ----------
// Size and pack don't matter here: they stay in the words you read. Edits apply to every size of a combination
// and upload to the shared product list like before.
let prodQuery = "", showRetired = false;
const BRAND_FIRST = ["Coca-Cola"];
// The list shows one heading per brand, the same grouping the Needed list uses: diet versions and sub-brands sit under their parent.
const CHILD_LABEL = { "Diet Coke": "Diet", "Diet Dr Pepper": "Diet", "BODYARMOR LYTE": "Lyte", "Core Power Elite": "Elite", "fairlife": "fairlife", "Topo Chico Sabores": "Sabores" };
const rowLabel = v => { const pre = CHILD_LABEL[v.brand]; return pre ? (v.flavor ? `${pre} ${v.flavor}` : pre) : (v.flavor || "No flavor"); };
function renderProducts() {
  const v = $("#view-products");
  if (!v.querySelector("input")) {
    v.innerHTML = `<button class="btn sm quiet back-btn" data-a="back">‹ More</button>
      <div class="list-head"><h2>Products</h2></div>
      <p class="hint">What the list recognizes when you talk: a brand and a flavor. Add one if people say something it doesn't know.</p>
      ${searchBox("Search brands and flavors")}<div id="prod-results"></div>
      <div class="dock-space"></div><div class="dock"><button class="fab" data-a="add">${icon("plus")}Add product</button></div>`;
    v.querySelector("input").addEventListener("input", debounce(e => { prodQuery = e.target.value; renderProductResults(); }));
    v.querySelector('[data-a="add"]').onclick = () => editVariation(null, { prefill: prodQuery });
    v.querySelector('[data-a="back"]').onclick = () => showView("more");
  }
  renderProductResults();
}
function searchBox(placeholder) {
  return `<div class="search-wrap">${icon("search")}<input class="field" type="search" placeholder="${esc(placeholder)}" autocomplete="off" autocorrect="off" spellcheck="false"></div>`;
}
function renderProductResults() {
  const box = $("#view-products #prod-results"); if (!box) return;
  const q = sNorm(prodQuery).split(" ").filter(Boolean);
  let shown = variations({ includeRetired: true }).filter(v => !q.length || q.every(t => sNorm(vName(v)).includes(t)));
  const retired = shown.filter(v => v.retired).length;
  if (!showRetired) shown = shown.filter(v => !v.retired);
  const byBrand = new Map();
  for (const v of shown) { const g = BRAND_GROUP[v.brand] || v.brand; (byBrand.get(g) || byBrand.set(g, []).get(g)).push(v); }
  const brands = [...byBrand.keys()].sort((a, b) => { const ia = BRAND_FIRST.indexOf(a), ib = BRAND_FIRST.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b); });
  let html = "";
  for (const b of brands) {
    const rows = byBrand.get(b).sort((x, y) => rowLabel(x).localeCompare(rowLabel(y)));
    html += `<div class="group-h">${esc(b)} <span class="muted">${rows.length}</span></div><div class="list">` + rows.map(v =>
      `<div class="item tap compact" data-vk="${esc(v.key)}"><div class="grow"><div class="name">${esc(rowLabel(v))}</div></div>${v.retired ? `<span class="pill">RETIRED</span>` : ""}${v.custom ? `<span class="pill">CUSTOM</span>` : ""}</div>`).join("") + `</div>`;
  }
  if (!brands.length) html = `<div class="empty"><p>Nothing matches.</p></div>`;
  if (retired || showRetired) html += `<button class="btn block quiet" id="btn-retired" style="margin-top:16px">${showRetired ? "Hide retired" : `Show retired (${retired})`}</button>`;
  box.innerHTML = html;
  box.onclick = e => {
    if (e.target.closest("#btn-retired")) { showRetired = !showRetired; return renderProductResults(); }
    const row = e.target.closest(".item[data-vk]"); if (row) editVariation(vmap().get(row.dataset.vk));
  };
}
function editVariation(v, { prefill = "" } = {}) {
  const isNew = !v;
  const brands = [...new Set(state.products.map(p => p.brand))].sort();
  let brand = v ? v.brand : "", flavor = v ? v.flavor : "";
  if (isNew && prefill) {
    const toks = tokenize(prefill), sp = brandSpans(toks.map(x => x.t))[0];
    if (sp) { brand = sp.brand; flavor = prefill.slice(toks[sp.end - 1].e).replace(/^[\s,.\-]+/, ""); }
    else flavor = prefill;
  }
  const s = el(`<div class="sheet"><div class="handle"></div><h2>${isNew ? "Add product" : "Edit product"}</h2>
    <p class="hint">Say the brand and flavor the way people say them. Leave the flavor blank for the plain one.</p>
    <label class="f" for="ep-brand">Brand</label><input class="field" id="ep-brand" list="dl-brands" placeholder="Coca-Cola" autocapitalize="words">
    <label class="f" for="ep-flavor">Flavor</label><input class="field" id="ep-flavor" placeholder="Zero Sugar" autocapitalize="words">
    <datalist id="dl-brands">${brands.map(b => `<option value="${esc(b)}">`).join("")}</datalist>
    <button class="btn primary block" data-a="save" style="margin-top:18px;padding:14px">${isNew ? "Add product" : "Save"}</button>
    ${isNew ? "" : `<button class="btn block" data-a="retire">${v.retired ? "Show it again" : "Retire (stop recognizing it)"}</button>`}
    ${!isNew && v.custom ? `<button class="btn block danger" data-a="delete">Delete</button>` : ""}
    <button class="btn block quiet" data-a="cancel">Cancel</button></div>`);
  const close = openLayer(s);
  s.querySelector("#ep-brand").value = brand; s.querySelector("#ep-flavor").value = flavor;
  s.querySelector('[data-a="cancel"]').onclick = close;
  s.querySelector('[data-a="save"]').onclick = () => {
    const b = s.querySelector("#ep-brand").value.trim(), f = s.querySelector("#ep-flavor").value.trim();
    if (!b) return toast("Enter a brand");
    const key = vKey({ brand: b, flavor: f }), clash = vmap().get(key);
    if (clash && (!v || clash.key !== v.key)) return toast(`${vName(clash)} is already in the list`);
    const snap = snapshot();
    if (isNew) {
      let id = slug(`${b} ${f || "plain"}`) || "product", n = 2;
      while (productById(id) || state.deleted.products[id]) id = slug(`${b} ${f || "plain"}`) + "-" + n++;
      state.products.push({ id, brand: b, flavor: f, size: "", pack: "", category: "Other", unit: "pack", img: "", custom: true, retired: false, updated: 0 });
      markProduct(id);
    } else for (const p of v.records) { p.brand = b; p.flavor = f; markProduct(p.id); }
    save(); close(); renderAll(); toast(isNew ? `Added ${vName({ brand: b, flavor: f })}` : "Saved", snap);
  };
  const rb = s.querySelector('[data-a="retire"]');
  if (rb) rb.onclick = () => {
    const snap = snapshot(), to = !v.retired;
    for (const p of v.records) { p.retired = to; markProduct(p.id); }
    save(); close(); renderAll(); toast(to ? "Retired" : "Restored", snap);
  };
  const db = s.querySelector('[data-a="delete"]');
  if (db) db.onclick = async () => {
    if (!(await confirmDialog(`Delete <b>${esc(vName(v))}</b>?`, { ok: "Delete", danger: true }))) return;
    const snap = snapshot();
    for (const p of v.records) dropProduct(p.id);
    save(); close(); renderAll(); toast("Deleted", snap);
  };
}
// The running count of releases since the project began (every pushed update; the phones' old automatic sync commits don't count). Add one with each push.
const REVISION = 66;
// More
function modelRow(key) {
  const i = MODEL_INFO[key], have = haveModel(key), busy = ai.dl.key === key;
  const dot = have ? "ok" : busy ? "warn" : "";
  return `<div class="set-row"><span class="status-dot ${dot}"></span><div class="grow"><b>${esc(i.name)}</b><br><span class="hint">${esc(i.detail)} · ${esc(i.size)}</span></div>
    ${have ? `<span class="small muted">Ready</span>` : busy ? `<span class="small muted">Downloading</span>` : `<button class="btn sm primary" data-dl="${key}" ${ai.dl.key ? "disabled" : ""}>${icon("download")}Download</button>`}</div>`;
}
function renderMore() {
  const v = $("#view-more");
  const a = document.activeElement;
  if (a && v.contains(a) && a.matches("input, textarea, select")) return;   // don't wipe what is being typed; it redraws when focus leaves
  const dl = ai.dl.key;
  v.innerHTML = `
    <div class="list-head"><h2>More</h2></div>
    <div class="card">
      <h3>Voice</h3>
      <p class="hint">Listening runs on this phone, so it works with no signal. The speech model downloads once (use Wi-Fi), then stays on the phone.</p>
      ${modelRow("asr")}
      <p class="hint" style="margin:-4px 0 6px 21px">Turns your recording into words and gives you a list right away.</p>
      <div class="set-row"><label class="grow" for="word-timing">Highlight words while a note plays<br><span class="hint">Uses more memory while listening. If the app restarts after you tap Done, leave this off.</span></label><input type="checkbox" switch id="word-timing" ${state.settings.wordTiming ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--red)"></div>
      <div class="set-row"><label class="grow" for="live-listen">Listen while recording<br><span class="hint">Turns each product into text while you say the next one, so the list is ready the moment you finish. Uses more memory at once: for newer iPhones. If the app restarts while you record, turn this off.</span></label><input type="checkbox" switch id="live-listen" ${liveListenOn() ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--red)"></div>
      ${dl ? `<div class="mprog" data-mprog><i></i></div><p class="hint" data-mprog-label style="margin-top:6px">Starting…</p>` : ""}
      ${ai.dl.error ? `<div class="banner warn" style="margin-top:8px">${icon("warn")}<span class="grow">${esc(ai.dl.error)}</span></div>` : ""}
      ${haveModel("asr") && !dl ? `<div class="stack" style="margin-top:10px"><button class="btn block quiet" id="btn-del-models">Delete the speech model</button></div>` : ""}
    </div>
    <div class="card">
      <h3>Feedback</h3>
      <div class="set-row"><label class="grow" for="haptic-shutter">Shutter feedback<br><span class="hint">A tiny blip when you press the shutter. Needs an iPhone with iOS 17.4 or later.</span></label><input type="checkbox" switch id="haptic-shutter" ${hapticShutterOn() ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--red)"></div>
      <div class="try-wrap" id="haptic-try" style="margin-top:8px"><button type="button" class="btn block">Try the shutter blip</button></div>
      <p class="hint" style="margin-top:6px">No tap felt? Check Settings > Sounds &amp; Haptics &gt; System Haptics on your iPhone.</p>
      <div class="set-row"><label class="grow" for="haptic-taps">Button feedback<br><span class="hint">A light tap on buttons, tabs and switches. iPhones on iOS 26.5 or later don't allow this one, so it only works on older ones.</span></label><input type="checkbox" switch id="haptic-taps" ${hapticTapsOn() ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--red)"></div>
    </div>
    <div class="card">
      <h3>Products</h3>
      <p class="hint">The brands and flavors the list recognizes when you talk. Add one if people say something it doesn't know, or retire ones you never stock.</p>
      <div class="stack" style="margin-top:10px"><button class="btn block" id="btn-products">${icon("grid")}Product list (${variations().length})</button></div>
    </div>
    <div class="card">
      <h3>Backup</h3>
      <p class="hint">Saves the product list, settings and store numbers as one small file. Keep it in Files (or send it to yourself), then restore it here on this phone or a new one. Notes and photos aren't included.</p>
      <div class="stack" style="margin-top:10px">
        <button class="btn block primary" id="btn-backup">${icon("download")}Save a backup</button>
        <button class="btn block" id="btn-restore">Restore from a backup</button>
      </div>
    </div>
    <div class="card">
      <h3>Danger zone</h3>
      <div class="stack" style="margin-top:10px"><button class="btn block danger" id="btn-reset">Reset this phone</button></div>
    </div>
    <p class="foot">Shelfie 2.3.0 · revision ${REVISION} · ${state.products.length} products · ${state.notes.length} note${state.notes.length === 1 ? "" : "s"}<br>
      <span style="opacity:.7">Screen ${screen.width}×${screen.height}${navigator.standalone ? " · home screen" : ""}</span></p>`;
  if (dl) updateModelProgress();
  attachHapticOverlay(v.querySelector("#haptic-try"), () => toast("Felt a tap? Then the shutter will too."));
  v.querySelector("#haptic-shutter").onchange = e => { state.settings.hapticShutter = e.target.checked; save(); syncHaptics(); };
  v.querySelector("#haptic-taps").onchange = e => { state.settings.hapticTaps = e.target.checked; save(); };
  v.querySelector("#live-listen").onchange = e => { state.settings.liveListen = e.target.checked; save(); };
  v.querySelector("#word-timing").onchange = e => { state.settings.wordTiming = e.target.checked; save(); };
  v.querySelectorAll("[data-dl]").forEach(b => (b.onclick = () => downloadModels([b.dataset.dl])));
  const del = v.querySelector("#btn-del-models"); if (del) del.onclick = async () => {
    if (!(await confirmDialog("Delete the speech model? Notes already read keep their lists. New notes wait until you download it again.", { ok: "Delete", danger: true }))) return;
    await deleteModels(); toast("Speech model deleted");
  };
  v.querySelector("#btn-products").onclick = () => showView("products");
  v.querySelector("#btn-backup").onclick = saveBackup;
  v.querySelector("#btn-restore").onclick = pickBackupFile;
  v.querySelector("#btn-reset").onclick = async () => {
    if (!(await confirmDialog("Erase everything on this phone (notes, photos, store numbers and settings) and start fresh with the built-in product list? Save a backup first if you want to keep your product changes.", { ok: "Erase", danger: true }))) return;
    const models = state.settings.models;
    state = freshState(); state.settings.models = models; save(); renderAll(); scheduleSweep();
    toast("This phone was reset");
  };
}

// ---------- Wire up ----------
fillIcons();
load();
document.body.dataset.view = view;   // the layout keys off this (it also works where the page is wrapped by another document)
document.querySelectorAll("#tabs button").forEach(b => (b.onclick = () => showView(b.dataset.view)));
$("#btn-cam-start").onclick = startCamera;
$("#btn-cam-stop").onclick = () => { state.settings.camOK = false; save(); stopCamera(); };
document.querySelectorAll("#cap-seg button").forEach(b => (b.onclick = () => { state.settings.captureKind = b.dataset.k; save(); renderCapture(); }));
// The shutter is held, not tapped: a hold takes the shelf photo and records one product (see hold.js). A tap just says so, except with no
// live camera, where it opens the iPhone camera app and then the recording sheet.
$("#btn-shutter").onclick = () => {
  if (hold.justHeld) { hold.justHeld = false; return; }   // the tap that ends a hold isn't a shutter tap
  if (!cam.stream) return onShutter(false, captureKind());
  toast("Hold the shutter while you say each product"); pulse($("#shutter-label"));
};
wireHoldToTalk();
$("#btn-phonecam").onclick = () => onShutter(true, captureKind());
wireBA();
wireSoundBtn();
wireHaptics();
wireToastSwipe();
wireNeededSwipe();
document.querySelectorAll(".cam-lens button").forEach(b => (b.onclick = () => { pulse(b); setLens(b.dataset.lens); }));
renderAll();
save();
syncAllIndicators(false);
setTimeout(sweepMedia, 3000);   // tidy photos and recordings left over from deleted notes
if (state.settings.camOK) startCamera();
checkLastCrash();
recoverRecording();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}   // ask iOS not to clear saved photos and recordings when space is low
verifyModels().then(() => { setTimeout(warmUp, 3000); pump(); });   // the model loads a moment after the camera starts, not at the same instant   // get the models ready, and pick up anything still waiting from last time

// Updates: check for a new version whenever the app comes back to the foreground (home-screen apps on iPhone
// stay loaded for days), and offer a one-tap reload once it's installed.
if ("serviceWorker" in navigator && location.protocol === "https:") {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) showUpdateReady(); });
}
// Centered pop-up; "Later" dismisses it until the app next comes back to the foreground.
let updatePromptOpen = false, updateWaiting = false;
function showUpdateReady() {
  updateWaiting = true;
  if (updatePromptOpen) return;
  updatePromptOpen = true;
  const d = el(`<div class="dialog update-dialog" id="update-ready">
    <div class="update-icon">${icon("refresh")}</div>
    <h3>Update available</h3>
    <p>A new version of Shelfie is ready. Reload to start using it. Your notes and settings stay as they are.</p>
    <div class="btns"><button class="btn quiet" data-a="later">Later</button><button class="btn primary" data-a="reload">Reload now</button></div></div>`);
  const close = openLayer(d, { center: true, onClose: () => (updatePromptOpen = false) });
  d.querySelector('[data-a="reload"]').onclick = () => location.reload();
  d.querySelector('[data-a="later"]').onclick = close;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && updateWaiting) showUpdateReady(); });
</script>
