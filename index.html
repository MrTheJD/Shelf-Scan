<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F40009">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shelf Scan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Shelf Scan</title>
<style>
/* Shelf Scan: one-handed iPhone tool.
   Rules: Coke red is reserved for the brand bar, primary actions and "selected"; everything else is warm neutrals.
   Controls that get used constantly sit in the bottom third (thumb reach); the top of the screen is for reading.
   Spacing steps: 4 / 8 / 12 / 16 / 24. Radii: 12 controls, 16 cards, 22 sheets. Touch targets are at least 44pt. */
:root {
  --red: #F40009; --red-press: #C80008; --on-red: #FFFFFF; --ink: #1B1B1B; --on-ink: #FFFFFF;
  --bg: #F3F1EF; --surface: #FFFFFF; --surface-2: #F9F8F6; --text: #151311; --muted: #6B6560; --faint: #A39E99;
  --line: #E7E3DF; --chip: #EDE9E5;
  --ok: #1E8E3E; --ok-soft: #E3F4E8; --warn: #A85F00; --warn-soft: #FFF0D8;
  --scrim: rgba(12, 8, 8, .5); --toast: #151311; --on-toast: #FFFFFF; --toast-action: #FF6B70;
  --shadow: 0 1px 2px rgba(40, 20, 20, .05), 0 6px 18px rgba(40, 20, 20, .06);
  --sheet-shadow: 0 -10px 34px rgba(0, 0, 0, .2);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --r: 16px; --tab-h: 56px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --spring: cubic-bezier(.2, .9, .3, 1.04); --ease-out: cubic-bezier(.22, 1, .36, 1);
}
@supports (transition-timing-function: linear(0, 1)) {
  :root { --spring: linear(0, 0.034 1.6%, 0.132 3.4%, 0.285 5.6%, 0.498 8.4%, 0.702 11.6%, 0.846 14.8%, 0.943 18.2%, 1.003 21.9%, 1.03 25.7%, 1.036 29.4%, 1.028 34.2%, 1.012 40.9%, 1.001 49.5%, 0.997 60%, 1); }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #F5F3F1; --on-ink: #111111;
    --bg: #000000; --surface: #151413; --surface-2: #1C1B1A; --text: #F5F3F1; --muted: #9C9692; --faint: #6B6662; --line: #272524; --chip: #232120;
    --ok: #4CC36E; --ok-soft: #13301D; --warn: #F2A742; --warn-soft: #3A2A10;
    --shadow: none; --sheet-shadow: 0 -10px 34px rgba(0, 0, 0, .65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #F5F3F1; --on-ink: #111111;
  --bg: #000000; --surface: #151413; --surface-2: #1C1B1A; --text: #F5F3F1; --muted: #9C9692; --faint: #6B6662; --line: #272524; --chip: #232120;
  --ok: #4CC36E; --ok-soft: #13301D; --warn: #F2A742; --warn-soft: #3A2A10;
  --shadow: none; --sheet-shadow: 0 -10px 34px rgba(0, 0, 0, .65); color-scheme: dark;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100vh; min-height: 100lvh; overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; padding-bottom: calc(var(--tab-h) + var(--safe-b)); }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; }
.hint { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.35; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 8px; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }

/* ---------- Brand bar ---------- */
header.top {
  position: sticky; top: 0; z-index: 20; background: var(--red); color: var(--on-red);
  padding: calc(6px + var(--safe-t)) 16px 6px; min-height: calc(44px + var(--safe-t));
  display: flex; align-items: center; gap: 10px;
}
header.top h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
header.top .spacer { flex: 1; }
.store { font-size: 13px; font-weight: 650; opacity: .9; }
.sync-ind { display: flex; align-items: center; gap: 4px; min-width: 44px; height: 44px; justify-content: center; margin: -6px -10px -6px 0; font-size: 12px; font-weight: 700; background: none; border: 0; color: var(--on-red); padding: 0; }
.sync-ind svg.i { width: 20px; height: 20px; }

main { padding: 16px 16px 24px; max-width: 640px; margin: 0 auto; }
.view { display: none; }
.view.active { display: block; animation: viewIn .3s var(--ease-out) both; }
.view > * + * { margin-top: 12px; }

/* ---------- Tab bar ---------- */
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 0 0 var(--safe-b); isolation: isolate; transition: transform .35s var(--ease-out); }
nav.tabs button { flex: 1; position: relative; z-index: 1; height: var(--tab-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 650; color: var(--faint); transition: color .25s ease; }
nav.tabs button.active { color: var(--red); }
nav.tabs.has-ind::before { content: ""; position: absolute; z-index: 0; left: 0; top: 6px; height: calc(var(--tab-h) - 12px); width: var(--ind-w, 0); transform: translateX(var(--ind-x, 0)); background: var(--chip); border-radius: 16px; pointer-events: none; transition: transform .5s var(--spring), width .5s var(--spring); }
nav.tabs.no-anim::before { transition: none; }
body.kb-open nav.tabs { transform: translateY(110%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s; }
.badge { position: absolute; top: 5px; left: calc(50% + 7px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--red); color: var(--on-red); font-size: 11px; font-weight: 800; line-height: 18px; padding: 0 5px; font-variant-numeric: tabular-nums; }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); font-weight: 650; font-size: 15px; text-decoration: none; transition: transform .45s var(--spring), background-color .2s ease; }
.btn:active { transform: scale(.97); transition-duration: .1s; }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.primary:active { background: var(--red-press); }
.btn.quiet { background: var(--chip); border-color: transparent; }
.btn.danger { color: var(--red); }
.btn.block { display: flex; width: 100%; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; }
.icon-btn { width: 44px; padding: 0; }
.seg { display: flex; position: relative; isolation: isolate; background: var(--chip); border-radius: 14px; padding: 3px; }
.seg button { position: relative; z-index: 1; flex: 1; min-height: 42px; border: 0; background: none; border-radius: 11px; font-weight: 700; font-size: 15px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; transition: color .25s ease; }
.seg button.active { color: var(--text); }
.seg.has-ind::before { content: ""; position: absolute; z-index: 0; left: 0; top: 3px; bottom: 3px; width: var(--ind-w, 0); transform: translateX(var(--ind-x, 0)); background: var(--surface); border-radius: 11px; box-shadow: 0 1px 3px rgba(0, 0, 0, .14); pointer-events: none; transition: transform .5s var(--spring), width .5s var(--spring); }
.seg.no-anim::before { transition: none; }
input.field, select.field, textarea.field { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); outline: none; }
input.field:focus, textarea.field:focus { border-color: var(--red); }
.search-wrap { position: relative; }
.search-wrap svg.i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); width: 18px; height: 18px; }
.search-wrap input.field { padding-left: 42px; }
label.f { display: block; font-size: 12px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }

/* ---------- Building blocks ---------- */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.pill { display: inline-block; font-size: 11px; font-weight: 750; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.kind.aisle { background: var(--chip); color: var(--text); } .pill.kind.display { background: var(--ink); color: var(--on-ink); }
.kcount { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--red); color: var(--on-red); font-size: 12px; font-weight: 800; line-height: 20px; font-variant-numeric: tabular-nums; }
.banner { display: flex; align-items: center; gap: 10px; background: var(--warn-soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 600; }
.banner.busy { background: var(--chip); font-weight: 500; }
.banner svg.i { color: var(--warn); }
.empty { text-align: center; padding: 56px 24px; color: var(--muted); }
.empty svg.i { width: 40px; height: 40px; color: var(--faint); }
.empty h3 { color: var(--text); margin: 12px 0 4px; font-size: 17px; }
.empty p { margin: 0; font-size: 14px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--red); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
.list-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.list-head h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.foot { text-align: center; color: var(--faint); font-size: 12px; margin: 24px 0 8px; }

/* ---------- Lists ---------- */
.list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px; position: relative; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 1px solid var(--line); }
.item.tap { cursor: pointer; transition: background-color .2s ease; }
.item.tap:active { background: var(--surface-2); }
.item .name { font-weight: 650; font-size: 16px; line-height: 1.25; }
.item > svg.i { color: var(--faint); width: 18px; height: 18px; }
.group-h { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 24px 4px 8px; display: flex; align-items: center; gap: 8px; }
.group-h .muted { font-weight: 700; letter-spacing: 0; }
.view > .group-h:first-child { margin-top: 8px; }
.cluster-h { display: flex; align-items: baseline; gap: 8px; font-size: 17px; font-weight: 800; letter-spacing: -.01em; margin: 24px 4px 8px; }
.cluster-h .n { font-size: 13px; font-weight: 700; color: var(--faint); }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--faint); background: none; flex: none; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--on-red); transition: background-color .15s ease, border-color .15s ease; }
.check svg.i { width: 17px; height: 17px; stroke-width: 3; }
.check.on { background: var(--red); border-color: var(--red); }
.shelf-thumb { position: relative; width: 52px; height: 52px; flex: none; border: 0; padding: 0; border-radius: 12px; overflow: hidden; background: var(--chip); display: flex; align-items: center; justify-content: center; color: var(--faint); }
.shelf-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shelf-thumb.missing img { display: none; }
.item.done .shelf-thumb { opacity: .45; }
.blurb { font-size: 16px; line-height: 1.35; }
.blurb .hl { font-weight: 800; background: color-mix(in srgb, var(--red) 12%, transparent); border-radius: 4px; padding: 0 2px; }
.item.done .blurb { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip-sm { font-size: 12px; font-weight: 650; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.flag-tag { font-size: 12px; font-weight: 750; padding: 3px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.need.flagged { box-shadow: inset 3px 0 0 var(--warn); }

/* ---------- Docked controls (bottom third, above the tab bar) ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + var(--safe-b) + 10px); z-index: 15; padding: 0 16px; pointer-events: none; display: flex; justify-content: center; gap: 10px; }
.dock > * { pointer-events: auto; max-width: 608px; }
.dock.solid { bottom: calc(var(--tab-h) + var(--safe-b)); padding: 10px 16px; background: var(--bg); border-top: 1px solid var(--line); pointer-events: auto; }
.dock.solid .seg { max-width: 608px; width: 100%; }
.dock .fab { box-shadow: 0 8px 22px rgba(0, 0, 0, .22); }
.dock-space { height: 84px; }
.fab { min-height: 52px; padding: 0 20px; border-radius: 26px; background: var(--red); border: 0; color: var(--on-red); font-weight: 750; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
.fab:active { background: var(--red-press); }
body.kb-open .dock { display: none; }

/* ---------- Capture: a viewfinder with the controls under the thumb ---------- */
#view-capture { padding: 0; }
#view-capture.active { display: flex; flex-direction: column; gap: 12px; height: calc(100dvh - 44px - var(--safe-t) - var(--tab-h) - var(--safe-b)); min-height: 440px; padding: 12px 16px 12px; }
#view-capture > * + * { margin-top: 0; }
.camera { position: relative; flex: 1 1 auto; min-height: 220px; border-radius: 24px; overflow: hidden; background: #000; border: 3px solid var(--red); transition: border-color .3s ease; }
#view-capture.mode-display .camera { border-color: var(--ink); }
.camera video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; animation: fade .4s ease both; }
.camera.flash::after { content: ""; position: absolute; inset: 0; z-index: 6; background: #fff; animation: fadeOut .35s ease forwards; pointer-events: none; }
.cam-off, .cam-wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; color: #D9D6D3; }
.cam-wait { font-size: 14px; }
.cam-off svg.i { width: 36px; height: 36px; opacity: .6; }
.cam-off p { margin: 0; font-size: 13px; max-width: 32ch; line-height: 1.4; }
.cam-off .btn.quiet { background: rgba(255, 255, 255, .14); color: #fff; }
.cam-chip { position: absolute; top: 12px; left: 12px; z-index: 3; padding: 6px 12px; border-radius: 999px; background: var(--red); color: var(--on-red); font-size: 11px; font-weight: 800; letter-spacing: .16em; transition: background-color .3s ease; }
#view-capture.mode-display .cam-chip { background: var(--ink); color: var(--on-ink); }
.cam-stop { position: absolute; top: 8px; right: 8px; z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .5); color: #fff; display: flex; align-items: center; justify-content: center; }
.cam-stop svg.i { width: 18px; height: 18px; }
.queue-line { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 3; margin: 0; padding: 7px 14px; border-radius: 999px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); }
.queue-line:not(.busy) .spin { display: none; }
.deck { display: flex; flex-direction: column; gap: 12px; flex: none; }
.cap-seg { background: var(--chip); }
.deck-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.deck-side { width: 56px; height: 56px; border-radius: 16px; border: 0; padding: 0; background: var(--chip); color: var(--text); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.deck-side.left { justify-self: start; } .deck-side.right { justify-self: end; }
.deck-side img { width: 100%; height: 100%; object-fit: cover; display: block; }
.deck-side .badge { top: -2px; left: auto; right: -2px; }
.shutter-big { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--red); background: var(--surface); padding: 5px; transition: transform .45s var(--spring), border-color .3s ease; }
.shutter-big span { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--red); transition: background-color .3s ease; }
.shutter-big:active { transform: scale(.9); transition-duration: .1s; }
.shutter-big:disabled { opacity: .4; }
#view-capture.mode-display .shutter-big { border-color: var(--ink); }
#view-capture.mode-display .shutter-big span { background: var(--ink); }
.cap-hint { margin: 0; text-align: center; font-size: 13px; color: var(--muted); }
#model-banner { flex: none; }

/* ---------- Sheets and dialogs ---------- */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .25s var(--ease-out) both; }
.overlay.closing { animation: fadeOut .22s ease forwards; pointer-events: none; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; overflow-y: auto; overscroll-behavior: contain; max-height: calc(100dvh - var(--safe-t) - 12px); border-radius: 24px 24px 0 0; padding: 10px 16px calc(56px + var(--safe-b)); margin-bottom: -40px; box-shadow: var(--sheet-shadow); animation: sheetIn .55s var(--spring) both; }
.overlay.closing .sheet { animation: sheetOut .24s cubic-bezier(.4, 0, .9, .6) forwards; }
.sheet > * + * { margin-top: 12px; }
.sheet h2 { margin: 4px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.sheet .handle { width: 38px; height: 5px; background: var(--line); border-radius: 3px; margin: 0 auto 6px; }
.overlay.center { align-items: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: 22px; padding: 22px; width: 100%; max-width: 380px; animation: dialogIn .45s var(--spring) both; }
.overlay.closing .dialog { animation: dialogOut .2s ease forwards; }
.dialog p { margin: 0 0 16px; line-height: 1.45; }
.dialog .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.menu-list { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.menu-list button { display: block; width: 100%; min-height: 52px; text-align: left; border: 0; background: none; padding: 0 16px; font-size: 16px; font-weight: 550; transition: background-color .15s ease; }
.menu-list button + button { border-top: 1px solid var(--line); }
.menu-list button:active { background: var(--chip); }
.menu-list button.danger { color: var(--red); }
.update-dialog { text-align: center; }
.update-dialog h3 { margin: 12px 0 6px; font-size: 19px; font-weight: 800; }
.update-dialog p { color: var(--muted); font-size: 15px; }
.update-dialog .btns { justify-content: stretch; }
.update-dialog .btns .btn { flex: 1; }
.update-icon { width: 52px; height: 52px; margin: 0 auto; border-radius: 16px; background: var(--red); color: var(--on-red); display: flex; align-items: center; justify-content: center; }
#toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + var(--safe-b) + 16px); z-index: 100; background: var(--toast); color: var(--on-toast); border-radius: 16px; padding: 12px 18px; display: flex; align-items: center; gap: 16px; max-width: calc(100% - 32px); font-size: 14px; font-weight: 550; box-shadow: 0 8px 28px rgba(0, 0, 0, .28); opacity: 0; transform: translate(-50%, 16px) scale(.96); pointer-events: none; transition: opacity .2s ease, transform .45s var(--spring); }
#toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
#toast button { background: none; border: 0; color: var(--toast-action); font-weight: 800; letter-spacing: .04em; padding: 8px 0 8px 4px; }

/* ---------- Recorder, note sheet, photo ---------- */
.rec-sheet { text-align: center; }
.rec-sheet h2 { text-align: center; }
.rec-meter { height: 12px; border-radius: 6px; background: var(--chip); overflow: hidden; margin: 16px 4px 0; }
.rec-meter i { display: block; height: 100%; width: 100%; background: var(--red); transform: scaleX(0); transform-origin: left; transition: transform .08s linear; }
.rec-time { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.rec-done { min-height: 60px; font-size: 18px; }
.rec-alt .btn { font-size: 14px; }
.transcript { font-size: 16px; line-height: 1.4; background: var(--surface); border-radius: 14px; padding: 12px 14px; }
.zoom-stage { position: relative; height: 34dvh; background: #000; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; touch-action: none; }
.zoom-stage img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center; will-change: transform; user-select: none; -webkit-user-drag: none; }
.zoom-stage.empty-photo::after { content: "No photo for this note"; color: #aaa; font-size: 13px; position: absolute; }
.zoom-hint { position: absolute; left: 12px; bottom: 8px; font-size: 11px; color: rgba(255, 255, 255, .7); pointer-events: none; }
.viewer-dots { display: flex; justify-content: center; gap: 8px; min-height: 12px; }
.viewer-dots:empty { display: none; }
.viewer-dots .dot { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; background: var(--line); }
.viewer-dots .dot.on { background: var(--text); }

/* ---------- Settings ---------- */
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.status-dot.ok { background: var(--ok); } .status-dot.warn { background: var(--warn); } .status-dot.bad { background: var(--red); }
.mprog { height: 10px; border-radius: 5px; background: var(--chip); overflow: hidden; margin-top: 12px; }
.mprog i { display: block; height: 100%; width: 0; background: var(--red); transition: width .3s ease; }
details.owner summary { cursor: pointer; font-weight: 650; color: var(--muted); font-size: 14px; list-style: none; min-height: 32px; display: flex; align-items: center; }
details.owner summary::-webkit-details-marker { display: none; }

/* ---------- Motion ---------- */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes viewIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheetOut { to { transform: translateY(100%); } }
@keyframes dialogIn { from { transform: scale(.92); opacity: 0; } 40% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes dialogOut { to { transform: scale(.95); opacity: 0; } }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.14); } 100% { transform: scale(1); } }
.bump { animation: bump .45s var(--spring); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

body[data-view="capture"] main { padding: 0; max-width: none; }
body[data-view="capture"] #view-capture.active { max-width: 640px; margin: 0 auto; }
.item.compact { min-height: 52px; padding-top: 8px; padding-bottom: 8px; }
</style>
</head>
<body data-view="capture">
<header class="top">
  <h1>Shelf Scan</h1>
  <span class="spacer"></span>
  <span class="store" id="hdr-store"></span>
  <button class="sync-ind" id="sync-ind" hidden></button>
</header>

<main>
  <!-- CAPTURE: a big viewfinder, with everything you tap sitting in the bottom third -->
  <section class="view active mode-aisle" id="view-capture">
    <div class="camera" id="camera">
      <video id="cam-video" playsinline muted autoplay hidden></video>
      <div class="cam-wait" id="cam-starting" hidden>Starting the camera…</div>
      <div class="cam-off" id="cam-off">
        <span data-icon="camera"></span>
        <button class="btn primary" id="btn-cam-start">Start camera</button>
        <p id="cam-error"></p>
        <button class="btn quiet" id="btn-phonecam" hidden><span data-icon="image"></span>Use phone camera instead</button>
      </div>
      <span class="cam-chip" id="cap-band">AISLE</span>
      <button class="cam-stop" id="btn-cam-stop" aria-label="Turn the camera off" hidden><span data-icon="x"></span></button>
      <p class="queue-line" id="queue-line" hidden><span class="spin"></span><span id="queue-text"></span></p>
    </div>
    <div id="model-banner" hidden></div>
    <div class="deck">
      <div class="seg cap-seg" id="cap-seg">
        <button data-k="aisle" class="active">Aisle</button>
        <button data-k="display">Display</button>
      </div>
      <div class="deck-row">
        <button class="deck-side left" id="last-note" aria-label="Open the last note" style="visibility:hidden"></button>
        <button class="shutter-big" id="btn-shutter" aria-label="Take a photo, then say what you need"><span></span></button>
        <button class="deck-side right" id="btn-open-needed" aria-label="Open the Needed list"><span data-icon="list"></span><span class="badge" id="deck-badge" hidden></span></button>
      </div>
      <p class="cap-hint" id="shutter-label">Snap the aisle, then say what you need.</p>
    </div>
  </section>

  <section class="view" id="view-needed"></section>
  <section class="view" id="view-products"></section>
  <section class="view" id="view-more"></section>
</main>

<nav class="tabs" id="tabs">
  <button data-view="capture" class="active"><span data-icon="camera"></span>Capture</button>
  <button data-view="needed"><span data-icon="list"></span>Needed<span class="badge" id="need-badge" hidden></span></button>
  <button data-view="products"><span data-icon="grid"></span>Products</button>
  <button data-view="more"><span data-icon="sliders"></span>More</button>
</nav>

<div id="toast"><span id="toast-msg"></span><button id="toast-undo">UNDO</button></div>

      const b = el(`<button class="${o.danger ? "danger" : ""}"></button>`);
      b.textContent = o.label;
      b.onclick = () => { done = true; close(); resolve(o.value); };
      s.querySelector(".menu-list").appendChild(b);
    }

// ---------- Photos and voice clips ----------
// Stored in IndexedDB (localStorage is only ~5 MB). They stay on this phone and are deleted when their note goes.
const mediaDB = (() => {
  let p = null;
  return () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open("shelfscan-b4", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("photos"); r.result.createObjectStore("audio"); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => { p = null; rej(r.error); };
  }));
})();
async function mediaTx(store, mode, fn) {
  const db = await mediaDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, mode), req = fn(tx.objectStore(store));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = tx.onabort = () => rej(tx.error);
  });
}
const photoURLs = new Map();
const putPhoto = (id, blob) => mediaTx("photos", "readwrite", s => s.put(blob, id));
const getPhoto = id => mediaTx("photos", "readonly", s => s.get(id));
const delPhoto = id => { const u = photoURLs.get(id); if (u) { URL.revokeObjectURL(u); photoURLs.delete(id); } return mediaTx("photos", "readwrite", s => s.delete(id)); };
const putAudio = (id, rec) => mediaTx("audio", "readwrite", s => s.put(rec, id));
const getAudio = id => mediaTx("audio", "readonly", s => s.get(id));
const delAudio = id => mediaTx("audio", "readwrite", s => s.delete(id));

async function photoURL(id) {
  if (photoURLs.has(id)) return photoURLs.get(id);
  const blob = await getPhoto(id).catch(() => null);
  if (!blob) return null;
  const u = URL.createObjectURL(blob); photoURLs.set(id, u); return u;
}
// Fill <img data-photo="id"> placeholders after a render.
function hydratePhotos(root) {
  root.querySelectorAll("img[data-photo]").forEach(async img => {
    const u = await photoURL(img.dataset.photo);
    if (u) img.src = u; else img.closest("[data-photo-wrap]")?.classList.add("missing");
  });
}
// Remove photos and clips no note points to (runs after deletes once the undo window has passed).
async function sweepMedia() {
  try {
    const keepP = new Set(state.notes.flatMap(n => n.photos || [])), keepA = new Set(state.notes.map(n => n.audio).filter(Boolean));
    const ps = await mediaTx("photos", "readonly", s => s.getAllKeys()), as = await mediaTx("audio", "readonly", s => s.getAllKeys());
    for (const k of ps) if (!keepP.has(k)) await delPhoto(k);
    for (const k of as) if (!keepA.has(k)) await delAudio(k);
  } catch (e) { /* storage unavailable */ }
}
function scheduleSweep() { clearTimeout(scheduleSweep.t); scheduleSweep.t = setTimeout(sweepMedia, 10000); }

// Resize an image or video frame to at most 1280px on the long side and encode it as JPEG (~150 KB).
function frameToBlob(source, sw, sh, sx = 0, sy = 0, cw = sw, ch = sh) {
  const k = Math.min(1, 1280 / Math.max(cw, ch));
  const c = document.createElement("canvas"); c.width = Math.round(cw * k); c.height = Math.round(ch * k);
  c.getContext("2d").drawImage(source, sx, sy, cw, ch, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.72));
}
async function fileToBlob(file) {
  const bmp = await createImageBitmap(file);
  const b = await frameToBlob(bmp, bmp.width, bmp.height); bmp.close && bmp.close(); return b;
}
// The iPhone camera app, for extra photos (and as a fallback when the live camera isn't available).
function cameraPhoto() {
  return new Promise(resolve => {
    const inp = el(`<input type="file" accept="image/*" capture="environment" hidden>`);
    inp.onchange = async () => { const f = inp.files && inp.files[0]; inp.remove(); resolve(f ? await fileToBlob(f) : null); };
    document.body.appendChild(inp); inp.click();
  });
}

      const rp = remote.products[id];
      if ((rp.updated || 0) <= localTs(id)) continue;
      const i = state.products.findIndex(p => p.id === id);
      if (i >= 0) state.products[i] = { ...rp }; else state.products.push({ ...rp });
      delete state.deleted.products[id]; delete state.outbox.products[id];
    }
    for (const id in remote.deleted.products) {
      const ts = remote.deleted.products[id];
      if (ts <= localTs(id)) continue;
      state.products = state.products.filter(p => p.id !== id);
      state.deleted.products[id] = ts; delete state.outbox.products[id];

}

// ---------- Upload key (encrypted with the team password) ----------
const KDF_ITER = 250000;
async function deriveAesKey(password, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}

  const key = await deriveAesKey(password, salt, KDF_ITER);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(token));
  return { v: 1, kdf: "PBKDF2-SHA256", iter: KDF_ITER, salt: bytesToB64(salt), iv: bytesToB64(iv), ct: bytesToB64(ct) };
}
async function decryptToken(blob, password) {
  const key = await deriveAesKey(password, b64ToBytes(blob.salt), blob.iter);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.ct));
  return new TextDecoder().decode(pt);
}
function getPass() { try { return localStorage.getItem(PASS_KEY) || ""; } catch (e) { return ""; } }
function setPass(p) { try { if (p) localStorage.setItem(PASS_KEY, p); else localStorage.removeItem(PASS_KEY); } catch (e) {} }
const uploadsEnabled = () => !!getPass();
let cachedToken = null;
async function loadKeyBlob() {
  const { text } = await readRepoFile(GITHUB.keyPath, null);
  if (!text) throw new Error("Uploads haven't been set up for this app yet.");
  return JSON.parse(text);
}
async function getToken() {
  if (cachedToken) return cachedToken;
  const pass = getPass();
  if (!pass) throw new Error("Uploads are off");
  const blob = await loadKeyBlob();
  try { cachedToken = await decryptToken(blob, pass); }
  catch (e) { const err = new Error("The upload password no longer works. Enable uploads again."); err.auth = true; throw err; }
  return cachedToken;
}
async function checkToken(token) {
  const r = await fetch(apiBase, { headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}` }, cache: "no-store" });
  if (r.status === 401) throw new Error("GitHub didn't accept that key.");
  if (!r.ok) throw new Error(`Couldn't reach the repository (${r.status}). Check that the key has access to ${GITHUB.repo}.`);
  const j = await r.json();
  if (j.permissions && !j.permissions.push) throw new Error("That key can read but not write. Give it Contents: Read and write.");
}

// ---------- Automatic uploads ----------
let uploadTimer = null, uploading = false, uploadAgain = false;
function scheduleUpload(delay = UPLOAD_DELAY_MS) {
  renderSyncIndicator();
  if (!uploadsEnabled()) return;
  clearTimeout(uploadTimer);
  uploadTimer = setTimeout(uploadChanges, delay);
}
async function uploadChanges() {
  if (!uploadsEnabled() || !pendingCount()) { renderSyncIndicator(); return; }
  if (!navigator.onLine) { state.sync.error = "offline"; renderSyncIndicator(); return; }
  if (uploading) { uploadAgain = true; return; }
  uploading = true; renderSyncIndicator();
  try {
    const token = await getToken();
    // What we're sending, with the timestamp it had, so later edits aren't wrongly cleared.
    const sentP = {};
    for (const id in state.outbox.products) { const p = productById(id); sentP[id] = p ? p.updated : state.deleted.products[id] || 0; }
    for (let attempt = 0; attempt < 4; attempt++) {
      const { text, sha } = await readRepoFile(GITHUB.dataPath, token);
      const R = normShared(text ? JSON.parse(text) : null);
      let n = 0;
      for (const id in sentP) {
        const rTs = Math.max((R.products[id] && R.products[id].updated) || 0, R.deleted.products[id] || 0);
        if (rTs > sentP[id]) continue;                         // someone else changed it more recently
        const p = productById(id);
        if (p) { R.products[id] = shareable(p); delete R.deleted.products[id]; }
        else { delete R.products[id]; R.deleted.products[id] = state.deleted.products[id] || Date.now(); }
        n++;
      }
      R.updated = Date.now();
      try {
        await writeRepoFile(GITHUB.dataPath, JSON.stringify(R, null, 1), sha, token,
          `Shelf Scan: ${n} change${n === 1 ? "" : "s"}${state.storeName ? ` (store ${state.storeName})` : ""}`);
      } catch (e) { if (e.conflict) continue; throw e; }   // someone uploaded at the same moment; re-read and retry
      for (const id in sentP) {
        const p = productById(id), now = p ? p.updated : state.deleted.products[id] || 0;
        if (now === sentP[id]) delete state.outbox.products[id];
      }
      applyShared(R);                                        // pick up everyone else's changes too
      state.sync.lastPush = state.sync.lastPull = Date.now();
      state.sync.error = "";
      save(); renderAll();
      return;
    }
    throw new Error("Too many people uploading at once. Will retry.");
  } catch (e) {
    state.sync.error = e.message || String(e);
    if (e.auth) cachedToken = null;
    save();
    if (!e.auth) scheduleUpload(30000);                      // try again shortly
  } finally {
    uploading = false;
    renderSyncIndicator();
    if (view === "more") renderMore();
    if (uploadAgain) { uploadAgain = false; scheduleUpload(500); }
  }
}
window.addEventListener("online", () => { state.sync.error = ""; scheduleUpload(500); });

function syncStatus() {
  const n = pendingCount();
  if (!uploadsEnabled()) return { dot: "", text: "Uploads are off on this phone", short: "" };
  if (uploading) return { dot: "warn", text: `Uploading ${n} change${n === 1 ? "" : "s"}…`, short: "up" };
  if (state.sync.error === "offline" || (!navigator.onLine && n)) return { dot: "warn", text: `${n} change${n === 1 ? "" : "s"} waiting for signal`, short: "wait" };
  if (state.sync.error) return { dot: "bad", text: state.sync.error, short: "err" };
  if (n) return { dot: "warn", text: `${n} change${n === 1 ? "" : "s"} waiting to upload`, short: "wait" };

}

// Crop the live video to the shape of the viewfinder (what you see is what's saved).
async function grabPhoto() {

let recorder = null;
async function micTrack() {
  if (cam.audioTrack) return cam.audioTrack;
  const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });

function resampleTo16k(chunks, inRate) {
  let total = 0; for (const c of chunks) total += c.length;
  const x = new Float32Array(total); let o = 0; for (const c of chunks) { x.set(c, o); o += c.length; }
  const ratio = inRate / 16000, n = Math.floor(total / ratio), out = new Int16Array(n);

  for (let i = 0; i < n; i++) out[i] = Math.max(-32768, Math.min(32767, Math.round(f[i] * gain * 32767)));

// Recording sheet. Starts listening straight away; the person taps Done when finished.
// `base`: what to do with the result ({photos} for a new note, or {note} to re-record an existing one).
async function startRecording(base) {
  if (recorder) return;
  const sheet = el(`<div class="sheet rec-sheet"><div class="handle"></div>
    <h2>What do you need ${base.kind === "display" ? "on this display" : base.note && base.note.kind === "display" ? "on this display" : "here"}?</h2>
    <p class="hint center" id="rec-hint">Say what you need, like “three Diet Coke twelve packs”.</p>
    <div class="rec-meter"><i id="rec-level"></i></div>
    <div class="rec-time" id="rec-time">0:00</div>
    <button class="btn primary block rec-done" data-a="done">${icon("check")}Done</button>
    <div class="row rec-alt"><button class="btn quiet grow" data-a="type">${icon("note")}Type it instead</button><button class="btn quiet grow" data-a="cancel">${icon("x")}Discard</button></div></div>`);

    try { r.ctx && r.ctx.close(); } catch (e) {}

// ---------- Needed ----------
// Each blurb is a row, word for word. The matcher only decides where it sits: a blurb shows up under every

// of its own for each product. Aisle and display needs never mix.
const KINDS = ["aisle", "display"];
const noteKind = n => (n.kind === "display" ? "display" : "aisle");
const KIND_LABEL = { aisle: "Aisle", display: "Display" };
const captureKind = () => (state.settings.captureKind === "display" ? "display" : "aisle");

const CHECK_GROUP = "Check the text";
// The products (brand + flavor) a blurb is listed under: one appearance each, or a single "?" one when none were recognized.
function appearances(n) {
  const vm = vmap(), vks = [...new Set((n.parts || []).map(p => p.vk).filter(k => vm.has(k)))];
  return vks.length ? vks.map(vk => ({ key: vk, vk })) : [{ key: "?", vk: null }];
}
const noteDone = n => appearances(n).every(a => (n.ticks || {})[a.key]);
const listed = kind => state.notes.filter(n => noteKind(n) === kind && n.status === "done" && n.text);

// Blurbs are clustered by brand and flavor (Coca-Cola and Diet Coke first, then alphabetical); the ones nothing was recognized in come first.
function neededGroups(kind) {
  const vm = vmap(), clusters = new Map();
  for (const n of listed(kind)) for (const a of appearances(n)) (clusters.get(a.key) || clusters.set(a.key, []).get(a.key)).push({ n, a });
  const rank = v => { const i = BRAND_FIRST.indexOf(v.brand); return i < 0 ? 99 : i; };
  const list = [...clusters.entries()].map(([key, rows]) => ({ key, v: key === "?" ? null : vm.get(key), rows: rows.sort((r1, r2) => r1.n.at - r2.n.at) }));
  list.sort((c1, c2) => (!c1.v ? -1 : !c2.v ? 1 : rank(c1.v) - rank(c2.v) || c1.v.brand.localeCompare(c2.v.brand) || c1.v.flavor.localeCompare(c2.v.flavor)));
  return list;
}

// Pinch to zoom, drag to pan, double-tap to toggle.
function zoomStage(img, stage) {
  let scale = 1, tx = 0, ty = 0, startDist = 0, startScale = 1, last = null, lastTap = 0;
  const pts = new Map();
  const apply = () => { img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; };
  const reset = () => { scale = 1; tx = ty = 0; apply(); };
  stage.addEventListener("pointerdown", e => {
    stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { const [a, b] = [...pts.values()]; startDist = Math.hypot(a.x - b.x, a.y - b.y) || 1; startScale = scale; }
    const now = Date.now(); if (pts.size === 1 && now - lastTap < 300) { scale > 1 ? reset() : ((scale = 2.5), apply()); } lastTap = now;
    last = { x: e.clientX, y: e.clientY };
  });
  stage.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { const [a, b] = [...pts.values()]; scale = Math.max(1, Math.min(6, startScale * Math.hypot(a.x - b.x, a.y - b.y) / startDist)); apply(); }
    else if (pts.size === 1 && scale > 1) { tx += e.clientX - last.x; ty += e.clientY - last.y; apply(); }
    last = { x: e.clientX, y: e.clientY };
  });
  const up = e => { pts.delete(e.pointerId); if (scale <= 1.02) reset(); last = null; };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
}

    <p class="foot">Shelf Scan Beta 5.1.5 (voice notes) · ${state.products.length} products · ${state.notes.length} note${state.notes.length === 1 ? "" : "s"}<br>
      <span style="opacity:.7">Screen ${screen.width}×${screen.height}${navigator.standalone ? " · home screen" : ""}</span></p>`;
  if (dl) updateModelProgress();
  v.querySelector("#store-name").onchange = e => { state.storeName = e.target.value.trim(); save(); renderAll(); };
  v.querySelector("#beep").onchange = e => { state.settings.beep = e.target.checked; save(); };
  v.querySelectorAll("[data-dl]").forEach(b => (b.onclick = () => downloadModels([b.dataset.dl])));
  const del = v.querySelector("#btn-del-models"); if (del) del.onclick = async () => {
    if (!(await confirmDialog("Delete the speech model? Notes already read keep their lists. New notes wait until you download it again.", { ok: "Delete", danger: true }))) return;
    await deleteModels(); toast("Speech model deleted");
  };
  v.querySelector("#btn-export").onclick = exportBackup;
  v.querySelector("#btn-restore").onclick = () => restoreBackupText(v.querySelector("#backup-text").value);
  v.querySelector("#btn-sync").onclick = syncFromGitHub;
  const en = v.querySelector("#btn-enable"); if (en) en.onclick = enableUploads;
  const up = v.querySelector("#btn-upload-now"); if (up) up.onclick = () => { state.sync.error = ""; uploadChanges(); renderMore(); };
  const dis = v.querySelector("#btn-disable"); if (dis) dis.onclick = async () => {
    if (!(await confirmDialog("Turn off uploads on this phone? Your changes will stay on this phone only.", { ok: "Turn off" }))) return;
    setPass(""); cachedToken = null; renderAll();
  };
  v.querySelector("#btn-own-save").onclick = ownerSetup;
  v.querySelector("#btn-reset").onclick = async () => {
    const n = pendingCount();
    if (!(await confirmDialog(`Erase everything on this phone (notes, photos and settings) and start fresh from the shared product list?${n ? `<br><br><b>${n} change${n === 1 ? " hasn't" : "s haven't"} uploaded</b> and will be lost.` : ""}`, { ok: "Erase", danger: true }))) return;
    const keep = state.sync, models = state.settings.models;
    state = freshState(); state.sync = keep; state.settings.models = models; save(); renderAll(); scheduleSweep();
    pullShared({ overwrite: true, quiet: false }).catch(e => toast(e.message));
  };
}
function passwordDialog(title, note, okLabel = "Enable") {
  return new Promise(resolve => {
    const d = el(`<div class="dialog"><p><b>${esc(title)}</b><br><span class="hint">${esc(note)}</span></p>
      <input class="field" type="text" id="pw-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Password">
      <p class="hint" id="pw-err" style="color:var(--red);margin:8px 0 0"></p>
      <div class="btns" style="margin-top:14px"><button class="btn" data-a="c">Cancel</button><button class="btn primary" data-a="ok">${esc(okLabel)}</button></div></div>`);
    let done = false;
    const close = openLayer(d, { center: true, onClose: () => { if (!done) resolve(null); } });
    const inp = d.querySelector("input"), err = d.querySelector("#pw-err"), ok = d.querySelector('[data-a="ok"]');
    d.querySelector('[data-a="c"]').onclick = () => { done = true; close(); resolve(null); };
    const go = async () => {
      if (!inp.value) return;
      ok.disabled = true; ok.textContent = "Checking…"; err.textContent = "";
      try { await resolveCheck(inp.value); done = true; close(); resolve(inp.value); }
      catch (e) { err.textContent = e.message; ok.disabled = false; ok.textContent = okLabel; }
    };
    let resolveCheck;
    d.check = fn => (resolveCheck = fn);
    ok.onclick = go;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    setTimeout(() => inp.focus(), 50);
    passwordDialog.current = d;
  });
}
async function enableUploads() {
  const p = passwordDialog("Enable uploads", "Enter the team password. You'll only need it once on this phone.");
  passwordDialog.current.check(async pw => {
    const blob = await loadKeyBlob();
    let token;
    try { token = await decryptToken(blob, pw); } catch (e) { throw new Error("That password isn't right."); }
    await checkToken(token);
    cachedToken = token;
  });
  const pw = await p;
  if (!pw) return;
  setPass(pw); state.sync.error = "";
  save(); renderAll();
  toast("Uploads enabled. Changes now upload automatically.");
  scheduleUpload(300);
}
async function ownerSetup() {
  const token = $("#own-token").value.trim(), pw = $("#own-pass").value;
  if (!token) return toast("Paste the GitHub key first");
  if (pw.length < 6) return toast("Use a password of at least 6 characters");
  const btn = $("#btn-own-save");
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    await checkToken(token);
    const blob = await encryptToken(token, pw);
    const { sha } = await readRepoFile(GITHUB.keyPath, token);
    await writeRepoFile(GITHUB.keyPath, JSON.stringify(blob, null, 1), sha, token, "Shelf Scan: set upload key");
    setPass(pw); cachedToken = token; state.sync.error = "";
    save(); renderAll();
    toast("Upload key saved. Uploads are on.");
    scheduleUpload(300);
  } catch (e) {
    toast(e.message || "Couldn't save the key");
    btn.disabled = false; btn.textContent = "Save key and enable uploads";
  }
}
async function syncFromGitHub() {
  const n = pendingCount();
  const ok = await confirmDialog(`Replace this phone's product list with the shared one from GitHub? Your notes are kept.${n ? `<br><br><b>${n} change${n === 1 ? " hasn't" : "s haven't"} uploaded</b> and will be lost.` : ""}`, { ok: "Replace", danger: !!n });
  if (!ok) return;
  if (!navigator.onLine) return toast("No signal. Try again when you're online.");
  toast("Syncing…");
  try { await pullShared({ overwrite: true, quiet: false }); }
  catch (e) { toast(e.message || "Couldn't reach GitHub"); }
}
function exportBackup() {
  const text = JSON.stringify(state);
  const box = $("#backup-text");
  const fallback = () => { box.value = text; box.focus(); box.select(); toast("Backup is in the box. Select all and copy it."); };
  try { navigator.clipboard.writeText(text).then(() => toast("Backup copied"), fallback); }
  catch (e) { fallback(); }
}
async function restoreBackupText(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { data = null; }
  if (!data || !data.products) { toast("That isn't a Shelf Scan backup"); return; }
  if (!(await confirmDialog("Replace everything on this phone with the backup?", { ok: "Replace", danger: true }))) return;
  const snap = snapshot(); state = data; migrate(); save(); renderAll(); toast("Backup restored", snap);
}


// ---------- Wire up ----------
fillIcons();
load();
document.body.dataset.view = view;   // the layout keys off this (it also works where the page is wrapped by another document)
document.querySelectorAll("#tabs button").forEach(b => (b.onclick = () => showView(b.dataset.view)));
$("#btn-cam-start").onclick = startCamera;
$("#btn-cam-stop").onclick = () => { state.settings.camOK = false; save(); stopCamera(); };
document.querySelectorAll("#cap-seg button").forEach(b => (b.onclick = () => { state.settings.captureKind = b.dataset.k; save(); renderCapture(); }));
$("#btn-shutter").onclick = () => onShutter(false, captureKind());
$("#btn-phonecam").onclick = () => onShutter(true, captureKind());
$("#sync-ind").onclick = () => showView("more");
renderAll();
save();
syncAllIndicators(false);
setTimeout(sweepMedia, 3000);   // tidy photos and recordings left over from deleted notes
if (state.settings.camOK) startCamera();
verifyModels().then(() => { warmUp(); pump(); });   // get the models ready, and pick up anything still waiting from last time

// Pull everyone's latest product list on open, then upload anything waiting.
if (navigator.onLine) pullShared().catch(() => {}).finally(() => scheduleUpload(1000));

// Updates: check for a new version whenever the app comes back to the foreground (home-screen apps on iPhone
// stay loaded for days), and offer a one-tap reload once it's installed.
if ("serviceWorker" in navigator && location.protocol === "https:") {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) showUpdateReady(); });
}
// Centered pop-up; "Later" dismisses it until the app next comes back to the foreground.
let updatePromptOpen = false, updateWaiting = false;
function showUpdateReady() {
  updateWaiting = true;
  if (updatePromptOpen) return;
  updatePromptOpen = true;
  const d = el(`<div class="dialog update-dialog" id="update-ready">
    <div class="update-icon">${icon("refresh")}</div>
    <h3>Update available</h3>
    <p>A new version of Shelf Scan is ready. Reload to start using it. Your notes and settings stay as they are.</p>
    <div class="btns"><button class="btn quiet" data-a="later">Later</button><button class="btn primary" data-a="reload">Reload now</button></div></div>`);
  const close = openLayer(d, { center: true, onClose: () => (updatePromptOpen = false) });
  d.querySelector('[data-a="reload"]').onclick = () => location.reload();
  d.querySelector('[data-a="later"]').onclick = close;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && updateWaiting) showUpdateReady(); });
</script>
