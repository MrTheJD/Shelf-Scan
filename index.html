<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F40009">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shelf Scan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Shelf Scan</title>
<style>
/* Layout: one-thumb phone tool. Coke-red header, warm-grey ground, white surfaces, fixed icon tab bar. */
:root {
  --red: #F40009; --red-press: #C80008; --on-red: #FFFFFF;
  --bg: #F4F2F0; --surface: #FFFFFF; --surface-2: #FAF9F8; --text: #111111; --muted: #6F6A66; --faint: #A39E99;
  --line: #E8E4E0; --chip: #EEEAE6;
  --ok: #1E8E3E; --ok-soft: #E3F4E8; --warn: #A85F00; --warn-soft: #FFF1DC;
  --scrim: rgba(12, 8, 8, .48); --toast: #111111; --on-toast: #FFFFFF; --toast-action: #FF6B70;
  --cam: #000000; --cam-edge: #000000; --on-cam: #D9D6D3; --img-bg: #FFFFFF; --thumb-ink: #FFFFFF; --thumb-fallback: #8A8480;
  --shadow: 0 1px 2px rgba(40, 20, 20, .06), 0 2px 8px rgba(40, 20, 20, .05);
  --sheet-shadow: 0 -8px 30px rgba(0, 0, 0, .18);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --r: 14px;
  /* Motion: a gentle spring (~3% overshoot) and a soft ease-out. */
  --spring: cubic-bezier(.2, .9, .3, 1.04);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
}
@supports (transition-timing-function: linear(0, 1)) {
  :root { --spring: linear(0, 0.034 1.6%, 0.132 3.4%, 0.285 5.6%, 0.498 8.4%, 0.702 11.6%, 0.846 14.8%, 0.943 18.2%,
    1.003 21.9%, 1.03 25.7%, 1.036 29.4%, 1.028 34.2%, 1.012 40.9%, 1.001 49.5%, 0.997 60%, 1); }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #141312; --surface-2: #1B1A19; --text: #F5F3F1; --muted: #9C9692; --faint: #6B6662;
    --line: #262423; --chip: #221F1E; --cam: #0B0B0B; --cam-edge: #2A2827;
    --ok: #4CC36E; --ok-soft: #13301D; --warn: #F2A742; --warn-soft: #3A2A10;
    --shadow: none; --sheet-shadow: 0 -8px 30px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #141312; --surface-2: #1B1A19; --text: #F5F3F1; --muted: #9C9692; --faint: #6B6662;
  --line: #262423; --chip: #221F1E; --cam: #0B0B0B; --cam-edge: #2A2827;
  --ok: #4CC36E; --ok-soft: #13301D; --warn: #F2A742; --warn-soft: #3A2A10;
  --shadow: none; --sheet-shadow: 0 -8px 30px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* Feel like an app: no double-tap zoom, no rubber-band scrolling past the top or bottom. */
html, body { margin: 0; min-height: 100%; overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
/* iPhone home-screen apps size the window short of the real screen when a page doesn't fill it, which lifts
   the fixed tab bar off the bottom (seen on Scan and List; long pages like Products were fine). Making every
   page at least the full screen height keeps the tab bar on the bottom edge. */
html, body { min-height: 100vh; min-height: 100lvh; }
body {
  background: var(--bg); color: var(--text); font: 16px/1.4 var(--font);
  padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* Header */
header.top {
  position: sticky; top: 0; z-index: 20;
  background: var(--red); color: var(--on-red);
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
  display: flex; align-items: center; gap: 10px;
}
header.top h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.tagline { font-size: 10px; font-weight: 700; letter-spacing: .12em; border: 1.5px solid rgba(255,255,255,.75); border-radius: 5px; padding: 1px 5px; }
header.top .spacer { flex: 1; }
.store { font-size: 13px; font-weight: 600; opacity: .92; }
.sync-ind { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; background: none; border: 0; color: var(--on-red); padding: 4px; }
.sync-ind svg.i { width: 20px; height: 20px; }

main { padding: 12px 16px 8px; max-width: 640px; margin: 0 auto; }
.view { display: none; }
.view.active { display: block; }
.view > * + * { margin-top: 12px; }
#view-scan > * + * { margin-top: 10px; }
#view-scan > .hint { margin-top: 6px; }

/* Tab bar */
nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding: 4px 0 env(safe-area-inset-bottom, 0px);
}
nav.tabs button {
  flex: 1; border: 0; background: none; padding: 6px 0 8px; font-size: 11px; font-weight: 600; color: var(--faint);
  display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative;
}
nav.tabs button.active { color: var(--red); }
.badge {
  position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px;
  background: var(--red); color: var(--on-red); font-size: 11px; font-weight: 700; line-height: 18px; padding: 0 5px;
  font-variant-numeric: tabular-nums;
}

/* Building blocks */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; }
.card h3 { margin: 0 0 4px; font-size: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 12px; padding: 11px 16px; font-weight: 650; font-size: 15px; text-decoration: none;
  transition: transform .08s ease, background .15s ease;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.primary:active { background: var(--red-press); }
.btn.quiet { background: var(--chip); border-color: transparent; }
.btn.danger { color: var(--red); }
.btn.block { display: flex; width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .5; }
.icon-btn { width: 40px; height: 40px; padding: 0; border-radius: 12px; }

.seg { display: flex; background: var(--chip); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 4px; border-radius: 10px; font-weight: 650; font-size: 14px; color: var(--muted); }
.seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

input.field, select.field, textarea.field {
  width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); outline: none;
}
input.field:focus, textarea.field:focus, select.field:focus { border-color: var(--red); }
.search-wrap { position: relative; }
.search-wrap svg.i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); width: 18px; height: 18px; }
.search-wrap input.field { padding-left: 38px; }
label.f { display: block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--chip); color: var(--text); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; }
.chip.active { background: var(--text); color: var(--bg); }

/* Scan */
/* Sized for iPhone 13 (390×844 pt): a square viewfinder ~358pt wide fills the space between
   the mode switch and the action buttons, and the whole scan screen fits without scrolling. */
.camera { position: relative; background: var(--cam); border-radius: 18px; overflow: hidden; border: 1px solid var(--cam-edge);
  aspect-ratio: 1 / 1; max-height: 52dvh; margin-inline: auto; }
.camera.live { max-height: none; touch-action: none; }   /* pinch goes to the camera, not the page */
/* The feed fills the square and is cropped evenly from the center, whatever shape the camera sends. */
/* !important: the scanner library sets position:relative inline on start, which collapsed the box to 0 height. */
#reader { position: absolute !important; inset: 0 !important; width: auto !important; height: auto !important; overflow: hidden; padding: 0 !important; border: 0 !important; }
#reader video { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block;
  object-fit: cover; object-position: center; transform: scale(var(--view-zoom, 1)); transform-origin: center; }
#reader #qr-shaded-region, #reader img[alt="Info icon"], #reader img[alt="Camera based scan"] { display: none !important; }
.camera .cam-off { height: 100%; justify-content: center; }
/* Our own centered scan frame (corner brackets). */
.viewfinder { position: absolute; inset: 14%; z-index: 2; pointer-events: none;
  background:
    linear-gradient(#fff, #fff) left top / 26px 3px no-repeat, linear-gradient(#fff, #fff) left top / 3px 26px no-repeat,
    linear-gradient(#fff, #fff) right top / 26px 3px no-repeat, linear-gradient(#fff, #fff) right top / 3px 26px no-repeat,
    linear-gradient(#fff, #fff) left bottom / 26px 3px no-repeat, linear-gradient(#fff, #fff) left bottom / 3px 26px no-repeat,
    linear-gradient(#fff, #fff) right bottom / 26px 3px no-repeat, linear-gradient(#fff, #fff) right bottom / 3px 26px no-repeat;
  filter: drop-shadow(0 0 2px rgba(0,0,0,.5)); opacity: .9; }
.zoom-pill { position: absolute; left: 50%; bottom: 12px; z-index: 3; transform: translateX(-50%); padding: 4px 11px; border-radius: 999px;
  background: rgba(0,0,0,.55); color: #fff; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  opacity: 0; transition: opacity .25s ease; pointer-events: none; }
.zoom-pill.show { opacity: 1; }
/* Shelf-photo shutter over the live camera */
.shot-ui { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; animation: fade .25s ease both; }
.shot-ui > * { pointer-events: auto; }
.shot-top { display: flex; align-items: flex-start; gap: 8px; margin: 10px; padding: 9px 12px; border-radius: 14px; background: rgba(0,0,0,.6); color: #fff; font-size: 14px; }
.shot-top span { opacity: .8; }
.shot-hint { font-size: 13px; opacity: .85; margin-top: 2px; }
.shot-link { border: 0; background: none; color: #fff; text-decoration: underline; font-size: 13px; padding: 2px 0; white-space: nowrap; }
.shot-bottom { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 14px 14px; }
.shot-cancel { justify-self: start; border: 0; border-radius: 999px; padding: 9px 14px; background: rgba(0,0,0,.55); color: #fff; font-weight: 650; font-size: 14px; }
.shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,.18); padding: 5px; transition: transform .45s var(--spring); }
.shutter span { display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; }
.shutter:active { transform: scale(.9); transition-duration: .1s; }
.camera.shooting .viewfinder { display: none; }
.camera.flash::after { content: ""; position: absolute; inset: 0; z-index: 5; background: #fff; animation: fadeOut .35s ease forwards; pointer-events: none; }
/* Shelf photo in list rows */
.shelf-thumb { position: relative; width: 56px; height: 56px; flex: none; border: 0; padding: 0; border-radius: 12px; overflow: hidden; background: var(--chip); }
.shelf-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shelf-thumb.missing::after { content: "No photo"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); }
.shelf-thumb .count { position: absolute; right: 3px; bottom: 3px; min-width: 16px; height: 16px; border-radius: 8px; background: rgba(0,0,0,.65); color: #fff; font-size: 10px; font-weight: 800; line-height: 16px; text-align: center; }
.item.done .shelf-thumb { opacity: .45; }
/* Full-screen photo viewer */
.viewer-overlay { padding: 0 !important; background: #000 !important; }
.viewer { position: fixed; inset: 0; display: flex; flex-direction: column; background: #000; color: #fff; animation: fade .25s ease both; }
.viewer-top { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; }
.viewer-top .small { opacity: .75; }
.viewer-x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; display: flex; align-items: center; justify-content: center; }
.viewer-stage { flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; touch-action: none; }
.viewer-stage img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center; transition: transform .08s linear; }
.viewer-dots { display: flex; justify-content: center; gap: 8px; min-height: 20px; }
.viewer-dots .dot { width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; background: rgba(255,255,255,.35); }
.viewer-dots .dot.on { background: #fff; }
.viewer-actions { display: flex; gap: 10px; justify-content: center; padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.viewer-actions .btn { flex: 1; max-width: 220px; }
.cam-off { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 34px 16px; color: var(--on-cam); text-align: center; }
.cam-off svg.i { width: 34px; height: 34px; opacity: .7; }
.cam-off p { margin: 0; font-size: 13px; max-width: 30ch; }
.cam-stop { position: absolute; top: 10px; right: 10px; z-index: 3; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; display: flex; align-items: center; justify-content: center; }
.cam-stop svg.i { width: 18px; height: 18px; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.actions .btn { flex-direction: column; gap: 4px; padding: 10px 6px; font-size: 13px; }
.actions.photo-first { grid-template-columns: 1fr 1fr; }
.actions.photo-first .photo-btn { grid-column: 1 / -1; flex-direction: row; background: var(--red); border-color: var(--red); color: var(--on-red); font-size: 16px; padding: 15px; }

.banner { display: flex; align-items: center; gap: 8px; background: var(--warn-soft); color: var(--text); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.banner .grow { font-weight: 650; }

.last { display: flex; align-items: center; gap: 12px; }
.last .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.last .code { font-size: 12px; color: var(--muted); word-break: break-all; }

/* Lists */
.list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; position: relative; min-height: 60px; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; border-top: 1px solid var(--line); }
.item.tap { cursor: pointer; }
.item.tap:active { background: var(--surface-2); }
.item .name { font-weight: 650; font-size: 15.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; line-height: 1.25; }
.item .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.group-h { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 20px 4px 8px; }
.view > .group-h:first-child { margin-top: 4px; }

.thumb {
  width: 44px; height: 44px; border-radius: 10px; flex: none; overflow: hidden;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: var(--thumb-ink);
  background: var(--thumb-fallback); letter-spacing: -.02em;
}
.thumb img { width: 100%; height: 100%; object-fit: contain; background: var(--img-bg); }
.thumb.lg { width: 76px; height: 76px; font-size: 22px; border-radius: 14px; }
.thumb.art { padding: 3px; }
.thumb.art svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); }

.check {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: none; flex: none; padding: 0;
  display: flex; align-items: center; justify-content: center; color: var(--on-red); transition: background .15s ease, border-color .15s ease;
}
.check svg.i { width: 16px; height: 16px; stroke-width: 3; }
.check.on { background: var(--red); border-color: var(--red); }
.item.done .name { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.item.done .thumb { opacity: .45; }
.qty-tap {
  border: 0; background: var(--chip); border-radius: 12px; min-width: 50px; min-height: 44px; padding: 5px 8px; flex: none;
  display: flex; flex-direction: column; align-items: center; line-height: 1.1;
}
.qty-tap b { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; }
.qty-tap span { font-size: 11px; color: var(--muted); font-weight: 600; }
.item.done .qty-tap { opacity: .5; }
.more-btn { border: 0; background: none; color: var(--faint); width: 26px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; padding: 0; }

.pill { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

.list-head { display: flex; align-items: baseline; gap: 10px; }
.list-head h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty svg.i { width: 40px; height: 40px; color: var(--faint); }
.empty h3 { color: var(--text); margin: 12px 0 4px; }
.empty p { margin: 0; font-size: 14px; }

/* Sheets & dialogs */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .28s var(--ease-out) both; }
.overlay.closing { animation: fadeOut .24s ease forwards; pointer-events: none; }
.sheet {
  background: var(--bg); width: 100%; max-width: 640px; overflow-y: auto; overscroll-behavior: contain;
  max-height: calc(100dvh - env(safe-area-inset-top, 0px) - 12px);
  /* Extra 40px below the fold so the spring's small overshoot never shows a gap at the bottom. */
  border-radius: 22px 22px 0 0; padding: 10px 16px calc(58px + env(safe-area-inset-bottom, 0px)); margin-bottom: -40px;
  box-shadow: var(--sheet-shadow); animation: sheetIn .6s var(--spring) both;
}
.overlay.closing .sheet { animation: sheetOut .26s cubic-bezier(.4, 0, .9, .6) forwards; }
.sheet > * + * { margin-top: 10px; }
.sheet h2 { margin: 4px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.sheet .handle { width: 38px; height: 5px; background: var(--line); border-radius: 3px; margin: 0 auto 8px; }
.overlay.center { align-items: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: 22px; padding: 20px; width: 100%; max-width: 380px; animation: dialogIn .5s var(--spring) both; }
.overlay.closing .dialog { animation: dialogOut .2s ease forwards; }
.dialog p { margin: 0 0 16px; line-height: 1.45; }
.dialog .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.menu-list { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.menu-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 15px 16px; font-size: 16px; font-weight: 550; }
.menu-list button + button { border-top: 1px solid var(--line); }
.menu-list button.danger { color: var(--red); }
.qty { display: flex; align-items: center; gap: 8px; }
.qty button { width: 52px; height: 52px; border-radius: 14px; border: 0; background: var(--chip); font-size: 26px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.qty input { width: 80px; text-align: center; font-size: 28px; font-weight: 800; padding: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-variant-numeric: tabular-nums; }
.qty .unit { color: var(--muted); font-weight: 600; }
#toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  background: var(--toast); color: var(--on-toast); border-radius: 16px; padding: 11px 16px; z-index: 100;
  display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px); font-size: 14px; font-weight: 550; box-shadow: 0 6px 24px rgba(0,0,0,.25);
  opacity: 0; transform: translate(-50%, 18px) scale(.94); pointer-events: none;
  transition: opacity .2s ease, transform .5s var(--spring);
}
#toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
.update-dialog { text-align: center; }
.update-dialog h3 { margin: 10px 0 6px; font-size: 19px; font-weight: 800; }
.update-dialog p { color: var(--muted); font-size: 15px; }
.update-dialog .btns { justify-content: stretch; }
.update-dialog .btns .btn { flex: 1; }
.update-icon { width: 52px; height: 52px; margin: 0 auto; border-radius: 16px; background: var(--red); color: var(--on-red);
  display: flex; align-items: center; justify-content: center; }
.update-icon svg.i { width: 26px; height: 26px; }

/* ---------- Motion ----------
   Fluid, spring-based movement in the spirit of iOS 26: controls glide between states,
   sheets spring into place, presses give a soft squeeze and settle back. Small overshoot,
   short durations, nothing bouncy or translucent. All of it turns off with Reduce Motion. */
.seg { position: relative; isolation: isolate; }
nav.tabs { isolation: isolate; }   /* stays position: fixed (set above); fixed already anchors the sliding pill */
.seg button, nav.tabs button { position: relative; z-index: 1; transition: color .25s ease; }
/* Sliding selection pill (position set from JS on the element as --ind-x / --ind-w). */
.seg.has-ind::before, nav.tabs.has-ind::before {
  content: ""; position: absolute; z-index: 0; left: 0; width: var(--ind-w, 0);
  transform: translateX(var(--ind-x, 0)); pointer-events: none;
  transition: transform .55s var(--spring), width .55s var(--spring);
}
.seg.has-ind::before { top: 3px; bottom: 3px; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); }
.seg.has-ind button.active { background: none; box-shadow: none; }
nav.tabs.has-ind::before { top: 4px; height: 50px; background: var(--chip); border-radius: 18px; }
.seg.no-anim::before, nav.tabs.no-anim::before { transition: none; }
/* While the keyboard is open, the tab bar gets out of the way (like native iOS apps) instead of riding on top of it. */
nav.tabs { transition: transform .35s var(--ease-out), visibility 0s; }
body.kb-open nav.tabs { transform: translateY(110%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s; }
/* Every tab keeps the same icon and label position; the active one is shown by color and the pill only. */
nav.tabs button { height: 54px; justify-content: center; line-height: 1.2; }
nav.tabs button svg.i { display: block; transform: none; }

/* Press: quick squeeze, springy release. */
.btn, .chip, .qty-tap, .check, .more-btn, .qty button, .menu-list button, nav.tabs button, .seg button, .cam-stop, .sync-ind {
  transition: transform .5s var(--spring), background-color .2s ease, color .2s ease, border-color .2s ease, opacity .2s ease;
}
.btn:active, .chip:active, .qty-tap:active, .qty button:active, .more-btn:active, .cam-stop:active, .sync-ind:active { transform: scale(.94); transition-duration: .12s; transition-timing-function: ease-out; }
.check:active { transform: scale(.88); transition-duration: .12s; }
.seg button:active { transform: scale(.95); transition-duration: .12s; }
nav.tabs button, nav.tabs button:active { transform: none; }   /* no squeeze: Safari can leave tapped tabs looking pressed */
.menu-list button:active { background: var(--chip); transform: scale(.985); transition-duration: .1s; }
.item.tap { transition: transform .5s var(--spring), background-color .2s ease; }
.item.tap:active { transform: scale(.985); transition-duration: .12s; }

/* Things arriving. */
.view.active { animation: viewIn .42s var(--ease-out) both; }
.item.enter { animation: rowIn .55s var(--spring) both; }
.banner { animation: bannerIn .5s var(--spring) both; }
.check.on.pop svg.i { animation: checkIn .45s var(--spring) both; }   /* only when just crossed off */
.item .name, .item .thumb { transition: color .3s ease, opacity .3s ease; }
.last.refresh > * { animation: lastIn .45s var(--spring) both; }
#reader video { animation: fade .45s ease both; }
.bump { animation: bump .45s var(--spring); }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheetOut { to { transform: translateY(100%); } }
@keyframes dialogIn { from { transform: scale(.9); opacity: 0; } 40% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes dialogOut { to { transform: scale(.95); opacity: 0; } }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes rowIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes bannerIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes checkIn { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lastIn { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
#toast button { background: none; border: 0; color: var(--toast-action); font-weight: 800; letter-spacing: .04em; padding: 0; }

/* More */
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.status-dot.ok { background: var(--ok); } .status-dot.warn { background: var(--warn); } .status-dot.bad { background: var(--red); }
details.owner summary { cursor: pointer; font-weight: 650; color: var(--muted); font-size: 14px; list-style: none; }
details.owner summary::-webkit-details-marker { display: none; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
.foot { text-align: center; color: var(--faint); font-size: 12px; margin: 20px 0 8px; }

/* ---------- Beta 4: voice notes ---------- */
.camera { aspect-ratio: auto; width: 100%; height: 40dvh; }
.camera video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; animation: fade .45s ease both; }
.camera .cam-off, .camera .cam-wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; color: var(--on-cam); text-align: center; }
.camera .cam-wait { font-size: 14px; }
.camera .cam-off p { margin: 0; font-size: 13px; max-width: 30ch; }
.camera .cam-off .btn.quiet { background: rgba(255,255,255,.14); color: #fff; }
#view-capture > * + * { margin-top: 10px; }
.cap-bar { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.shutter-big { width: 82px; height: 82px; border-radius: 50%; border: 4px solid var(--red); background: var(--surface); padding: 5px; transition: transform .45s var(--spring); }
.shutter-big span { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--red); }
.shutter-big:active { transform: scale(.9); transition-duration: .1s; }

.cap-hint { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
.cap-links { display: flex; gap: 8px; }

.queue-line { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
.queue-line.busy::before, .spin { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border: 2px solid var(--line); border-top-color: var(--red); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.card.last, #last-note { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.last-text { font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#last-note svg.i { color: var(--faint); }
.banner.warn { background: var(--warn-soft); }
.banner.busy { background: var(--chip); }
.banner svg.i { color: var(--warn); }

/* Recorder sheet */
.rec-sheet { text-align: center; }
.rec-sheet h2 { text-align: center; }
.rec-meter { height: 12px; border-radius: 6px; background: var(--chip); overflow: hidden; margin: 14px 4px 0; }
.rec-meter i { display: block; height: 100%; width: 100%; background: var(--red); transform: scaleX(0); transform-origin: left; transition: transform .08s linear; }
.rec-time { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.rec-done { padding: 16px; font-size: 18px; }
.rec-alt .btn { font-size: 14px; }

/* Needed list */
.need .check { margin-right: 0; }
.jump-btn { border: 0; background: var(--chip); color: var(--muted); width: 40px; height: 44px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; padding: 0; transition: transform .5s var(--spring), background-color .2s ease; }
.jump-btn:active { transform: scale(.92); transition-duration: .12s; }
.item.need { padding-right: 10px; }
.item.done .jump-btn { opacity: .5; }
.pill.warn { white-space: nowrap; }
.src-row { padding: 12px; }
.src-text { font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.src-row .qty button { width: 44px; height: 44px; font-size: 22px; }
.src-row .qty input { width: 64px; font-size: 22px; padding: 6px; }

/* Notes */
.note-photo { position: relative; width: 84px; height: 84px; flex: none; border: 0; padding: 0; border-radius: 14px; overflow: hidden; background: var(--chip); }
.note-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.note-photo.missing::after, .shelf-thumb.missing::after { content: "No photo"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
.note-photo .count { position: absolute; right: 4px; bottom: 4px; min-width: 18px; height: 18px; border-radius: 9px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; font-weight: 800; line-height: 18px; text-align: center; }
.card.note { padding: 12px; transition: box-shadow .3s ease, background-color .4s ease; }
.card.note > * + * { margin-top: 10px; }
.transcript { font-size: 15px; line-height: 1.35; color: var(--text); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; cursor: text; }
.note-items { border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.note-items .item { min-height: 56px; }
.note-items .item + .item::before { left: 66px; }
.note-item .qty-tap { pointer-events: none; }
@keyframes flashNote { 0% { box-shadow: 0 0 0 3px var(--red); } 70% { box-shadow: 0 0 0 3px var(--red); } 100% { box-shadow: var(--shadow); } }
@keyframes flashItem { 0%, 70% { background: var(--warn-soft); } 100% { background: transparent; } }
.card.note.flash { animation: flashNote 2.2s ease both; }
.note-item.flash { animation: flashItem 2.2s ease both; }

/* More: model download */
.mprog { height: 10px; border-radius: 5px; background: var(--chip); overflow: hidden; margin-top: 12px; }
.mprog i { display: block; height: 100%; width: 0; background: var(--red); transition: width .3s ease; }

.item.need .sub, .note-item .sub { white-space: normal; overflow: visible; }

</head>

<main>

function buildSeedProducts() {

// ---------- On-device voice models and the note queue ----------
// A note goes: queued (voice clip waiting) → heard (text waiting for the language model) → reading → done.
// The queue runs in the background (oldest note first, listening before reading) so you can keep snapping
// shelves, or walk to the back room, while the phone works through it.
const MODEL_INFO = {
  asr: { name: "Speech to text", detail: "Whisper Base", size: "about 80 MB" },
  fast: { name: "Language", detail: "Qwen 2.5 0.5B", size: "about 0.8 GB" },
};
const MODEL_CACHE_HINT = { asr: "whisper-base.en", fast: "Qwen2.5-0.5B-Instruct" };
const ai = {
  worker: null, ready: {}, device: {}, probe: null,
  dl: { key: null, loaded: 0, total: 0, error: "" },   // the download in progress, if any
  pumping: false, pending: new Map(), seq: 0, wake: null,
};
const haveModel = key => !!state.settings.models[key];

function activeLLM() { return haveModel("fast") ? "fast" : null; }
const voiceReady = () => haveModel("asr") && !!activeLLM();

function getWorker() {

    if (m.type === "probe") { ai.probe = m; if (view === "more") renderMore(); return; }
    const p = ai.pending.get(m.id != null ? m.id : "load:" + m.key);
    if (!p) return;
    if (m.type === "error") { ai.pending.delete(m.id != null ? m.id : "load:" + m.key); p.reject(new Error(m.message)); }
    else if (m.type === "ready") { ai.device[m.key] = m.device; ai.pending.delete("load:" + m.key); p.resolve(m); }
    else if (m.type === "text" || m.type === "items") { ai.pending.delete(m.id); p.resolve(m); }
  };

}

    ai.pending.set(id, { resolve: v => { clearTimeout(timer); resolve(v); }, reject: e => { clearTimeout(timer); reject(e); } });

  });
}

// ---- Downloading ----
async function downloadModels(keys) {
  if (ai.dl.key) return;
  if (!navigator.onLine) return toast("No signal. Connect to Wi-Fi to download.");
  ai.dl.error = "";
  try {
    for (const key of keys) {
      if (haveModel(key)) continue;
      ai.dl = { key, loaded: 0, total: 0, error: "" };
      if (view === "more") renderMore();
      await workerCall({ type: "load", key });     // no timeout: it's a big download
      state.settings.models[key] = true; save();
    }
    ai.dl = { key: null, loaded: 0, total: 0, error: "" };
    toast("Voice models ready");
  } catch (e) {
    ai.dl = { key: null, loaded: 0, total: 0, error: e.message || "Download failed" };
    failAllPending(e);
  }
  renderAll(); pump();
}
function updateModelProgress() {
  const bar = document.querySelector("[data-mprog]");
  if (!bar || !ai.dl.key) return;
  const t = ai.dl.total, pct = t ? Math.min(100, Math.round(ai.dl.loaded / t * 100)) : 0;
  bar.querySelector("i").style.width = pct + "%";
  const lab = document.querySelector("[data-mprog-label]");
  if (lab) lab.textContent = t ? `${MODEL_INFO[ai.dl.key].name}: ${(ai.dl.loaded / 1e6).toFixed(0)} of ${(t / 1e6).toFixed(0)} MB` : `${MODEL_INFO[ai.dl.key].name}: starting…`;
}
async function deleteModels() {
  failAllPending(new Error("cancelled"));
  try {
    const c = await caches.open("transformers-cache");
    for (const req of await c.keys()) await c.delete(req);
  } catch (e) { /* nothing cached */ }
  state.settings.models = { asr: false, fast: false };
  ai.ready = {}; save(); renderAll();
}
// If the phone cleared the downloaded files (low storage), forget that they were downloaded so nothing re-downloads in the background.
async function verifyModels() {
  try {
    if (!("caches" in self)) return;
    const c = await caches.open("transformers-cache");
    const urls = (await c.keys()).map(r => r.url);
    let changed = false;
    for (const key of Object.keys(MODEL_CACHE_HINT)) {
      if (state.settings.models[key] && !urls.some(u => u.includes(MODEL_CACHE_HINT[key]))) { state.settings.models[key] = false; changed = true; }

// ---- The queue ----
const nextNote = status => [...state.notes].reverse().find(n => n.status === status);

  const needAsr = left.some(n => n.status === "queued"), needLLM = left.some(n => n.status === "heard" || n.status === "reading");
  if ((needAsr && !haveModel("asr")) || (needLLM && !activeLLM() && !needAsr)) return { busy: false, blocked: true, text: `${left.length} note${left.length === 1 ? "" : "s"} waiting. Download the voice models in More.` };
  return { busy: true, text: `Reading ${left.length} note${left.length === 1 ? "" : "s"}…` };
}
async function holdScreenOn() {

}

async function pump() {

}
async function listenTo(n) {

}
function renderQueueStatus() { if (view === "needed" || view === "notes" || view === "capture") renderAll(); }

// Shared data on GitHub
// ============================================================
function b64encode(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64decode(b64) { return decodeURIComponent(escape(atob(b64.replace(/\s/g, "")))); }
const bytesToB64 = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)));
const b64ToBytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const apiBase = `https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}`;

function emptyShared() { return { version: 1, updated: 0, products: {}, tags: {}, deleted: { products: {}, tags: {} } }; }
function normShared(d) {
  const s = emptyShared();
  if (!d || typeof d !== "object") return s;
  s.updated = d.updated || 0;
  s.products = d.products || {}; s.tags = d.tags || {};
  s.deleted.products = (d.deleted && d.deleted.products) || {}; s.deleted.tags = (d.deleted && d.deleted.tags) || {};
  if (d.config) s.config = d.config;
  s.tagsResetAt = d.tagsResetAt || 0;   // set by "Reset shared tags": links made before this are gone everywhere
  return s;
}

// Read a repo file. With a token: GitHub API (fresh, gives the sha needed to write).
// Without: public API first, then the Pages copy next to the app.
async function readRepoFile(path, token) {
  const headers = { Accept: "application/vnd.github+json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  try {
    const r = await fetch(`${apiBase}/contents/${path}?ref=${GITHUB.branch}&t=${Date.now()}`, { headers, cache: "no-store" });
    if (r.status === 404) return { text: null, sha: null };
    if (r.ok) {
      const j = await r.json();
      if (j.content) return { text: b64decode(j.content), sha: j.sha };
      // Files over 1MB come back without content; fetch the raw bytes.
      const raw = await fetch(`${apiBase}/contents/${path}?ref=${GITHUB.branch}`, { headers: { ...headers, Accept: "application/vnd.github.raw" }, cache: "no-store" });
      if (raw.ok) return { text: await raw.text(), sha: j.sha };
    }
    if (token) throw new Error(`GitHub said ${r.status}`);
  } catch (e) { if (token) throw e; }
  const r = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });   // Pages copy (may lag a minute)
  if (r.status === 404) return { text: null, sha: null };
  if (!r.ok) throw new Error(`Couldn't load shared data (${r.status})`);
  return { text: await r.text(), sha: null };
}
async function writeRepoFile(path, text, sha, token, message) {
  const r = await fetch(`${apiBase}/contents/${path}`, {
    method: "PUT",
    headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ message, content: b64encode(text), branch: GITHUB.branch, ...(sha ? { sha } : {}) }),
  });
  if (r.status === 409 || r.status === 422) { const e = new Error("conflict"); e.conflict = true; throw e; }
  if (r.status === 401 || r.status === 403) { const e = new Error("GitHub rejected the upload key"); e.auth = true; throw e; }
  if (!r.ok) throw new Error(`GitHub said ${r.status}`);
  return (await r.json()).content.sha;
}

// Merge shared data into this phone. Newest change wins, item by item.
function applyShared(remote, { overwrite = false } = {}) {
  remote = normShared(remote);
  if (overwrite) {
    const map = new Map(buildSeedProducts().map(p => [p.id, p]));
    for (const id in remote.products) map.set(id, { ...remote.products[id] });
    for (const id in remote.deleted.products) map.delete(id);
    state.products = [...map.values()];
    const tags = {};
    for (const code in remote.tags) {
      const rt = remote.tags[code];
      if (!map.has(rt.productId)) continue;
      tags[code] = { ...rt, lastSeen: (state.tags[code] && state.tags[code].lastSeen) || rt.created || Date.now() };
    }
    state.tags = tags;
    state.deleted = { products: {}, tags: {} };
    state.outbox = { products: {}, tags: {} };
    state.config = { perStoreTags: false, updated: 0, ...(remote.config || {}) };
    state.sync.tagsResetAt = remote.tagsResetAt || 0;
  } else {
    if (remote.config && (remote.config.updated || 0) > (state.config.updated || 0)) {
      state.config = { ...state.config, ...remote.config };
      delete state.outbox.config;
    }
    // Shared tags were reset: drop every local link made before the reset (including ones never uploaded).
    if (remote.tagsResetAt) {
      for (const k of Object.keys(state.tags)) if ((state.tags[k].updated || 0) <= remote.tagsResetAt) { delete state.tags[k]; delete state.outbox.tags[k]; }
      state.sync.tagsResetAt = remote.tagsResetAt;
    }
    const localTs = id => { const p = productById(id); return Math.max(p ? p.updated || 0 : 0, state.deleted.products[id] || 0); };
    for (const id in remote.products) {
      const rp = remote.products[id];
      if ((rp.updated || 0) <= localTs(id)) continue;
      const i = state.products.findIndex(p => p.id === id);
      if (i >= 0) state.products[i] = { ...rp }; else state.products.push({ ...rp });
      delete state.deleted.products[id]; delete state.outbox.products[id];
    }
    for (const id in remote.deleted.products) {
      const ts = remote.deleted.products[id];
      if (ts <= localTs(id)) continue;
      state.products = state.products.filter(p => p.id !== id);
      state.deleted.products[id] = ts; delete state.outbox.products[id];
    }
    const tagTs = c => Math.max(state.tags[c] ? state.tags[c].updated || 0 : 0, state.deleted.tags[c] || 0);
    for (const code in remote.tags) {
      const rt = remote.tags[code];
      if ((rt.updated || 0) <= tagTs(code)) continue;
      state.tags[code] = { ...rt, lastSeen: (state.tags[code] && state.tags[code].lastSeen) || rt.created || Date.now() };
      delete state.deleted.tags[code]; delete state.outbox.tags[code];
    }
    for (const code in remote.deleted.tags) {
      const ts = remote.deleted.tags[code];
      if (ts <= tagTs(code)) continue;
      delete state.tags[code];
      state.deleted.tags[code] = ts; delete state.outbox.tags[code];
    }
  }
  // Keep things consistent: tags must point at real products, one tag per product per scope (newest wins).
  const byProduct = {};
  for (const key of Object.keys(state.tags)) {
    const t = state.tags[key];
    if (!productById(t.productId)) { delete state.tags[key]; continue; }
    const slot = (STORE_KEY_RE.test(key) ? "store:" + scopeOfKey(key) : "shared") + "/" + t.productId;
    const prev = byProduct[slot];
    if (prev && state.tags[prev].updated >= t.updated) delete state.tags[key];
    else { if (prev) delete state.tags[prev]; byProduct[slot] = key; }
  }

  for (const n of state.notes) for (const it of n.items) if (it.pid && !productById(it.pid)) { it.pid = null; it.conf = "check"; it.why = "no match"; }
  state.products.forEach(p => (p._st = undefined));

}

async function pullShared({ overwrite = false, quiet = true } = {}) {
  let token = null;
  if (uploadsEnabled()) { try { token = await getToken(); } catch (e) { /* read without it */ } }
  const { text } = await readRepoFile(GITHUB.dataPath, token);
  const remote = text ? JSON.parse(text) : emptyShared();
  applyShared(remote, { overwrite });
  state.sync.lastPull = Date.now();
  if (!uploadsEnabled()) state.sync.error = "";
  save(); renderAll();
  if (!quiet) toast(overwrite ? "Replaced with the shared data" : "Up to date");
}

// ---------- Upload key (encrypted with the team password) ----------

  return { v: 1, kdf: "PBKDF2-SHA256", iter: KDF_ITER, salt: bytesToB64(salt), iv: bytesToB64(iv), ct: bytesToB64(ct) };
}

const uploadsEnabled = () => !!getPass();

}

  catch (e) { const err = new Error("The upload password no longer works. Enable uploads again."); err.auth = true; throw err; }

}

// ---------- Automatic uploads ----------
let uploadTimer = null, uploading = false, uploadAgain = false;
function scheduleUpload(delay = UPLOAD_DELAY_MS) {
  renderSyncIndicator();
  if (!uploadsEnabled()) return;
  clearTimeout(uploadTimer);
  uploadTimer = setTimeout(uploadChanges, delay);
}
async function uploadChanges() {
  if (!uploadsEnabled() || !pendingCount()) { renderSyncIndicator(); return; }
  if (!navigator.onLine) { state.sync.error = "offline"; renderSyncIndicator(); return; }
  if (uploading) { uploadAgain = true; return; }
  uploading = true; renderSyncIndicator();
  try {
    const token = await getToken();
    // What we're sending, with the timestamp it had, so later edits aren't wrongly cleared.
    const sentP = {}, sentT = {};
    for (const id in state.outbox.products) { const p = productById(id); sentP[id] = p ? p.updated : state.deleted.products[id] || 0; }
    for (const c in state.outbox.tags) { const t = state.tags[c]; sentT[c] = t ? t.updated : state.deleted.tags[c] || 0; }
    for (let attempt = 0; attempt < 4; attempt++) {
      const { text, sha } = await readRepoFile(GITHUB.dataPath, token);
      const R = normShared(text ? JSON.parse(text) : null);
      let n = 0;
      for (const id in sentP) {
        const rTs = Math.max((R.products[id] && R.products[id].updated) || 0, R.deleted.products[id] || 0);
        if (rTs > sentP[id]) continue;                         // someone else changed it more recently
        const p = productById(id);
        if (p) { R.products[id] = shareable(p); delete R.deleted.products[id]; }
        else { delete R.products[id]; R.deleted.products[id] = state.deleted.products[id] || Date.now(); }
        n++;
      }
      for (const c in sentT) {
        const rTs = Math.max((R.tags[c] && R.tags[c].updated) || 0, R.deleted.tags[c] || 0, R.tagsResetAt || 0);
        if (rTs > sentT[c]) continue;                         // newer elsewhere, or made before a tag reset
        const t = state.tags[c];
        if (t) { R.tags[c] = tagShareable(t); delete R.deleted.tags[c]; }
        else { delete R.tags[c]; R.deleted.tags[c] = state.deleted.tags[c] || Date.now(); }
        n++;
      }
      const sentConfig = state.outbox.config ? state.config.updated : null;
      if (sentConfig !== null && (!R.config || (R.config.updated || 0) <= sentConfig)) { R.config = { ...state.config }; n++; }
      R.updated = Date.now();
      try {
        await writeRepoFile(GITHUB.dataPath, JSON.stringify(R, null, 1), sha, token,
          `Shelf Scan: ${n} change${n === 1 ? "" : "s"}${state.storeName ? ` (store ${state.storeName})` : ""}`);
      } catch (e) { if (e.conflict) continue; throw e; }   // someone uploaded at the same moment; re-read and retry
      for (const id in sentP) {
        const p = productById(id), now = p ? p.updated : state.deleted.products[id] || 0;
        if (now === sentP[id]) delete state.outbox.products[id];
      }
      for (const c in sentT) {
        const t = state.tags[c], now = t ? t.updated : state.deleted.tags[c] || 0;
        if (now === sentT[c]) delete state.outbox.tags[c];
      }
      if (sentConfig !== null && state.config.updated === sentConfig) delete state.outbox.config;
      applyShared(R);                                        // pick up everyone else's changes too
      state.sync.lastPush = state.sync.lastPull = Date.now();
      state.sync.error = "";
      save(); renderAll();
      return;
    }
    throw new Error("Too many people uploading at once. Will retry.");
  } catch (e) {
    state.sync.error = e.message || String(e);
    if (e.auth) cachedToken = null;
    save();
    if (!e.auth) scheduleUpload(30000);                      // try again shortly
  } finally {
    uploading = false;
    renderSyncIndicator();
    if (view === "more") renderMore();
    if (uploadAgain) { uploadAgain = false; scheduleUpload(500); }
  }
}
window.addEventListener("online", () => { state.sync.error = ""; scheduleUpload(500); });

function syncStatus() {
  const n = pendingCount();
  if (!uploadsEnabled()) return { dot: "", text: "Uploads are off on this phone", short: "" };
  if (uploading) return { dot: "warn", text: `Uploading ${n} change${n === 1 ? "" : "s"}…`, short: "up" };
  if (state.sync.error === "offline" || (!navigator.onLine && n)) return { dot: "warn", text: `${n} change${n === 1 ? "" : "s"} waiting for signal`, short: "wait" };

function shrinkImage(file, max) {
  return new Promise(resolve => {

    img.onload = () => {

      resolve(c.toDataURL("image/jpeg", 0.72));
    };

    img.src = URL.createObjectURL(file);
  });
}

// Play back a note's recording.
let playCtx = null;
async function playNote(n) {
  const rec = n.audio && await getAudio(n.audio).catch(() => null);
  if (!rec) return toast("No recording for this note");
  const i16 = new Int16Array(rec.pcm);
  playCtx = playCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (playCtx.state === "suspended") await playCtx.resume();
  const buf = playCtx.createBuffer(1, i16.length, rec.rate), ch = buf.getChannelData(0);
  for (let i = 0; i < i16.length; i++) ch[i] = i16[i] / 32768;
  const src = playCtx.createBufferSource(); src.buffer = buf; src.connect(playCtx.destination); src.start();
}

// ---------- Needed (the short list) ----------
function neededRows() {
  const map = new Map();
  for (const n of state.notes) n.items.forEach((it, idx) => {
    const p = itemProduct(it);
    const key = p ? p.id : "?" + sNorm(it.phrase);
    let r = map.get(key);
    if (!r) map.set(key, r = { key, p, phrase: it.phrase, qty: 0, unknown: false, check: false, done: true, src: [] });
    if (it.qty == null) r.unknown = true; else r.qty += it.qty;
    if (it.conf === "check" || !p) r.check = true;
    if (!it.done) r.done = false;
    r.src.push({ n, idx, it });
  });
  return [...map.values()];
}
function qtyLabel(r) { return r.unknown ? (r.qty ? `${r.qty}+` : "?") : String(r.qty); }

  const v = $("#view-needed");

  if (check.length) html += `<div class="banner warn">${icon("warn")}<span class="grow">${check.length} ${check.length === 1 ? "item needs" : "items need"} a quick look. Tap a row marked “check”.</span></div>`;
  // Group by product group, unmatched first.
  const groups = new Map();
  for (const r of rows) { const g = r.p ? r.p.category : "Not matched to a product"; (groups.get(g) || groups.set(g, []).get(g)).push(r); }
  const order = [...groups.keys()].sort((a, b) => (a.startsWith("Not matched") ? -1 : b.startsWith("Not matched") ? 1 : catSort(a, b)));
  for (const g of order) {
    html += `<div class="group-h">${esc(g)}</div><div class="list">` + groups.get(g).map(r => needRow(r)).join("") + `</div>`;
  }

    const r = rows.find(x => x.key === row.dataset.k); if (!r) return;

    if (a === "toggle") { const to = !r.done; r.src.forEach(s => (s.it.done = to)); save(); renderAll(); }

}

// The notes behind one row of the list: change the product, the quantities, or go to a note.

async function onNotesClick(e) {

  if (a === "menu") {
    const pick = await menu("Note", [
      { label: "Edit what was heard", value: "edit" }, ...(n.audio ? [{ label: "Play recording", value: "play" }] : []),

async function editText(n) {

async function addItem(n) {

// A number stepper. Resolves the number, or undefined when cancelled.

// Jump from a list row to the note (and item) it came from.

  const v = $("#view-products");
  if (!v.querySelector("input")) {
    v.innerHTML = `<div class="list-head"><h2>Products</h2><span class="grow"></span><button class="btn sm primary" data-a="add">${icon("plus")}Add</button></div>
      ${searchBox("Search products")}<div class="chips"></div>
      <p class="hint" id="prod-count"></p><div id="prod-results"></div>`;
    v.querySelector("input").addEventListener("input", debounce(e => { prodQuery = e.target.value; renderProductResults(); }));
    v.querySelector('[data-a="add"]').onclick = () => editProduct(null, { prefillName: prodQuery });
  }
  const chips = v.querySelector(".chips");
  chips.innerHTML = "";
  for (const c of ["", ...allCategories(), "Retired"]) {
    const b = el(`<button class="chip${c === prodCat ? " active" : ""}"></button>`);
    b.textContent = c || "All";
    b.onclick = () => { prodCat = c; renderProducts(); };
    chips.appendChild(b);
  }
  renderProductResults();
}
function renderProductResults() {
  const v = $("#view-products");
  let items = prodCat === "Retired"
    ? searchProducts(prodQuery, { includeRetired: true }).filter(p => p.retired)
    : searchProducts(prodQuery, { category: prodCat });
  if (!prodQuery) items = [...items].sort((a, b) => catSort(a.category, b.category) || pName(a).localeCompare(pName(b)));
  v.querySelector("#prod-count").textContent = `${items.length} product${items.length === 1 ? "" : "s"}`;
  const box = v.querySelector("#prod-results");
  box.innerHTML = "";
  const shown = items.slice(0, 200);
  if (shown.length) box.appendChild(listOf(shown, pid => editProduct(pid), p =>
    (p.custom ? ` <span class="pill">CUSTOM</span>` : "")));
  else box.appendChild(el(`<div class="empty"><p>No products match.</p></div>`));
  if (items.length > shown.length) box.appendChild(el(`<p class="hint center" style="padding:10px">${items.length - shown.length} more. Search to narrow it down.</p>`));
}

// More
function modelRow(key) {
  const i = MODEL_INFO[key], have = haveModel(key), busy = ai.dl.key === key;
  const dot = have ? "ok" : busy ? "warn" : "";
  return `<div class="set-row"><span class="status-dot ${dot}"></span><div class="grow"><b>${esc(i.name)}</b><br><span class="hint">${esc(i.detail)} · ${esc(i.size)}</span></div>
    <span class="small muted">${have ? "Ready" : busy ? "Downloading" : "Not downloaded"}</span></div>`;
}
function renderMore() {
  const v = $("#view-more");
  const s = syncStatus();
  const on = uploadsEnabled();
  const llm = "fast";
  const need = ["asr", llm].filter(k => !haveModel(k));
  const anyModel = ["asr", "fast"].some(haveModel);
  const dl = ai.dl.key;
  const dev = ai.device[activeLLM() || ""] || "";
  v.innerHTML = `
    <div class="list-head"><h2>More</h2></div>
    <div class="card">
      <h3>Voice models</h3>
      <p class="hint">Listening and reading run on this phone, so they work with no signal. They download once (use Wi-Fi), then stay on the phone.</p>
      ${modelRow("asr")}${modelRow(llm)}
      ${dl ? `<div class="mprog" data-mprog><i></i></div><p class="hint" data-mprog-label style="margin-top:6px">Starting…</p>` : ""}
      ${ai.dl.error ? `<div class="banner warn" style="margin-top:8px">${icon("warn")}<span class="grow">${esc(ai.dl.error)}</span></div>` : ""}
      <div class="stack" style="margin-top:10px">
        ${need.length ? `<button class="btn primary block" id="btn-dl" ${dl ? "disabled" : ""}>${icon("download")}${dl ? "Downloading…" : ai.dl.error ? "Try again" : `Download ${need.length === 2 ? "voice models" : "missing model"}`}</button>` : ""}
        ${anyModel && !dl ? `<button class="btn block quiet" id="btn-del-models">Delete downloaded models</button>` : ""}
      </div>
      <p class="hint" style="margin-top:8px">${dev ? `Reading runs on the phone's ${dev === "webgpu" ? "graphics chip" : "processor"}.` : ""}${ai.probe ? ` ${ai.probe.webgpu ? "Graphics acceleration is available." : ""}` : ""}</p>
    </div>
    <div class="card">
      <h3>Shared data</h3>
      <p class="hint">The product list is shared with everyone who uses Shelf Scan. Your notes and photos stay on this phone.</p>
      <div class="set-row"><span class="status-dot ${s.dot}"></span><span class="grow small">${esc(s.text)}</span></div>
      <div class="set-row"><span class="grow small muted">Last updated from GitHub: ${ago(state.sync.lastPull)}</span></div>
      <div class="stack">
        ${on ? `<button class="btn block" id="btn-upload-now">${icon("upload")}Upload now</button>`
             : `<button class="btn primary block" id="btn-enable">${icon("upload")}Enable uploads</button>`}
        <button class="btn block" id="btn-sync">${icon("refresh")}Sync from GitHub</button>
        ${on ? `<button class="btn block quiet" id="btn-disable">Turn off uploads on this phone</button>` : ""}
      </div>
    </div>
    <div class="card">
      <h3>This phone</h3>
      <label class="f" for="store-name">Store number</label>
      <input class="field" id="store-name" placeholder="e.g. 1234" value="${esc(state.storeName)}">
      <div class="set-row" style="margin-top:6px"><label class="grow" for="beep">Shutter beep</label><input type="checkbox" id="beep" ${state.settings.beep ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--red)"></div>
    </div>
    <div class="card">
      <h3>Backup</h3>
      <p class="hint">Copies the product list and the written notes. Photos and recordings can't be included.</p>
      <div class="stack" style="margin-top:10px">
        <button class="btn block" id="btn-export">Copy backup</button>
        <textarea class="field" id="backup-text" rows="3" placeholder="Paste a backup here to restore" style="font:16px ui-monospace,Menlo,monospace"></textarea>
        <button class="btn block" id="btn-restore">Restore from pasted backup</button>
      </div>
    </div>
    <div class="card">
      <details class="owner"><summary>Owner setup: upload key</summary>
        <p class="hint" style="margin-top:10px">Only needed once, by the repo owner. Paste a GitHub key that can write to ${esc(GITHUB.owner)}/${esc(GITHUB.repo)} and choose the team password. The key is encrypted on this phone before it's saved.</p>
        <label class="f" for="own-token">GitHub key</label><input class="field" id="own-token" type="password" autocomplete="off" placeholder="github_pat_…">
        <label class="f" for="own-pass">Team password</label><input class="field" id="own-pass" type="text" autocomplete="off" autocapitalize="off" placeholder="At least 6 characters">
        <button class="btn primary block" id="btn-own-save" style="margin-top:12px">Save key and enable uploads</button>
      </details>
    </div>
    <div class="card">
      <h3>Danger zone</h3>
      <div class="stack" style="margin-top:10px"><button class="btn block danger" id="btn-reset">Reset this phone</button></div>
    </div>
    <p class="foot">Shelf Scan Beta 4 (voice notes) · ${state.products.length} products · ${state.notes.length} note${state.notes.length === 1 ? "" : "s"}<br>
      <span style="opacity:.7">Screen ${screen.width}×${screen.height}${navigator.standalone ? " · home screen" : ""}</span></p>`;
  if (dl) updateModelProgress();
  v.querySelector("#store-name").onchange = e => { state.storeName = e.target.value.trim(); save(); renderAll(); };
  v.querySelector("#beep").onchange = e => { state.settings.beep = e.target.checked; save(); };
  const dlb = v.querySelector("#btn-dl"); if (dlb) dlb.onclick = () => downloadModels(need);
  const del = v.querySelector("#btn-del-models"); if (del) del.onclick = async () => {
    if (!(await confirmDialog("Delete the downloaded voice models? Notes already read keep their lists. New notes wait until you download them again.", { ok: "Delete", danger: true }))) return;
    await deleteModels(); toast("Models deleted");
  };
  v.querySelector("#btn-export").onclick = exportBackup;
  v.querySelector("#btn-restore").onclick = () => restoreBackupText(v.querySelector("#backup-text").value);
  v.querySelector("#btn-sync").onclick = syncFromGitHub;
  const en = v.querySelector("#btn-enable"); if (en) en.onclick = enableUploads;
  const up = v.querySelector("#btn-upload-now"); if (up) up.onclick = () => { state.sync.error = ""; uploadChanges(); renderMore(); };
  const dis = v.querySelector("#btn-disable"); if (dis) dis.onclick = async () => {
    if (!(await confirmDialog("Turn off uploads on this phone? Your changes will stay on this phone only.", { ok: "Turn off" }))) return;
    setPass(""); cachedToken = null; renderAll();
  };
  v.querySelector("#btn-own-save").onclick = ownerSetup;
  v.querySelector("#btn-reset").onclick = async () => {
    const n = pendingCount();
    if (!(await confirmDialog(`Erase everything on this phone (notes, photos and settings) and start fresh from the shared product list?${n ? `<br><br><b>${n} change${n === 1 ? " hasn't" : "s haven't"} uploaded</b> and will be lost.` : ""}`, { ok: "Erase", danger: true }))) return;
    const keep = state.sync, models = state.settings.models;
    state = freshState(); state.sync = keep; state.settings.models = models; save(); renderAll(); scheduleSweep();
    pullShared({ overwrite: true, quiet: false }).catch(e => toast(e.message));
  };
}
function passwordDialog(title, note, okLabel = "Enable") {
  return new Promise(resolve => {
    const d = el(`<div class="dialog"><p><b>${esc(title)}</b><br><span class="hint">${esc(note)}</span></p>
      <input class="field" type="text" id="pw-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Password">
      <p class="hint" id="pw-err" style="color:var(--red);margin:8px 0 0"></p>
      <div class="btns" style="margin-top:14px"><button class="btn" data-a="c">Cancel</button><button class="btn primary" data-a="ok">${esc(okLabel)}</button></div></div>`);
    let done = false;
    const close = openLayer(d, { center: true, onClose: () => { if (!done) resolve(null); } });
    const inp = d.querySelector("input"), err = d.querySelector("#pw-err"), ok = d.querySelector('[data-a="ok"]');
    d.querySelector('[data-a="c"]').onclick = () => { done = true; close(); resolve(null); };
    const go = async () => {
      if (!inp.value) return;
      ok.disabled = true; ok.textContent = "Checking…"; err.textContent = "";
      try { await resolveCheck(inp.value); done = true; close(); resolve(inp.value); }
      catch (e) { err.textContent = e.message; ok.disabled = false; ok.textContent = okLabel; }
    };
    let resolveCheck;
    d.check = fn => (resolveCheck = fn);
    ok.onclick = go;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    setTimeout(() => inp.focus(), 50);
    passwordDialog.current = d;
  });
}
async function enableUploads() {
  const p = passwordDialog("Enable uploads", "Enter the team password. You'll only need it once on this phone.");
  passwordDialog.current.check(async pw => {
    const blob = await loadKeyBlob();
    let token;
    try { token = await decryptToken(blob, pw); } catch (e) { throw new Error("That password isn't right."); }
    await checkToken(token);
    cachedToken = token;
  });
  const pw = await p;
  if (!pw) return;
  setPass(pw); state.sync.error = "";
  save(); renderAll();
  toast("Uploads enabled. Changes now upload automatically.");
  scheduleUpload(300);
}
async function ownerSetup() {
  const token = $("#own-token").value.trim(), pw = $("#own-pass").value;
  if (!token) return toast("Paste the GitHub key first");
  if (pw.length < 6) return toast("Use a password of at least 6 characters");
  const btn = $("#btn-own-save");
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    await checkToken(token);
    const blob = await encryptToken(token, pw);
    const { sha } = await readRepoFile(GITHUB.keyPath, token);
    await writeRepoFile(GITHUB.keyPath, JSON.stringify(blob, null, 1), sha, token, "Shelf Scan: set upload key");
    setPass(pw); cachedToken = token; state.sync.error = "";
    save(); renderAll();
    toast("Upload key saved. Uploads are on.");
    scheduleUpload(300);
  } catch (e) {
    toast(e.message || "Couldn't save the key");
    btn.disabled = false; btn.textContent = "Save key and enable uploads";
  }
}
async function syncFromGitHub() {
  const n = pendingCount();
  const ok = await confirmDialog(`Replace this phone's products, barcodes and tags with the shared data from GitHub? Your list is kept.${n ? `<br><br><b>${n} change${n === 1 ? " hasn't" : "s haven't"} uploaded</b> and will be lost.` : ""}`, { ok: "Replace", danger: !!n });
  if (!ok) return;
  if (!navigator.onLine) return toast("No signal. Try again when you're online.");
  toast("Syncing…");
  try { await pullShared({ overwrite: true, quiet: false }); }
  catch (e) { toast(e.message || "Couldn't reach GitHub"); }
}
function exportBackup() {
  const text = JSON.stringify(state);
  const box = $("#backup-text");
  const fallback = () => { box.value = text; box.focus(); box.select(); toast("Backup is in the box. Select all and copy it."); };
  try { navigator.clipboard.writeText(text).then(() => toast("Backup copied"), fallback); }
  catch (e) { fallback(); }
}
async function restoreBackupText(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { data = null; }
  if (!data || !data.products) { toast("That isn't a Shelf Scan backup"); return; }
  if (!(await confirmDialog("Replace everything on this phone with the backup?", { ok: "Replace", danger: true }))) return;
  const snap = snapshot(); state = data; migrate(); save(); renderAll(); toast("Backup restored", snap);
}


// ---------- Wire up ----------
fillIcons();
load();
document.querySelectorAll("#tabs button").forEach(b => (b.onclick = () => showView(b.dataset.view)));
$("#btn-cam-start").onclick = startCamera;
$("#btn-cam-stop").onclick = () => { state.settings.camOK = false; save(); stopCamera(); };
$("#btn-shutter").onclick = () => onShutter(false);
$("#btn-phonecam").onclick = () => onShutter(true);
$("#btn-type").onclick = async () => {
  const text = await textPrompt("Type what you need");
  if (text == null || !text) return;
  await saveNote({ photos: [], audioRec: null, secs: 0, text, status: "heard" });
  pump();
};
$("#sync-ind").onclick = () => showView("more");
renderAll();
save();
syncAllIndicators(false);
setTimeout(sweepMedia, 3000);   // tidy photos and recordings left over from deleted notes
if (state.settings.camOK) startCamera();
verifyModels().then(pump);      // anything still waiting from last time gets picked up

// Pull everyone's latest product list on open, then upload anything waiting.
if (navigator.onLine) pullShared().catch(() => {}).finally(() => scheduleUpload(1000));

// Updates: check for a new version whenever the app comes back to the foreground (home-screen apps on iPhone
// stay loaded for days), and offer a one-tap reload once it's installed.
if ("serviceWorker" in navigator && location.protocol === "https:") {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) showUpdateReady(); });
}
// Centered pop-up; "Later" dismisses it until the app next comes back to the foreground.
let updatePromptOpen = false, updateWaiting = false;
function showUpdateReady() {
  updateWaiting = true;
  if (updatePromptOpen) return;
  updatePromptOpen = true;
  const d = el(`<div class="dialog update-dialog" id="update-ready">
    <div class="update-icon">${icon("refresh")}</div>
    <h3>Update available</h3>
    <p>A new version of Shelf Scan is ready. Reload to start using it. Your notes and settings stay as they are.</p>
    <div class="btns"><button class="btn quiet" data-a="later">Later</button><button class="btn primary" data-a="reload">Reload now</button></div></div>`);
  const close = openLayer(d, { center: true, onClose: () => (updatePromptOpen = false) });
  d.querySelector('[data-a="reload"]').onclick = () => location.reload();
  d.querySelector('[data-a="later"]').onclick = close;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && updateWaiting) showUpdateReady(); });
</script>
