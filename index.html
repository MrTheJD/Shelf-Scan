      <div class="set-row"><span class="status-dot ${on ? "ok" : ""}"></span><span class="grow"><b>${on ? "Connected" : "Not connected"}</b><br><span class="hint">${on ? "This phone can send and receive team data." : "Enter the database key once to connect this phone."}</span></span>
        ${on ? "" : `<button class="btn sm primary" id="btn-enable">Connect</button>`}</div>
      <label class="f" for="team-key">Team key</label>
      <input class="field" id="team-key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="A word or number you both type" value="${esc(state.team.key)}">
      <label class="f" for="team-name">Your name (shown on your notes)</label>
      <input class="field" id="team-name" autocomplete="off" placeholder="e.g. James" value="${esc(state.team.name)}">
      <div class="set-row" style="margin-top:10px"><span class="status-dot ${ts.dot}" id="team-status-dot"></span><span class="grow small" id="team-status-text">${esc(ts.text)}</span></div>
      ${on ? `<div class="set-row"><span class="status-dot ${s.dot}"></span><span class="grow small">Product list: ${esc(s.text)}</span></div>` : ""}
      ${T.priv === false && teamKey() ? `<div class="banner warn" style="margin:8px 0">${icon("warn")}<span class="grow">The repo ${esc(teamRepo())} is public, so anyone who knows where to look can see shared notes and photos. Ask the owner to move team data to a private repo.</span></div>` : ""}
      <div class="stack" style="margin-top:10px">
        <button class="btn block" id="btn-team-test">${icon("refresh")}Test connection</button>
        ${on ? `<button class="btn block quiet" id="btn-disable">Disconnect</button>` : ""}
      </div>
    </div>
    <div class="card">
      <h3>This phone</h3>
      <label class="f" for="store-name">Store number</label>
      <input class="field" id="store-name" placeholder="e.g. 1234" value="${esc(state.storeName)}">
      <div class="set-row" style="margin-top:6px"><label class="grow" for="beep">Shutter beep</label><input type="checkbox" id="beep" ${state.settings.beep ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--red)"></div>
    </div>
    <div class="card">
      <h3>Backup</h3>
      <p class="hint">Copies the product list and the written notes. Photos and recordings can't be included.</p>
      <div class="stack" style="margin-top:10px">
        <button class="btn block" id="btn-export">Copy backup</button>
        <textarea class="field" id="backup-text" rows="3" placeholder="Paste a backup here to restore" style="font:16px ui-monospace,Menlo,monospace"></textarea>
        <button class="btn block" id="btn-restore">Restore from pasted backup</button>
      </div>
    </div>
    <div class="card">
      <details class="owner"><summary>Owner setup: database key</summary>
        <p class="hint" style="margin-top:10px">Only needed once, by the repo owner. Paste a GitHub access token that can write to ${esc(GITHUB.owner)}/${esc(GITHUB.repo)} and choose the database key. The token is encrypted on this phone before it's saved.</p>
        <label class="f" for="own-token">GitHub access token</label><input class="field" id="own-token" type="password" autocomplete="off" placeholder="github_pat_…">
        <label class="f" for="own-pass">Database key</label><input class="field" id="own-pass" type="text" autocomplete="off" autocapitalize="off" placeholder="At least 6 characters">
        <button class="btn primary block" id="btn-own-save" style="margin-top:12px">Save and connect</button>
      </details>
    </div>
    <div class="card">
      <h3>Danger zone</h3>
      <div class="stack" style="margin-top:10px"><button class="btn block danger" id="btn-reset">Reset this phone</button></div>
    </div>
    <p class="foot">Shelf Scan Beta 7 (before/after) · ${state.products.length} products · ${state.notes.length} note${state.notes.length === 1 ? "" : "s"}<br>
      <span style="opacity:.7">Screen ${screen.width}×${screen.height}${navigator.standalone ? " · home screen" : ""}</span></p>`;
  if (dl) updateModelProgress();
  v.querySelector("#store-name").onchange = e => { state.storeName = e.target.value.trim(); save(); renderAll(); };
  v.querySelector("#team-key").onchange = e => teamSetKey(e.target.value);
  v.querySelector("#team-name").onchange = e => { state.team.name = e.target.value.trim(); save(); teamSoon(300); };
  v.querySelector("#btn-team-test").onclick = teamTest;
  v.querySelector("#word-timing").onchange = e => { state.settings.wordTiming = e.target.checked; save(); };
  v.querySelector("#beep").onchange = e => { state.settings.beep = e.target.checked; save(); };
  v.querySelectorAll("[data-dl]").forEach(b => (b.onclick = () => downloadModels([b.dataset.dl])));
  const del = v.querySelector("#btn-del-models"); if (del) del.onclick = async () => {
    if (!(await confirmDialog("Delete the speech model? Notes already read keep their lists. New notes wait until you download it again.", { ok: "Delete", danger: true }))) return;
    await deleteModels(); toast("Speech model deleted");
  };
  v.querySelector("#btn-export").onclick = exportBackup;
  v.querySelector("#btn-restore").onclick = () => restoreBackupText(v.querySelector("#backup-text").value);
  const en = v.querySelector("#btn-enable"); if (en) en.onclick = enableUploads;
  const dis = v.querySelector("#btn-disable"); if (dis) dis.onclick = async () => {
    if (!(await confirmDialog("Disconnect this phone from the team network? Your notes and products stay on this phone, but nothing is shared until you connect again.", { ok: "Disconnect" }))) return;
    setPass(""); cachedToken = null; renderAll();
  };
  v.querySelector("#btn-own-save").onclick = ownerSetup;
  v.querySelector("#btn-reset").onclick = async () => {
    const n = pendingCount();
    if (!(await confirmDialog(`Erase everything on this phone (notes, photos and settings) and start fresh from the shared product list?${n ? `<br><br><b>${n} change${n === 1 ? " hasn't" : "s haven't"} uploaded</b> and will be lost.` : ""}`, { ok: "Erase", danger: true }))) return;
    const keep = state.sync, models = state.settings.models, team = { key: state.team.key, name: state.team.name, repo: state.team.repo };
    state = freshState(); state.sync = keep; state.settings.models = models; Object.assign(state.team, team); save(); renderAll(); scheduleSweep();
    pullShared({ overwrite: true, quiet: false }).catch(e => toast(e.message));
  };
}
function passwordDialog(title, note, okLabel = "Connect") {
  return new Promise(resolve => {
    const d = el(`<div class="dialog"><p><b>${esc(title)}</b><br><span class="hint">${esc(note)}</span></p>
      <input class="field" type="text" id="pw-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Database key">
      <p class="hint" id="pw-err" style="color:var(--red);margin:8px 0 0"></p>
      <div class="btns" style="margin-top:14px"><button class="btn" data-a="c">Cancel</button><button class="btn primary" data-a="ok">${esc(okLabel)}</button></div></div>`);
    let done = false;
    const close = openLayer(d, { center: true, onClose: () => { if (!done) resolve(null); } });
    const inp = d.querySelector("input"), err = d.querySelector("#pw-err"), ok = d.querySelector('[data-a="ok"]');
    d.querySelector('[data-a="c"]').onclick = () => { done = true; close(); resolve(null); };
    const go = async () => {
      if (!inp.value) return;
      ok.disabled = true; ok.textContent = "Checking…"; err.textContent = "";
      try { await resolveCheck(inp.value); done = true; close(); resolve(inp.value); }
      catch (e) { err.textContent = e.message; ok.disabled = false; ok.textContent = okLabel; }
    };
    let resolveCheck;
    d.check = fn => (resolveCheck = fn);
    ok.onclick = go;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    setTimeout(() => inp.focus(), 50);
    passwordDialog.current = d;
  });
}
async function enableUploads() {
  const p = passwordDialog("Connect this phone", "Enter the database key. You'll only need it once on this phone.");
  passwordDialog.current.check(async pw => {
    const blob = await loadKeyBlob();
    let token;
    try { token = await decryptToken(blob, pw); } catch (e) { throw new Error("That database key isn't right."); }
    await checkToken(token);
    cachedToken = token;
  });
  const pw = await p;
  if (!pw) return;
  setPass(pw); state.sync.error = "";
  save(); renderAll();
  toast("Connected. Changes now share automatically.");
  scheduleUpload(300);
}
async function ownerSetup() {
  const token = $("#own-token").value.trim(), pw = $("#own-pass").value;
  if (!token) return toast("Paste the GitHub access token first");
  if (pw.length < 6) return toast("Use a database key of at least 6 characters");
  const btn = $("#btn-own-save");
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    await checkToken(token);
    const blob = await encryptToken(token, pw);
    const { sha } = await readRepoFile(GITHUB.keyPath, token);
    await writeRepoFile(GITHUB.keyPath, JSON.stringify(blob, null, 1), sha, token, "Shelf Scan: set upload key");
    setPass(pw); cachedToken = token; state.sync.error = "";
    save(); renderAll();
    toast("Saved. This phone is connected.");
    scheduleUpload(300);
  } catch (e) {
    toast(e.message || "Couldn't save the key");
    btn.disabled = false; btn.textContent = "Save and connect";
  }
}
async function syncFromGitHub() {
  const n = pendingCount();
  const ok = await confirmDialog(`Replace this phone's product list with the shared one from GitHub? Your notes are kept.${n ? `<br><br><b>${n} change${n === 1 ? " hasn't" : "s haven't"} uploaded</b> and will be lost.` : ""}`, { ok: "Replace", danger: !!n });
  if (!ok) return;
  if (!navigator.onLine) return toast("No signal. Try again when you're online.");
  toast("Syncing…");
  try { await pullShared({ overwrite: true, quiet: false }); }
  catch (e) { toast(e.message || "Couldn't reach GitHub"); }
}
function exportBackup() {
  const text = JSON.stringify(state);
  const box = $("#backup-text");
  const fallback = () => { box.value = text; box.focus(); box.select(); toast("Backup is in the box. Select all and copy it."); };
  try { navigator.clipboard.writeText(text).then(() => toast("Backup copied"), fallback); }
  catch (e) { fallback(); }
}
async function restoreBackupText(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { data = null; }
  if (!data || !data.products) { toast("That isn't a Shelf Scan backup"); return; }
  if (!(await confirmDialog("Replace everything on this phone with the backup?", { ok: "Replace", danger: true }))) return;
  const snap = snapshot(); state = data; migrate(); save(); renderAll(); toast("Backup restored", snap);
}


// ---------- Wire up ----------
fillIcons();
load();
document.body.dataset.view = view;   // the layout keys off this (it also works where the page is wrapped by another document)
document.querySelectorAll("#tabs button").forEach(b => (b.onclick = () => showView(b.dataset.view)));
$("#btn-cam-start").onclick = startCamera;
$("#btn-cam-stop").onclick = () => { state.settings.camOK = false; save(); stopCamera(); };
document.querySelectorAll("#cap-seg button").forEach(b => (b.onclick = () => { state.settings.captureKind = b.dataset.k; save(); renderCapture(); }));
$("#btn-shutter").onclick = () => onShutter(false, captureKind());
$("#btn-phonecam").onclick = () => onShutter(true, captureKind());
wireBA();
$("#sync-ind").onclick = () => showView("more");
renderAll();
save();
syncAllIndicators(false);
setTimeout(sweepMedia, 3000);   // tidy photos and recordings left over from deleted notes
if (state.settings.camOK) startCamera();
checkLastCrash();
recoverRecording();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}   // ask iOS not to clear saved photos and recordings when space is low
verifyModels().then(() => { setTimeout(warmUp, 3000); pump(); });   // the model loads a moment after the camera starts, not at the same instant   // get the models ready, and pick up anything still waiting from last time

// Pull everyone's latest product list on open, then upload anything waiting.
if (navigator.onLine) pullShared().catch(() => {}).finally(() => scheduleUpload(1000));

// Team list: look for new notes every few seconds while the app is open.
setInterval(() => { if (!document.hidden) teamCycle(); }, TEAM_POLL_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) teamCycle(); });
window.addEventListener("online", () => teamCycle());
setTimeout(teamCycle, 1500);

// Updates: check for a new version whenever the app comes back to the foreground (home-screen apps on iPhone
// stay loaded for days), and offer a one-tap reload once it's installed.
if ("serviceWorker" in navigator && location.protocol === "https:") {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) showUpdateReady(); });
}
// Centered pop-up; "Later" dismisses it until the app next comes back to the foreground.
let updatePromptOpen = false, updateWaiting = false;
function showUpdateReady() {
  updateWaiting = true;
  if (updatePromptOpen) return;
  updatePromptOpen = true;
  const d = el(`<div class="dialog update-dialog" id="update-ready">
    <div class="update-icon">${icon("refresh")}</div>
    <h3>Update available</h3>
    <p>A new version of Shelf Scan is ready. Reload to start using it. Your notes and settings stay as they are.</p>
    <div class="btns"><button class="btn quiet" data-a="later">Later</button><button class="btn primary" data-a="reload">Reload now</button></div></div>`);
  const close = openLayer(d, { center: true, onClose: () => (updatePromptOpen = false) });
  d.querySelector('[data-a="reload"]').onclick = () => location.reload();
  d.querySelector('[data-a="later"]').onclick = close;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && updateWaiting) showUpdateReady(); });
</script>
