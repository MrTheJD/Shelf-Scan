<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F40009">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shelfie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Shelfie</title>
<style>
/* Shelf Scan: one-handed iPhone tool.
   Rules: Coke red is reserved for the brand bar, primary actions and "selected"; everything else is warm neutrals.
   Controls that get used constantly sit in the bottom third (thumb reach); the top of the screen is for reading.
   Spacing steps: 4 / 8 / 12 / 16 / 24. Radii: 12 controls, 16 cards, 22 sheets. Touch targets are at least 44pt. */
:root {
  --red: #F40009; --red-press: #C80008; --on-red: #FFFFFF; --ink: #1B1B1B; --on-ink: #FFFFFF;
  --bg: #F3F1EF; --surface: #FFFFFF; --surface-2: #F9F8F6; --text: #151311; --muted: #6B6560; --faint: #A39E99;
  --line: #E7E3DF; --chip: #EDE9E5;
  --ok: #1E8E3E; --ok-soft: #E3F4E8; --warn: #A85F00; --warn-soft: #FFF0D8;
  --scrim: rgba(12, 8, 8, .5); --toast: #151311; --on-toast: #FFFFFF; --toast-action: #FF6B70;
  --shadow: 0 1px 2px rgba(40, 20, 20, .05), 0 6px 18px rgba(40, 20, 20, .06);
  --sheet-shadow: 0 -10px 34px rgba(0, 0, 0, .2);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --r: 16px; --tab-h: 56px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --spring: cubic-bezier(.2, .9, .3, 1.04); --ease-out: cubic-bezier(.22, 1, .36, 1);
}
@supports (transition-timing-function: linear(0, 1)) {
  :root { --spring: linear(0, 0.034 1.6%, 0.132 3.4%, 0.285 5.6%, 0.498 8.4%, 0.702 11.6%, 0.846 14.8%, 0.943 18.2%, 1.003 21.9%, 1.03 25.7%, 1.036 29.4%, 1.028 34.2%, 1.012 40.9%, 1.001 49.5%, 0.997 60%, 1); }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #F5F3F1; --on-ink: #111111;
    --bg: #000000; --surface: #151413; --surface-2: #1C1B1A; --text: #F5F3F1; --muted: #9C9692; --faint: #6B6662; --line: #272524; --chip: #232120;
    --ok: #4CC36E; --ok-soft: #13301D; --warn: #F2A742; --warn-soft: #3A2A10;
    --shadow: none; --sheet-shadow: 0 -10px 34px rgba(0, 0, 0, .65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #F5F3F1; --on-ink: #111111;
  --bg: #000000; --surface: #151413; --surface-2: #1C1B1A; --text: #F5F3F1; --muted: #9C9692; --faint: #6B6662; --line: #272524; --chip: #232120;
  --ok: #4CC36E; --ok-soft: #13301D; --warn: #F2A742; --warn-soft: #3A2A10;
  --shadow: none; --sheet-shadow: 0 -10px 34px rgba(0, 0, 0, .65); color-scheme: dark;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100vh; min-height: 100lvh; overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; padding-bottom: calc(var(--tab-h) + var(--safe-b)); }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; }
.hint { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.35; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 8px; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }

/* ---------- Brand bar ---------- */
header.top {
  position: sticky; top: 0; z-index: 20; background: var(--red); color: var(--on-red);
  padding: calc(6px + var(--safe-t)) 16px 6px; min-height: calc(44px + var(--safe-t));
  display: flex; align-items: center; gap: 10px;
}
header.top h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
header.top .spacer { flex: 1; }
.store { font-size: 13px; font-weight: 650; opacity: .9; }
.sync-ind { display: flex; align-items: center; gap: 4px; min-width: 44px; height: 44px; justify-content: center; margin: -6px -10px -6px 0; font-size: 12px; font-weight: 700; background: none; border: 0; color: var(--on-red); padding: 0; }
.sync-ind svg.i { width: 20px; height: 20px; }

main { padding: 16px 16px 24px; max-width: 640px; margin: 0 auto; }
.view { display: none; }
.view.active { display: block; animation: viewIn .3s var(--ease-out) both; }
.view > * + * { margin-top: 12px; }

/* ---------- Tab bar ---------- */
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 0 0 var(--safe-b); isolation: isolate; transition: transform .35s var(--ease-out); }
nav.tabs button { flex: 1; position: relative; z-index: 1; height: var(--tab-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 650; color: var(--faint); transition: color .25s ease; }
nav.tabs button.active { color: var(--red); }
nav.tabs.has-ind::before { content: ""; position: absolute; z-index: 0; left: 0; top: 6px; height: calc(var(--tab-h) - 12px); width: var(--ind-w, 0); transform: translateX(var(--ind-x, 0)); background: var(--chip); border-radius: 16px; pointer-events: none; transition: transform .5s var(--spring), width .5s var(--spring); }
nav.tabs.no-anim::before { transition: none; }
body.kb-open nav.tabs { transform: translateY(110%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s; }
.badge { position: absolute; top: 5px; left: calc(50% + 7px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--red); color: var(--on-red); font-size: 11px; font-weight: 800; line-height: 18px; padding: 0 5px; font-variant-numeric: tabular-nums; }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); font-weight: 650; font-size: 15px; text-decoration: none; transition: transform .45s var(--spring), background-color .2s ease; }
.btn:active { transform: scale(.97); transition-duration: .1s; }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.primary:active { background: var(--red-press); }
.btn.quiet { background: var(--chip); border-color: transparent; }
.btn.danger { color: var(--red); }
.btn.block { display: flex; width: 100%; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; }
.icon-btn { width: 44px; padding: 0; }
.seg { display: flex; position: relative; isolation: isolate; background: var(--chip); border-radius: 14px; padding: 3px; }
.seg button { position: relative; z-index: 1; flex: 1; min-height: 42px; border: 0; background: none; border-radius: 11px; font-weight: 700; font-size: 15px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; transition: color .25s ease; }
.seg button.active { color: var(--text); }
.seg.has-ind::before { content: ""; position: absolute; z-index: 0; left: 0; top: 3px; bottom: 3px; width: var(--ind-w, 0); transform: translateX(var(--ind-x, 0)); background: var(--surface); border-radius: 11px; box-shadow: 0 1px 3px rgba(0, 0, 0, .14); pointer-events: none; transition: transform .5s var(--spring), width .5s var(--spring); }
.seg.no-anim::before { transition: none; }
input.field, select.field, textarea.field { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); outline: none; }
input.field:focus, textarea.field:focus { border-color: var(--red); }
.search-wrap { position: relative; }
.search-wrap svg.i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); width: 18px; height: 18px; }
.search-wrap input.field { padding-left: 42px; }
label.f { display: block; font-size: 12px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }

/* ---------- Building blocks ---------- */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.pill { display: inline-block; font-size: 11px; font-weight: 750; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.kind.aisle { background: var(--chip); color: var(--text); } .pill.kind.display { background: var(--ink); color: var(--on-ink); }
.kcount { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--red); color: var(--on-red); font-size: 12px; font-weight: 800; line-height: 20px; font-variant-numeric: tabular-nums; }
.banner { display: flex; align-items: center; gap: 10px; background: var(--warn-soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 600; }
.banner.busy { background: var(--chip); font-weight: 500; }
.banner svg.i { color: var(--warn); }
.empty { text-align: center; padding: 56px 24px; color: var(--muted); }
.empty svg.i { width: 40px; height: 40px; color: var(--faint); }
.empty h3 { color: var(--text); margin: 12px 0 4px; font-size: 17px; }
.empty p { margin: 0; font-size: 14px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--red); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
.list-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.list-head h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.foot { text-align: center; color: var(--faint); font-size: 12px; margin: 24px 0 8px; }

/* ---------- Lists ---------- */
.list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px; position: relative; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 1px solid var(--line); }
.item.tap { cursor: pointer; transition: background-color .2s ease; }
.item.tap:active { background: var(--surface-2); }
.item .name { font-weight: 650; font-size: 16px; line-height: 1.25; }
.item > svg.i { color: var(--faint); width: 18px; height: 18px; }
.group-h { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 24px 4px 8px; display: flex; align-items: center; gap: 8px; }
.group-h .muted { font-weight: 700; letter-spacing: 0; }
.view > .group-h:first-child { margin-top: 8px; }
.cluster-h { display: flex; align-items: baseline; gap: 8px; font-size: 17px; font-weight: 800; letter-spacing: -.01em; margin: 24px 4px 8px; }
.cluster-h .n { font-size: 13px; font-weight: 700; color: var(--faint); }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--faint); background: none; flex: none; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--on-red); transition: background-color .15s ease, border-color .15s ease; }
.check svg.i { width: 17px; height: 17px; stroke-width: 3; }
.check.on { background: var(--red); border-color: var(--red); }
.shelf-thumb { position: relative; width: 52px; height: 52px; flex: none; border: 0; padding: 0; border-radius: 12px; overflow: hidden; background: var(--chip); display: flex; align-items: center; justify-content: center; color: var(--faint); }
.shelf-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shelf-thumb.missing img { display: none; }
.item.done .shelf-thumb { opacity: .45; }
.blurb { font-size: 16px; line-height: 1.35; }
.blurb .hl { font-weight: 800; background: color-mix(in srgb, var(--red) 12%, transparent); border-radius: 4px; padding: 0 2px; }
.item.done .blurb { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip-sm { font-size: 12px; font-weight: 650; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.flag-tag { font-size: 12px; font-weight: 750; padding: 3px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.need.flagged { box-shadow: inset 3px 0 0 var(--warn); }

/* ---------- Docked controls (bottom third, above the tab bar) ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + var(--safe-b) + 10px); z-index: 15; padding: 0 16px; pointer-events: none; display: flex; justify-content: center; gap: 10px; }
.dock > * { pointer-events: auto; max-width: 608px; }
.dock.solid { bottom: calc(var(--tab-h) + var(--safe-b)); padding: 10px 16px; background: var(--bg); border-top: 1px solid var(--line); pointer-events: auto; }
.dock.solid .seg { max-width: 608px; width: 100%; }
.dock .fab { box-shadow: 0 8px 22px rgba(0, 0, 0, .22); }
.dock-space { height: 84px; }
.fab { min-height: 52px; padding: 0 20px; border-radius: 26px; background: var(--red); border: 0; color: var(--on-red); font-weight: 750; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
.fab:active { background: var(--red-press); }
body.kb-open .dock { display: none; }

/* ---------- Capture: a viewfinder with the controls under the thumb ---------- */
#view-capture { padding: 0; }
#view-ba { padding: 0; }
#view-capture.active { display: flex; flex-direction: column; gap: 12px; height: calc(100vh - 44px - var(--safe-t) - var(--tab-h) - var(--safe-b)); height: calc(100dvh - 44px - var(--safe-t) - var(--tab-h) - var(--safe-b)); min-height: 440px; padding: 12px 16px 12px; }
#view-ba.active { display: flex; flex-direction: column; gap: 12px; height: calc(100vh - 44px - var(--safe-t) - var(--tab-h) - var(--safe-b)); height: calc(100dvh - 44px - var(--safe-t) - var(--tab-h) - var(--safe-b)); min-height: 440px; padding: 12px 16px 12px; }
#view-capture > * + * { margin-top: 0; }
#view-ba > * + * { margin-top: 0; }
.camera { position: relative; flex: 1 1 auto; min-height: 220px; border-radius: 24px; overflow: hidden; background: #000; border: 3px solid var(--red); transition: border-color .3s ease; }
#view-capture.mode-display .camera { border-color: var(--ink); }
#view-ba.mode-display .camera { border-color: var(--ink); }
.camera video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; animation: fade .4s ease both; }
.camera.flash::after { content: ""; position: absolute; inset: 0; z-index: 6; background: #fff; animation: fadeOut .35s ease forwards; pointer-events: none; }
.cam-off, .cam-wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; color: #D9D6D3; }
.cam-wait { font-size: 14px; }
.cam-off svg.i { width: 36px; height: 36px; opacity: .6; }
.cam-off p { margin: 0; font-size: 13px; max-width: 32ch; line-height: 1.4; }
.cam-off .btn.quiet { background: rgba(255, 255, 255, .14); color: #fff; }
.cam-chip { position: absolute; top: 12px; left: 12px; z-index: 3; padding: 6px 12px; border-radius: 999px; background: var(--red); color: var(--on-red); font-size: 11px; font-weight: 800; letter-spacing: .16em; transition: background-color .3s ease; }
#view-capture.mode-display .cam-chip { background: var(--ink); color: var(--on-ink); }
#view-ba.mode-display .cam-chip { background: var(--ink); color: var(--on-ink); }
.cam-stop { position: absolute; top: 8px; right: 8px; z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .5); color: #fff; display: flex; align-items: center; justify-content: center; }
.cam-stop svg.i { width: 18px; height: 18px; }
.cam-lens { position: absolute; left: 12px; bottom: 12px; z-index: 4; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(0, 0, 0, .5); }
.cam-lens button { min-width: 42px; height: 36px; padding: 0 8px; border: 0; border-radius: 999px; background: none; color: #fff; font-size: 14px; font-weight: 700; transition: background-color .2s ease, color .2s ease; }
.cam-lens button.active { background: #FFD60A; color: #111; }
.queue-line { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 3; margin: 0; padding: 7px 14px; border-radius: 999px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
.queue-line:not(.busy) .spin { display: none; }
.deck { display: flex; flex-direction: column; gap: 12px; flex: none; }
.cap-seg { background: var(--chip); }
.deck-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.deck-side { width: 56px; height: 56px; border-radius: 16px; border: 0; padding: 0; background: var(--chip); color: var(--text); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.deck-side.left { justify-self: start; } .deck-side.right { justify-self: end; }
.deck-side img { width: 100%; height: 100%; object-fit: cover; display: block; }
.deck-side .badge { top: -2px; left: auto; right: -2px; }
.shutter-big { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--red); background: var(--surface); padding: 5px; transition: transform .45s var(--spring), border-color .3s ease; }
.shutter-big span { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--red); transition: background-color .3s ease; }
.shutter-big:active { transform: scale(.9); transition-duration: .1s; }
.shutter-big:disabled { opacity: .4; }
#view-capture.mode-display .shutter-big { border-color: var(--ink); }
#view-ba.mode-display .shutter-big { border-color: var(--ink); }
#view-capture.mode-display .shutter-big span { background: var(--ink); }
#view-ba.mode-display .shutter-big span { background: var(--ink); }
.cap-hint { margin: 0; text-align: center; font-size: 13px; color: var(--muted); }
#model-banner { flex: none; }

/* ---------- Sheets and dialogs ---------- */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .25s var(--ease-out) both; }
.overlay.closing { animation: fadeOut .22s ease forwards; pointer-events: none; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; overflow-y: auto; overscroll-behavior: contain; max-height: calc(100dvh - var(--safe-t) - 12px); border-radius: 24px 24px 0 0; padding: 10px 16px calc(56px + var(--safe-b)); margin-bottom: -40px; box-shadow: var(--sheet-shadow); animation: sheetIn .55s var(--spring) both; }
.overlay.closing .sheet { animation: sheetOut .24s cubic-bezier(.4, 0, .9, .6) forwards; }
.sheet > * + * { margin-top: 12px; }
.sheet h2 { margin: 4px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.sheet .handle { width: 38px; height: 5px; background: var(--line); border-radius: 3px; margin: 0 auto 6px; }
.overlay.center { align-items: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: 22px; padding: 22px; width: 100%; max-width: 380px; animation: dialogIn .45s var(--spring) both; }
.overlay.closing .dialog { animation: dialogOut .2s ease forwards; }
.dialog p { margin: 0 0 16px; line-height: 1.45; }
.dialog .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.menu-list { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.menu-list button { display: block; width: 100%; min-height: 52px; text-align: left; border: 0; background: none; padding: 0 16px; font-size: 16px; font-weight: 550; transition: background-color .15s ease; }
.menu-list button + button { border-top: 1px solid var(--line); }
.menu-list button:active { background: var(--chip); }
.menu-list button.danger { color: var(--red); }
.update-dialog { text-align: center; }
.update-dialog h3 { margin: 12px 0 6px; font-size: 19px; font-weight: 800; }
.update-dialog p { color: var(--muted); font-size: 15px; }
.update-dialog .btns { justify-content: stretch; }
.update-dialog .btns .btn { flex: 1; }
.update-icon { width: 52px; height: 52px; margin: 0 auto; border-radius: 16px; background: var(--red); color: var(--on-red); display: flex; align-items: center; justify-content: center; }
#toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + var(--safe-b) + 16px); z-index: 100; background: var(--toast); color: var(--on-toast); border-radius: 16px; padding: 12px 18px; display: flex; align-items: center; gap: 16px; max-width: calc(100% - 32px); font-size: 14px; font-weight: 550; box-shadow: 0 8px 28px rgba(0, 0, 0, .28); opacity: 0; transform: translate(-50%, 16px) scale(.96); pointer-events: none; transition: opacity .2s ease, transform .45s var(--spring); }
#toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
#toast button { background: none; border: 0; color: var(--toast-action); font-weight: 800; letter-spacing: .04em; padding: 8px 0 8px 4px; }

/* ---------- Recorder, note sheet, photo ---------- */
.rec-sheet { text-align: center; }
.rec-sheet h2 { text-align: center; }
.rec-meter { height: 12px; border-radius: 6px; background: var(--chip); overflow: hidden; margin: 16px 4px 0; }
.rec-meter i { display: block; height: 100%; width: 100%; background: var(--red); transform: scaleX(0); transform-origin: left; transition: transform .08s linear; }
.rec-time { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.rec-done { min-height: 60px; font-size: 18px; }
.rec-alt .btn { font-size: 14px; }
.transcript { font-size: 16px; line-height: 1.4; background: var(--surface); border-radius: 14px; padding: 12px 14px; }
.zoom-stage { position: relative; height: 34dvh; background: #000; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; touch-action: none; }
.zoom-stage img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center; will-change: transform; user-select: none; -webkit-user-drag: none; }
.zoom-stage.empty-photo::after { content: "No photo for this note"; color: #aaa; font-size: 13px; position: absolute; }
.zoom-hint { position: absolute; left: 12px; bottom: 8px; font-size: 11px; color: rgba(255, 255, 255, .7); pointer-events: none; }
.viewer-dots { display: flex; justify-content: center; gap: 8px; min-height: 12px; }
.viewer-dots:empty { display: none; }
.viewer-dots .dot { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; background: var(--line); }
.viewer-dots .dot.on { background: var(--text); }

/* ---------- Settings ---------- */
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.status-dot.ok { background: var(--ok); } .status-dot.warn { background: var(--warn); } .status-dot.bad { background: var(--red); }
.mprog { height: 10px; border-radius: 5px; background: var(--chip); overflow: hidden; margin-top: 12px; }
.mprog i { display: block; height: 100%; width: 0; background: var(--red); transition: width .3s ease; }
details.owner summary { cursor: pointer; font-weight: 650; color: var(--muted); font-size: 14px; list-style: none; min-height: 32px; display: flex; align-items: center; }
details.owner summary::-webkit-details-marker { display: none; }

/* ---------- Motion ---------- */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes viewIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheetOut { to { transform: translateY(100%); } }
@keyframes dialogIn { from { transform: scale(.92); opacity: 0; } 40% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes dialogOut { to { transform: scale(.95); opacity: 0; } }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.14); } 100% { transform: scale(1); } }
.bump { animation: bump .45s var(--spring); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

body[data-view="capture"] main { padding: 0; max-width: none; }
body[data-view="ba"] main { padding: 0; max-width: none; }
body[data-view="capture"] #view-capture.active { max-width: 640px; margin: 0 auto; }
body[data-view="ba"] #view-ba.active { max-width: 640px; margin: 0 auto; }
.item.compact { min-height: 52px; padding-top: 8px; padding-bottom: 8px; }

.by-tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;line-height:1;padding:4px 8px;border-radius:999px;background:var(--ink,#1d1d1f);color:#fff;white-space:nowrap}
.pend-tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;line-height:1;padding:4px 8px;border-radius:999px;border:1px dashed currentColor;opacity:.6;white-space:nowrap}

/* ---------- Note player: the word being said is lit up ---------- */
.w { border-radius: 4px; transition: background-color .12s ease, color .12s ease; }
.w.on { background: var(--ink); color: var(--on-ink); box-shadow: 0 0 0 2px var(--ink); }
.item.done .w.on { text-decoration: none; }
.pbtn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; padding: 0; background: var(--chip); color: var(--text); display: flex; align-items: center; justify-content: center; }
.pbtn svg.i { width: 18px; height: 18px; }
.pbtn.playing { background: var(--red); color: var(--on-red); }
.pbtn.big { width: 44px; height: 44px; }
.pbar { display: flex; align-items: center; gap: 12px; }
.pbar input[type=range] { flex: 1; min-width: 0; accent-color: var(--red); height: 32px; }
.ptime { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- Before/After ---------- */
.slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; flex: none; }
.slot { min-width: 0; min-height: 46px; padding: 3px 2px; border: 0; border-radius: 12px; background: var(--chip); color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; transition: background-color .2s ease, color .2s ease; }
.slot b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.slot small { height: 11px; font-size: 10px; font-weight: 700; line-height: 11px; opacity: .8; }
.slot.active { background: var(--ink); color: var(--on-ink); }
.slot.act { background: var(--red); color: var(--on-red); }
.slot.act:active { background: var(--red-press); }
.slot.act svg.i { width: 20px; height: 20px; }
.shot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.shot { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 12px; overflow: hidden; background: var(--chip); }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot span { position: absolute; left: 4px; bottom: 4px; padding: 2px 7px; border-radius: 999px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 11px; font-weight: 650; }
.shot-sheet .zoom-stage { aspect-ratio: auto; }

.save-hint { position: fixed; z-index: 200; left: 16px; right: 16px; top: calc(var(--safe-t) + 116px); max-width: 420px; margin: 0 auto; padding: 14px 16px; border-radius: 16px; background: var(--ink); color: var(--on-ink); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.35; pointer-events: none; }
.save-hint b { font-size: 16px; }
.cam-sound { position: absolute; right: 12px; bottom: 12px; z-index: 4; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .5); color: #fff; display: flex; align-items: center; justify-content: center; }
.cam-sound svg.i { width: 20px; height: 20px; }

/* ---------- Feel: presses, ripples and small pops ---------- */
:where(button) { transition: transform .4s var(--spring); }
:where(button:not(:disabled)):active { transform: scale(.94); transition-duration: .1s; }
.item.tap { transition: transform .45s var(--spring), background-color .2s ease; }
.item.tap:active { transform: scale(.985); transition-duration: .1s; }
.btn, .fab, .menu-list button, .slot, .deck-side, .seg button, .cam-lens button, .pbtn, .check, nav.tabs button { position: relative; overflow: hidden; }
.cam-sound, .cam-stop { overflow: hidden; }
.shutter-big { position: relative; }
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .2; transform: scale(0); animation: ripple .6s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
.pop { animation: pop .5s var(--spring); }
@keyframes pop { 0% { transform: scale(.7); } 55% { transform: scale(1.14); } 100% { transform: scale(1); } }
.shutter-big::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid; border-color: inherit; opacity: 0; pointer-events: none; }
.shutter-big.fire::after { animation: ring .55s ease-out; }
@keyframes ring { 0% { transform: scale(1); opacity: .75; } 100% { transform: scale(1.55); opacity: 0; } }
.need.enter { animation: rowIn .42s var(--ease-out) both; }
@keyframes rowIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
nav.tabs button.active svg.i { animation: tabPop .5s var(--spring); }
@keyframes tabPop { 0% { transform: scale(.82); } 50% { transform: translateY(-3px) scale(1.14); } 100% { transform: none; } }
.check.pop svg.i { animation: tickDraw .4s var(--spring); }
@keyframes tickDraw { from { transform: scale(0) rotate(-25deg); } to { transform: none; } }
.empty svg.i { animation: floaty 3.4s ease-in-out infinite; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.rec-time::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 12px; border-radius: 50%; background: var(--red); vertical-align: middle; animation: recPulse 1.3s ease-in-out infinite; }
@keyframes recPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.65); opacity: .45; } }
.shot { transition: transform .4s var(--spring); }
.shot:active { transform: scale(.95); }

/* Shutter haptic: an invisible switch laid over the shutter (see feel.js) */
.shutter-wrap { position: relative; width: 80px; height: 80px; border-radius: 50%; }
.shutter-wrap:active .shutter-big:not(:disabled) { transform: scale(.9); transition-duration: .1s; }
.hap { position: absolute; inset: 0; z-index: 3; border-radius: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.hap input { position: absolute; width: 1px; height: 1px; visibility: hidden; }
.no-shutter-haptic .shutter-wrap .hap, .shutter-wrap .hap.off { pointer-events: none; }
.try-wrap { position: relative; border-radius: 12px; }
#toast { touch-action: none; }

header.top h1 img.brand { display: block; height: 24px; width: auto; }

.deck-side .badge.new { left: -2px; right: auto; background: var(--ok); }
.shot span { max-width: calc(100% - 8px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 2.0: several products per shelf photo */
.rec-items { margin: 4px 0 0; text-align: center; font-size: 14px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.rec-next { min-height: 64px; font-size: 19px; }

/* 2.0: hold the shutter to talk */
.shutter-wrap, .shutter-wrap * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.hold-live { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: rgba(0, 0, 0, .65); color: #fff; font-weight: 800; font-variant-numeric: tabular-nums; }
.hold-live .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); animation: recPulse 1.1s ease-in-out infinite; }
.hold-meter { width: 70px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .25); overflow: hidden; }
.hold-meter b { display: block; height: 100%; width: 100%; background: #fff; transform: scaleX(0); transform-origin: left; transition: transform .08s linear; }
.camera.holding { box-shadow: 0 0 0 3px var(--red), 0 0 0 9px color-mix(in srgb, var(--red) 35%, transparent); }
.hold-bar { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 14px; background: var(--chip); font-size: 14px; font-weight: 650; }

/* 2.1: the Products page sits under More */
.back-btn { margin-bottom: 4px; }

/* 2.1.1: the Before shutter stays still while held (no shrink, no page scroll under the finger); holding shows a glow instead */
#view-capture .shutter-wrap, #view-capture .shutter-wrap .hap { touch-action: none; }
#view-capture .shutter-big, #view-capture .shutter-big:active, #view-capture .shutter-wrap:active .shutter-big { transform: none !important; transition: border-color .3s ease, box-shadow .2s ease; }
#view-capture .shutter-big span { transition: background-color .2s ease; }
#view-capture .shutter-big.holding { box-shadow: 0 0 0 7px color-mix(in srgb, var(--red) 30%, transparent); }
#view-capture .shutter-big.holding span { background: var(--red-press); }
#view-capture.mode-display .shutter-big.holding { box-shadow: 0 0 0 7px color-mix(in srgb, var(--ink) 30%, transparent); }

/* ---------- 2.2: motion everywhere ---------- */
@keyframes riseIn { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes dropIn { from { opacity: 0; transform: translate(-50%, -10px) scale(.92); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
@keyframes viewInFwd { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
@keyframes viewInBack { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }
@keyframes camIn { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: none; } }
@keyframes softIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes barIn { from { transform: translateY(100%); } to { transform: none; } }
@keyframes brandIn { from { opacity: 0; transform: translateY(-6px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

/* screens slide in from the side of the tab they came from */
body[data-dir="fwd"] .view.active { animation: viewInFwd .36s var(--ease-out) both; }
body[data-dir="back"] .view.active { animation: viewInBack .36s var(--ease-out) both; }
/* and their contents rise in one after another */
.view.entering :is(.list-head, .card, .banner, .group-h, .cluster-h, .list, .slots, .row, .seg, .empty, .btn.block, .shot) { animation: riseIn .42s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 32ms); }
.view.entering .list > .item { animation: riseIn .4s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 28ms); }

/* first paint */
header.top h1 img.brand { animation: brandIn .7s var(--spring) both; }
nav.tabs { animation: barIn .55s var(--ease-out) both; }

/* the camera: the feed fades in sharp, the waiting text breathes, the off panel settles in */
.camera video { animation: camIn .6s var(--ease-out) both; }
.cam-wait { animation: breathe 1.4s ease-in-out infinite; }
.cam-off:not([hidden]) > * { animation: riseIn .45s var(--ease-out) both; }
.cam-off:not([hidden]) > *:nth-child(2) { animation-delay: .06s; }
.cam-off:not([hidden]) > *:nth-child(3) { animation-delay: .12s; }
.cam-off:not([hidden]) > *:nth-child(4) { animation-delay: .18s; }
.cam-lens:not([hidden]), .cam-sound, .cam-stop:not([hidden]) { animation: softIn .4s var(--spring) both; }
.camera.flash::after { animation: fadeOut .45s ease forwards; }
.fly-photo { position: fixed; z-index: 90; object-fit: cover; pointer-events: none; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); transform-origin: center; }

/* hold to talk */
.hold-live:not([hidden]) { animation: dropIn .32s var(--spring) both; }
.hold-bar:not([hidden]) { animation: riseIn .32s var(--spring) both; }
.camera { transition: border-color .3s ease, box-shadow .3s ease; }

/* labels and banners */
.cam-chip { transition: background-color .3s ease, color .3s ease; }
.cam-chip.pop { animation: pop .45s var(--spring); }
#model-banner:not([hidden]) .banner, .banner { animation: riseIn .4s var(--ease-out) both; }
.queue-line:not([hidden]) { animation: softIn .3s var(--ease-out) both; }
.save-hint { animation: dropIn .4s var(--spring) both; }

/* thumbnails fade in as they load */
img[data-photo] { opacity: 0; transition: opacity .35s ease; }
img[data-photo].in { opacity: 1; }

/* sheets, menus and dialogs: their parts come in one after another */
.sheet > *:not(.handle) { animation: riseIn .4s var(--ease-out) both; }
.sheet > *:nth-child(2) { animation-delay: .04s; } .sheet > *:nth-child(3) { animation-delay: .08s; } .sheet > *:nth-child(4) { animation-delay: .12s; }
.sheet > *:nth-child(5) { animation-delay: .16s; } .sheet > *:nth-child(6) { animation-delay: .2s; } .sheet > *:nth-child(n+7) { animation-delay: .24s; }
.menu-list button { animation: riseIn .35s var(--ease-out) both; }
.menu-list button:nth-child(2) { animation-delay: .05s; } .menu-list button:nth-child(3) { animation-delay: .1s; } .menu-list button:nth-child(4) { animation-delay: .15s; }
.menu-list button:nth-child(5) { animation-delay: .2s; } .menu-list button:nth-child(n+6) { animation-delay: .25s; }
.dialog > * { animation: riseIn .35s var(--ease-out) both; animation-delay: .06s; }
.dialog .btns .btn, .dialog .stack .btn { animation: softIn .35s var(--spring) both; animation-delay: .12s; }
.overlay.closing .sheet > *, .overlay.closing .dialog > * { animation: none; }
.zoom-stage img { animation: softIn .45s var(--ease-out) both; }

/* controls */
input[type="checkbox"] { transition: transform .3s var(--spring); }
input[type="checkbox"]:active { transform: scale(.85); }
input[type="checkbox"]:checked { animation: pop .35s var(--spring); }
.item.done .shelf-thumb, .item .blurb { transition: opacity .3s ease, color .3s ease; }
.slot { transition: background-color .25s ease, color .25s ease, transform .4s var(--spring); }
.slot small { transition: opacity .2s ease; }
.kcount, .badge { transition: transform .3s var(--spring); }
.field { transition: border-color .2s ease, box-shadow .2s ease; }
.field:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 18%, transparent); }
.rec-meter i { transition: transform .08s linear; }
.rec-next:active { transform: scale(.97); }

/* 2.2.1: the live video is sized and placed by script (fitVideo); keep the browser from sizing it too */
.camera video { min-width: 0; min-height: 0; max-width: none; max-height: none; object-fit: cover; object-position: center; }

/* 2.2.1: the camera tabs fade in without moving (no slide or scale over the live video, a known iPhone drawing trouble spot) */
body[data-dir] #view-capture.active, body[data-dir] #view-ba.active { animation: fade .3s ease both; }
.camera video { animation: fade .45s ease both; }

/* ---------- 2.3: an iPhone-app feel ---------- */
/* real iOS switches in the settings */
.set-row input[switch] { width: auto !important; height: auto !important; flex: none; }
.set-row input[switch]:checked { animation: none; }

/* Products is a page inside More: it pushes in from the right, More slides back from the left */
@keyframes pushIn { from { transform: translateX(100%); box-shadow: -12px 0 30px rgba(0, 0, 0, .18); } to { transform: none; box-shadow: none; } }
@keyframes popIn { from { transform: translateX(-28%); opacity: .5; } to { transform: none; opacity: 1; } }
body[data-nav="push"] #view-products.active { animation: pushIn .5s cubic-bezier(.2, .9, .25, 1) both; background: var(--bg); }
body[data-nav="pop"] #view-more.active { animation: popIn .45s cubic-bezier(.2, .9, .25, 1) both; }
body[data-nav="push"] #view-products.entering :is(.list-head, .list, .group-h, .search-wrap, .hint) { animation: none; }

/* large titles tuck into the red bar */
header.top { position: sticky; }
.hdr-title { position: absolute; left: 50%; bottom: 10px; transform: translate(-50%, 10px); opacity: 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; pointer-events: none; transition: opacity .25s ease, transform .4s var(--spring); }
header.top h1 img.brand { transition: opacity .25s ease, transform .4s var(--spring); }
body.title-docked .hdr-title { opacity: 1; transform: translate(-50%, 0); }
body.title-docked header.top h1 img.brand { opacity: 0; transform: translateY(-8px) scale(.9); }
.list-head h2 { transition: opacity .2s ease; }
body.title-docked .view.active .list-head h2 { opacity: 0; }

/* an open sheet pushes the page back (not on the camera tabs) */
header.top, main { transition: transform .5s var(--spring), border-radius .4s ease, filter .35s ease; transform-origin: 50% 0; }
body.sheet-up:not([data-view="capture"]):not([data-view="ba"]) header.top,
body.sheet-up:not([data-view="capture"]):not([data-view="ba"]) main { transform: scale(.94) translateY(10px); border-radius: 14px; filter: brightness(.82); overflow: hidden; }
body.sheet-up .dock { opacity: 0; transition: opacity .2s ease; }
html { background: #000; }

/* the tapped photo grows into the viewer */
.hero-photo { position: fixed; z-index: 120; object-fit: cover; pointer-events: none; box-shadow: 0 16px 40px rgba(0, 0, 0, .35); }

/* swipe a Needed row */
.list { position: relative; }
.need.swiping { position: relative; z-index: 1; background: var(--surface); }
.swipe-bg { position: absolute; left: 0; right: 0; z-index: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; color: #fff; font-weight: 800; font-size: 15px; background: var(--chip); }
.swipe-bg > span { display: flex; align-items: center; gap: 8px; opacity: 0; transform: scale(.8); transition: opacity .15s ease, transform .3s var(--spring); }
.swipe-bg.right { background: var(--ok); } .swipe-bg.left { background: var(--red); }
.swipe-bg.right .sw-tick, .swipe-bg.left .sw-del { opacity: .85; transform: scale(.92); }
.swipe-bg.armed.right .sw-tick, .swipe-bg.armed.left .sw-del { opacity: 1; transform: scale(1.12); }
.swipe-bg svg.i { width: 20px; height: 20px; stroke-width: 3; }

/* iOS-style alerts zoom in */
@keyframes dialogIn { from { transform: scale(1.18); opacity: 0; } 45% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes dialogOut { to { transform: scale(.96); opacity: 0; } }
.overlay.center { -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.overlay:not(.center) { -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }

/* tab labels and icons glide between states */
nav.tabs button svg.i { transition: transform .4s var(--spring); }
nav.tabs button:active svg.i { transform: scale(.82); }

/* 2.4.0: Backstock, in cardboard brown (Aisle is red, Display is black) */
:root { --box: #8E5E2E; --on-box: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --box: #C08A52; --on-box: #1a1108; } }
:root[data-theme="dark"] { --box: #C08A52; --on-box: #1a1108; }
#view-capture.mode-backstock .camera, #view-ba.mode-backstock .camera { border-color: var(--box); }
#view-capture.mode-backstock .cam-chip, #view-ba.mode-backstock .cam-chip { background: var(--box); color: var(--on-box); }
#view-capture.mode-backstock .shutter-big, #view-ba.mode-backstock .shutter-big { border-color: var(--box); }
#view-capture.mode-backstock .shutter-big span, #view-ba.mode-backstock .shutter-big span { background: var(--box); }
#view-capture.mode-backstock .shutter-big.holding { box-shadow: 0 0 0 7px color-mix(in srgb, var(--box) 30%, transparent); }
.pill.kind.backstock { background: var(--box); color: var(--on-box); }
.seg button { min-width: 0; white-space: nowrap; }
.cap-seg button, .dock.solid .seg button { font-size: 14px; }
/* 2.4.0: the count on the buttons beside the shutter sits on the corner, not clipped by it */
.deck-side { overflow: visible; }
.deck-side img { border-radius: inherit; }
.deck-side .ripple { display: none; }
/* 2.4.0: Needed's switch lives outside the page */
#kind-dock[hidden] { display: none; }
#kind-dock:not([hidden]) { animation: fade .25s ease both; }

/* 2.4.2: the hold bar sits over the hint's space under the shutter (it was taller, so the shutter moved up while held) */
#view-capture .deck { position: relative; }
#view-capture #shutter-label { min-height: 44px; display: flex; align-items: center; justify-content: center; }
#view-capture #hold-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; padding-top: 0; padding-bottom: 0; box-sizing: border-box; }
#view-capture #hold-bar .btn { min-height: 32px; padding-top: 0; padding-bottom: 0; }
.slot.act small { font-weight: 800; }

/* 2.4.2: the viewfinder picture is painted on a canvas over the video (see paintFeed), so it always fills the frame */
.camera .cam-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
.camera .cam-canvas.live { opacity: 1; }
.camera video[hidden] + .cam-canvas { display: none; }

/* ---------- 2.5.0: cleaner Needed rows ---------- */
.list { border-radius: 18px; }
.need.item { gap: 12px; padding: 10px 12px 10px 10px; min-height: 76px; }
.need .shelf-thumb { width: 58px; height: 58px; border-radius: 13px; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .1); }
.need .blurb { font-size: 15.5px; line-height: 1.32; font-weight: 520; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.need .chips-row { margin-top: 3px; gap: 0; align-items: center; }
.need .chip-sm { background: none; padding: 0; border-radius: 0; font-size: 12.5px; font-weight: 650; color: var(--muted); }
.need .chip-sm + .chip-sm::before { content: " · "; white-space: pre; }
.need .chips-row .flag-tag { margin-left: 8px; padding: 1px 7px; font-size: 11px; }
.need .chips-row .flag-tag:first-child { margin-left: 0; }
.need .pbtn { width: 34px; height: 34px; background: none; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
.need .pbtn svg.i { width: 15px; height: 15px; }
.need .pbtn.playing { background: var(--red); color: var(--on-red); box-shadow: none; }
.need .check { width: 28px; height: 28px; border-width: 2px; }
.list > .need + .need::before { left: 80px; }
.need.flagged { box-shadow: none; }
.need.flagged .shelf-thumb { box-shadow: 0 0 0 2px var(--warn); }
.item.done .shelf-thumb { opacity: .4; filter: grayscale(.7); }
.item.done .blurb { text-decoration-thickness: 1.5px; color: var(--faint); }
.need-go { flex: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--warn-soft); color: var(--warn); }
.need-go svg.i { width: 16px; height: 16px; }
.cluster-h { font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 22px 8px 7px; }
.cluster-h .n { font-size: 11px; font-weight: 800; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 1px 7px; letter-spacing: 0; }

/* ---------- 2.5.0: the photo comes first ---------- */
.check-sheet { height: calc(100dvh - var(--safe-t) + 28px); max-height: none; display: flex; flex-direction: column; gap: 10px; overflow: hidden; padding-top: 8px; }
.check-sheet > * { flex: none; margin-top: 0; margin-bottom: 0; }
.check-sheet > .handle { margin-bottom: -4px; }
.check-sheet > h2 { font-size: 14px; font-weight: 700; color: var(--muted); text-align: center; letter-spacing: 0; }
.check-sheet .zoom-stage { flex: 1 1 auto; height: auto; min-height: 42dvh; border-radius: 18px; }
.check-sheet .transcript { font-size: 15px; line-height: 1.35; padding: 10px 12px; max-height: 18dvh; overflow-y: auto; }
.check-sheet .hint:empty, .check-sheet .chips-row:empty { display: none; }
.check-sheet .chips-row { margin-top: 0; }
.check-sheet > .btn.block { min-height: 46px; }

/* ---------- 2.5.0: zoom ---------- */
.zoom-stage { cursor: zoom-in; }
.zoom-stage.zoomed { cursor: grab; }
.zoom-stage img { animation: none; transform-origin: center center; backface-visibility: hidden; }
.zoom-hint { left: 50%; bottom: 10px; transform: translateX(-50%); padding: 3px 10px; border-radius: 999px; background: rgba(0, 0, 0, .45); color: rgba(255, 255, 255, .85); font-weight: 650; white-space: nowrap; transition: opacity .25s ease; }
.zoom-stage.zoomed .zoom-hint, .zoom-stage.empty-photo .zoom-hint { opacity: 0; }
.zoom-level { position: absolute; top: 10px; left: 10px; z-index: 2; padding: 3px 9px; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; pointer-events: none; opacity: 0; transform: scale(.85); transition: opacity .2s ease, transform .3s var(--spring); }
.zoom-stage.zoomed .zoom-level { opacity: 1; transform: none; }
.zoom-expand { position: absolute; top: 10px; right: 10px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0; background: rgba(0, 0, 0, .5); color: #fff; display: flex; align-items: center; justify-content: center; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.zoom-expand:active { transform: scale(.9); }
.zoom-stage.empty-photo .zoom-expand { display: none; }
.photo-full { position: fixed; inset: 0; z-index: 200; background: #000; animation: fade .22s ease both; touch-action: none; }
.photo-full.closing { animation: fadeOut .22s ease forwards; }
.photo-full .zoom-stage { position: absolute; inset: 0; height: auto; border-radius: 0; background: transparent; }
.photo-full .zoom-stage img { animation: pfIn .38s cubic-bezier(.2, .9, .25, 1) both; }
@keyframes pfIn { from { opacity: 0; scale: .92; } to { opacity: 1; scale: 1; } }
.photo-full .zoom-level { top: calc(var(--safe-t) + 16px); left: 16px; }
.photo-full .zoom-hint { bottom: calc(var(--safe-b) + 18px); }
.pf-close { position: absolute; top: calc(var(--safe-t) + 10px); right: 14px; z-index: 3; width: 42px; height: 42px; border-radius: 50%; border: 0; padding: 0; background: rgba(255, 255, 255, .16); color: #fff; display: flex; align-items: center; justify-content: center; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: opacity .2s ease; }
.pf-close svg.i { width: 20px; height: 20px; }
.photo-full.chrome-off .pf-close, .photo-full.chrome-off .zoom-level, .photo-full.chrome-off .zoom-hint { opacity: 0; pointer-events: none; }

.need .blurb { color: var(--muted); }
.need .blurb .hl { background: none; padding: 0; border-radius: 0; font-weight: 750; color: var(--text); }
.need .check:not(.on) svg.i { opacity: 0; }
.need .check.on svg.i { opacity: 1; }
.item.done .blurb, .item.done .blurb .hl { color: var(--faint); }

/* ---------- 2.6.0: recent stores ---------- */
.recent-h { margin: 14px 0 6px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.recent-stores { display: flex; flex-wrap: wrap; gap: 8px; }
.recent-store { border: 0; border-radius: 999px; padding: 8px 14px; min-height: 38px; background: var(--chip); color: var(--text); font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; transition: transform .3s var(--spring), background-color .15s ease; }
.recent-store:active { transform: scale(.94); background: var(--surface-2); }

/* ---------- 2.6.0: none in the back ---------- */
.out-tag { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.need .chips-row .out-tag { margin-left: 8px; } .need .chips-row .out-tag:first-child { margin-left: 0; }
.check-sheet .out-tag { padding: 3px 9px; font-size: 12px; }
.need.out .shelf-thumb { opacity: .5; }
.need.out .blurb, .need.out .blurb .hl { color: var(--muted); }
.need.out .check { border-color: var(--warn); }
.out-bar { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; padding: 8px 8px 8px 14px; border-radius: 16px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 700; animation: riseIn .35s var(--ease-out) both; }
.out-bar b { font-weight: 900; }
.out-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
.out-bar .btn { background: var(--surface); color: var(--text); }
.swipe-bg.left { background: var(--warn); transition: background-color .15s ease; }
.swipe-bg.left.del { background: var(--red); }

/* ---------- 2.7.0: tap to pick ---------- */
.pick-sheet { height: min(84dvh, 760px); max-height: none; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.pick-sheet > * { flex: none; margin-top: 0; margin-bottom: 0; }
.pick-top { display: flex; align-items: baseline; gap: 10px; }
.pick-top h2 { margin: 0; font-size: 21px; }
.pick-where { font-size: 13px; font-weight: 700; color: var(--muted); }
.pick-added { display: flex; gap: 6px; overflow-x: auto; min-height: 34px; align-items: center; scrollbar-width: none; }
.pick-added::-webkit-scrollbar { display: none; }
.pick-added .hint { margin: 0; }
.pick-chip { flex: none; border: 0; border-radius: 999px; padding: 6px 9px 6px 12px; background: var(--ok-soft); color: var(--ok); font-weight: 750; font-size: 13.5px; display: flex; gap: 6px; align-items: center; animation: chipIn .4s var(--spring) both; }
.pick-chip svg.i { width: 13px; height: 13px; stroke-width: 3; }
@keyframes chipIn { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
.pick-stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.pick-page { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 2px 2px 12px; transition: transform .4s cubic-bezier(.2, .9, .25, 1), opacity .25s ease; }
.pick-page[data-p="f"] { transform: translateX(105%); }
.pick-stage.flav .pick-page[data-p="b"] { transform: translateX(-30%); opacity: 0; pointer-events: none; }
.pick-stage.flav .pick-page[data-p="f"] { transform: none; }
.pick-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pick-grid.f { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pick-btn { min-height: 58px; border: 0; border-radius: 15px; background: var(--surface); color: var(--text); font-weight: 750; font-size: 14.5px; line-height: 1.15; padding: 6px 8px; box-shadow: var(--shadow); text-align: center; overflow-wrap: anywhere; transition: transform .35s var(--spring), background-color .15s ease; }
.pick-btn:active { transform: scale(.93); background: var(--surface-2); transition-duration: .08s; }
.pick-btn.top { background: var(--red); color: var(--on-red); box-shadow: none; }
.pick-btn.top:active { background: var(--red-press); }
.pick-fhead { position: sticky; top: -2px; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 0 0 10px; background: var(--bg); }
.pick-back { border: 0; background: none; color: var(--red); font-weight: 800; font-size: 16px; padding: 8px 4px; }
.pick-fhead b { font-size: 18px; }
/* 2.7.0: long brand names (BODYARMOR) stay whole */
.pick-btn { overflow-wrap: normal; word-break: normal; font-size: 14px; letter-spacing: -.01em; padding: 6px 4px; }

/* ---------- 2.7.1: brand → variation → flavor ---------- */
.pick-page[data-p="l"], .pick-page[data-p="f"] { transform: translateX(105%); }
.pick-stage[data-at="l"] .pick-page[data-p="b"], .pick-stage[data-at="f"] .pick-page[data-p="b"], .pick-stage[data-at="f"] .pick-page[data-p="l"] { transform: translateX(-30%); opacity: 0; pointer-events: none; }
.pick-stage[data-at="l"] .pick-page[data-p="l"], .pick-stage[data-at="f"] .pick-page[data-p="f"] { transform: none; opacity: 1; }
.pick-grid.l { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pick-grid.l .pick-btn { min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 15px; }
.pick-btn small { font-size: 11px; font-weight: 700; opacity: .7; letter-spacing: 0; }
.pick-fhead b span { color: var(--muted); font-weight: 750; }

/* 2.7.2: the last-shelf button adds to it: a small + on its corner */
#last-note::after { content: "+"; position: absolute; right: -5px; bottom: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--red); color: var(--on-red); font-size: 16px; font-weight: 900; line-height: 19px; text-align: center; box-shadow: 0 0 0 2px var(--bg); pointer-events: none; }

/* 2.7.2: Hold to talk inside the picker */
.pick-foot { display: flex; gap: 10px; align-items: stretch; }
.pick-foot .btn { min-height: 52px; }
.pick-mic { flex: none; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px; border: 0; border-radius: 14px; background: var(--chip); color: var(--text); font-weight: 800; font-size: 15px; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: background-color .15s ease, color .15s ease, transform .3s var(--spring), box-shadow .3s ease; }
.pick-mic svg.i { width: 20px; height: 20px; }
.pick-mic.rec { background: var(--red); color: var(--on-red); transform: scale(1.03); box-shadow: 0 0 0 6px color-mix(in srgb, var(--red) 25%, transparent); }
.pick-mic.rec svg.i { animation: micPulse 1s ease-in-out infinite; }
@keyframes micPulse { 50% { transform: scale(1.2); } }
.pick-mic-t { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pick-chip.voice { background: var(--chip); color: var(--text); }

/* ---------- 2.8.0: one look for lists across the app ---------- */
.group-h { font-size: 12.5px; font-weight: 800; letter-spacing: .07em; color: var(--muted); margin: 22px 8px 7px; }
.sec-h { font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 26px 8px 7px; }
.sec-foot { font-size: 13px; line-height: 1.4; color: var(--muted); margin: 7px 8px 0; }
.list.group .item { min-height: 54px; padding: 11px 14px; gap: 12px; }
.item .sub { font-size: 13px; font-weight: 450; line-height: 1.35; color: var(--muted); margin-top: 2px; }
.item.set .name, .row-btn { font-size: 16px; font-weight: 600; }
.item.set input[switch] { flex: none; }
.set-val { font-size: 15px; color: var(--muted); font-weight: 550; font-variant-numeric: tabular-nums; }
.row-btn { width: 100%; border: 0; background: none; color: var(--text); font-family: inherit; text-align: left; display: flex; align-items: center; cursor: pointer; transition: background-color .15s ease; }
.row-btn:active { background: var(--surface-2); }
.row-btn > svg.i:first-child { width: 20px; height: 20px; color: var(--red); flex: none; }
.row-btn.nav > svg.i:last-child { width: 15px; height: 15px; color: var(--faint); flex: none; }
.row-btn.danger { color: var(--red); text-align: center; }
.row-btn.danger .grow { text-align: center; }
.try-wrap { border-radius: 0; }
.try-wrap .row-btn { min-height: 50px; }
.list.group > .item + .item::before, .list.group > .try-wrap + .item::before, .list.group > .item + .try-wrap::before { left: 14px; }
.list.group > .try-wrap { position: relative; }
.list.group > .item + .try-wrap::before, .list.group > .try-wrap + .item::before { content: ""; position: absolute; top: 0; right: 0; border-top: 1px solid var(--line); z-index: 1; }
.list.group > .row-btn + .row-btn::before { left: 46px; }
/* Product list rows */
.prod.item { min-height: 52px; padding: 10px 14px; }
.prod .name { font-size: 15.5px; font-weight: 600; }
.prod.retired .name { color: var(--faint); }
.prod.swiping { position: relative; z-index: 1; background: var(--surface); }
#view-products .cluster-h:first-child { margin-top: 14px; }
/* menus match the lists */
.menu-list { border-radius: 18px; }
.menu-list button { min-height: 54px; font-weight: 600; }
.menu-list button + button { border-top: 0; position: relative; }
.menu-list button + button::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }

/* ---------- 2.9.0: displays ---------- */
.disp-chip { position: absolute; top: 46px; left: 12px; z-index: 3; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 0; border-radius: 999px; background: rgba(0, 0, 0, .6); color: #fff; font-size: 13px; font-weight: 750; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: softIn .3s var(--ease-out) both; }
.disp-chip svg.i { width: 14px; height: 14px; }
.disp-chip.armed { background: var(--ok); color: #fff; }
.disp-chip:active { transform: scale(.95); }
.disp-sheet { max-height: calc(100dvh - var(--safe-t) - 12px); }
.disp-sheet h2 { margin-bottom: 0; }
.disp-row.item { gap: 10px; padding: 10px 12px; }
.disp-thumbs { display: flex; flex: none; }
.disp-thumbs .shelf-thumb { width: 42px; height: 42px; border-radius: 10px; box-shadow: 0 0 0 2px var(--surface); }
.disp-thumbs .shelf-thumb + .shelf-thumb { margin-left: -18px; }
.disp-acts { display: flex; flex-direction: column; gap: 6px; flex: none; }
.disp-acts .btn { min-height: 34px; padding: 0 10px; }
.disp-last { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.disp-last .shelf-thumb { width: 100%; height: auto; aspect-ratio: 1; position: relative; }
.disp-last .shelf-thumb b { position: absolute; left: 4px; bottom: 4px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: rgba(0, 0, 0, .65); color: #fff; font-size: 11px; line-height: 20px; text-align: center; }

/* 2.9.1: display groups in the Gallery */
.disp-h { display: flex; align-items: baseline; gap: 8px; margin: 14px 4px 7px; font-size: 15px; font-weight: 800; }
.disp-h span { font-size: 12.5px; font-weight: 650; color: var(--muted); }
.cluster-h + .disp-h { margin-top: 4px; }

/* 2.9.2: store on Needed rows, Hide done */
.store-tag { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--text); font-variant-numeric: tabular-nums; margin-right: 8px; }
.need .chips-row .store-tag + .chip-sm::before { content: none; }
.hide-done { margin-left: auto; align-self: center; border: 0; background: none; padding: 6px 2px 6px 10px; color: var(--red); font-size: 14px; font-weight: 750; white-space: nowrap; }
.hide-done:active { opacity: .6; }
.need.leaving { animation: rowOut .4s ease forwards; }
@keyframes rowOut { 40% { opacity: .6; transform: none; } to { opacity: 0; transform: translateX(24px); } }

/* ---------- 2.10.0: selecting in the Gallery ---------- */
.shot img, .shot { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.shot .sel-mark { position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; background: rgba(0, 0, 0, .25); display: none; align-items: center; justify-content: center; color: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
.shot .sel-mark svg.i { width: 14px; height: 14px; stroke-width: 3.2; opacity: 0; }
body.gal-selecting .shot .sel-mark { display: flex; animation: softIn .2s ease both; }
.shot.sel .sel-mark { background: var(--red); border-color: #fff; }
.shot.sel .sel-mark svg.i { opacity: 1; }
.shot.sel img { transform: scale(.9); border-radius: 10px; }
.shot img { transition: transform .25s var(--spring), border-radius .25s ease; }
body.gal-selecting #view-gallery .shot { animation: none; }
#gal-bar[hidden] { display: none; }
#gal-bar:not([hidden]) { animation: fade .2s ease both; }
.sel-row { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 608px; font-size: 15px; }
.sel-row .btn { min-height: 40px; padding: 0 14px; }

/* 2.10.1: photos can't be dragged out (iOS image drag after a long hold) */
img { -webkit-user-drag: none; user-drag: none; }
.shot, .shelf-thumb, .deck-side, .zoom-stage { -webkit-user-drag: none; -webkit-touch-callout: none; }

/* ---------- 2.11.0 ---------- */
/* Still at…? */
.still-dialog { text-align: center; }
.still-h { font-size: 20px; margin: 4px 0 2px; }
.still-sub { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.still-yes { min-height: 52px; font-size: 17px; }
.still-dialog .recent-stores { justify-content: center; }
/* Texted */
.tx-dot { width: 9px; height: 9px; border-radius: 50%; background: #F5A623; box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); margin-left: 6px; flex: none; }
.tx-ok { display: inline-flex; margin-left: 6px; opacity: .9; }
.tx-ok svg.i { width: 15px; height: 15px; stroke-width: 3; }
/* What's new */
body[data-nav="push"] #view-changelog.active { animation: pushIn .5s cubic-bezier(.2, .9, .25, 1) both; background: var(--bg); }
.cl-item.item { align-items: flex-start; padding: 13px 14px; }
.cl-item .name { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.cl-cur { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--red); color: var(--on-red); letter-spacing: .02em; }
.cl-list { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; line-height: 1.4; display: grid; gap: 4px; }
/* Practice run */
.tut { position: fixed; inset: 0; z-index: 400; pointer-events: none; }
.tut-shade { position: fixed; background: rgba(0, 0, 0, .58); pointer-events: auto; transition: left .3s var(--ease-out), top .3s var(--ease-out), width .3s var(--ease-out), height .3s var(--ease-out); }
.tut-ring { position: fixed; border-radius: 14px; box-shadow: 0 0 0 2px rgba(255, 255, 255, .95), 0 0 0 6px rgba(255, 255, 255, .25); pointer-events: none; transition: left .3s var(--ease-out), top .3s var(--ease-out), width .3s var(--ease-out), height .3s var(--ease-out); animation: tutRing 1.8s ease-in-out infinite; }
@keyframes tutRing { 50% { box-shadow: 0 0 0 2px rgba(255, 255, 255, .95), 0 0 0 11px rgba(255, 255, 255, .1); } }
.tut-bubble { position: fixed; pointer-events: auto; background: var(--surface); color: var(--text); border-radius: 18px; padding: 14px 16px; box-shadow: 0 14px 40px rgba(0, 0, 0, .4); transition: left .3s var(--ease-out), top .3s var(--ease-out); }
.tut-bubble[hidden] { display: none; }
.tut-bubble.pop { animation: tutPop .42s var(--spring) both; }
@keyframes tutPop { from { opacity: 0; transform: translateY(8px) scale(.94); } to { opacity: 1; transform: none; } }
.tut-bubble[data-side]:not([data-side=""])::before { content: ""; position: absolute; left: calc(var(--ax, 50%) - 8px); width: 16px; height: 16px; background: var(--surface); transform: rotate(45deg); border-radius: 3px; }
.tut-bubble[data-side="below"]::before { top: -7px; }
.tut-bubble[data-side="above"]::before { bottom: -7px; }
.tut-bubble[data-side="below"] { animation: tutBobDown 2.4s ease-in-out infinite; }
.tut-bubble[data-side="above"] { animation: tutBobUp 2.4s ease-in-out infinite; }
.tut-bubble.pop[data-side="below"], .tut-bubble.pop[data-side="above"] { animation: tutPop .42s var(--spring) both, tutBobDown 2.4s ease-in-out .42s infinite; }
@keyframes tutBobDown { 50% { transform: translateY(3px); } }
@keyframes tutBobUp { 50% { transform: translateY(-3px); } }
.tut-step { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.tut-step:empty { display: none; }
.tut-body p { margin: 0; font-size: 15.5px; line-height: 1.4; font-weight: 600; }
.tut-body h3 { margin: 8px 0 6px; font-size: 21px; text-align: center; }
.tut-bubble.card .tut-body p { text-align: center; font-weight: 500; color: var(--muted); }
.tut-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.tut-btns:empty { display: none; }
.tut-bubble.card .tut-btns { justify-content: stretch; } .tut-bubble.card .tut-btns .btn { flex: 1; }
.tut-badge { width: 54px; height: 54px; margin: 2px auto 0; border-radius: 16px; background: var(--red); color: var(--on-red); display: flex; align-items: center; justify-content: center; }
.tut-badge svg.i { width: 26px; height: 26px; }
.tut-x { position: fixed; top: calc(var(--safe-t) + 10px); right: 12px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .18); color: #fff; display: flex; align-items: center; justify-content: center; pointer-events: auto; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.tut-x svg.i { width: 18px; height: 18px; }
/* the fingertip: tap, hold (a ring fills, with a little sound wave), press (hold to select) */
.tut-finger { position: fixed; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255, 255, 255, .78); box-shadow: 0 4px 16px rgba(0, 0, 0, .35); pointer-events: none; transition: left .3s var(--ease-out), top .3s var(--ease-out); }
.tut-finger[hidden] { display: none; }
.tut-finger svg { position: absolute; inset: -9px; width: 64px; height: 64px; transform: rotate(-90deg); display: none; }
.tut-finger svg circle { fill: none; stroke: var(--red); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 170; stroke-dashoffset: 170; }
.tut-finger.tap { animation: tutTap 1.8s ease-in-out infinite; }
@keyframes tutTap { 0% { opacity: 0; transform: scale(1.5); } 22% { opacity: 1; transform: scale(1); } 34% { transform: scale(.78); } 48% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.tut-finger.hold, .tut-finger.press { animation: tutHoldIn 2.2s ease-in-out infinite; }
.tut-finger.hold svg, .tut-finger.press svg { display: block; }
.tut-finger.hold svg circle, .tut-finger.press svg circle { animation: tutFill 2.2s ease-in-out infinite; }
@keyframes tutHoldIn { 0% { opacity: 0; transform: scale(1.3); } 15% { opacity: 1; transform: scale(.86); } 80% { opacity: 1; transform: scale(.86); } 100% { opacity: 0; transform: scale(1); } }
@keyframes tutFill { 0%, 15% { stroke-dashoffset: 170; } 70%, 100% { stroke-dashoffset: 0; } }
.tut-wave { position: absolute; left: 54px; top: 12px; display: none; gap: 3px; align-items: center; height: 22px; }
.tut-finger.hold .tut-wave { display: flex; }
.tut-wave b { width: 4px; border-radius: 2px; background: #fff; animation: tutWave .9s ease-in-out infinite; }
.tut-wave b:nth-child(2) { animation-delay: .15s; } .tut-wave b:nth-child(3) { animation-delay: .3s; }
@keyframes tutWave { 0%, 100% { height: 6px; } 50% { height: 20px; } }
/* hints on the app's own elements */
.need .check.tut-ghost { border-color: var(--red); animation: tutGlowSm 1.8s ease-in-out infinite; }
.need .check.tut-ghost svg.i { color: var(--red); animation: tutGhost 1.8s ease-in-out infinite; }
@keyframes tutGhost { 0%, 100% { opacity: 0; } 40%, 65% { opacity: .75; } }
@keyframes tutGlowSm { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--red) 25%, transparent); } }
.tut-glow { animation: tutGlow 1.6s ease-in-out infinite; }
@keyframes tutGlow { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--red) 35%, transparent), 0 0 22px color-mix(in srgb, var(--red) 55%, transparent); } }
.tut-pulse .tx-dot { animation: tutDot 1.1s ease-in-out infinite; }
@keyframes tutDot { 50% { transform: scale(1.7); } }
/* finish */
.tut-done { position: relative; width: 74px; height: 74px; margin: 4px auto 0; }
.tut-done svg { width: 74px; height: 74px; }
.tut-done circle { fill: var(--ok); }
.tut-done path { fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: tutDraw .55s .2s var(--ease-out) forwards; }
@keyframes tutDraw { to { stroke-dashoffset: 0; } }
.tut-burst i { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: var(--c); opacity: 0; animation: tutBurst .9s .25s var(--ease-out) forwards; }
@keyframes tutBurst { 0% { opacity: 1; transform: rotate(var(--a)) translateY(0) scale(1); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-58px) scale(.4); } }
/* Reduce Motion: plain fades only */
.tut.calm *, .tut.calm { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
/* 2.11.0: the photo warning inside the picker */
.pick-warn { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 700; animation: riseIn .3s var(--ease-out) both; }
.pick-warn svg.i { width: 18px; height: 18px; flex: none; }
.pick-warn .btn { background: var(--surface); color: var(--text); }

/* ---------- 2.12.0 ---------- */
.fix-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 7px; }
.fix-q { font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 2px; }
.fix-chip { border: 0; border-radius: 999px; padding: 6px 11px; min-height: 32px; background: color-mix(in srgb, var(--red) 12%, var(--chip)); color: var(--text); font-size: 13.5px; font-weight: 750; transition: transform .3s var(--spring); }
.fix-chip:active { transform: scale(.93); }
.fix-tag { font-size: 11px; font-weight: 750; padding: 1px 7px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); margin-left: 8px; }
.need .chips-row .fix-tag:first-child { margin-left: 0; }
#ck-fix:empty { display: none; }
.learned-sheet .list.group { margin-top: 10px; }
.learned-row .pbtn { width: 34px; height: 34px; background: none; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
.learned-row .pbtn svg.i { width: 15px; height: 15px; }
</style>
