<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F40009">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shelf Scan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Shelf Scan</title>
<style>
/* Layout: one-thumb phone tool. Coke-red header, warm-grey ground, white surfaces, fixed icon tab bar. */
:root {
  --red: #F40009; --red-press: #C80008; --on-red: #FFFFFF;
  --bg: #F4F2F0; --surface: #FFFFFF; --surface-2: #FAF9F8; --text: #111111; --muted: #6F6A66; --faint: #A39E99;
  --line: #E8E4E0; --chip: #EEEAE6;
  --ok: #1E8E3E; --ok-soft: #E3F4E8; --warn: #A85F00; --warn-soft: #FFF1DC;
  --scrim: rgba(12, 8, 8, .48); --toast: #111111; --on-toast: #FFFFFF; --toast-action: #FF6B70;
  --cam: #000000; --cam-edge: #000000; --on-cam: #D9D6D3; --img-bg: #FFFFFF; --thumb-ink: #FFFFFF; --thumb-fallback: #8A8480;
  --shadow: 0 1px 2px rgba(40, 20, 20, .06), 0 2px 8px rgba(40, 20, 20, .05);
  --sheet-shadow: 0 -8px 30px rgba(0, 0, 0, .18);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --r: 14px;
  /* Motion: a gentle spring (~3% overshoot) and a soft ease-out. */
  --spring: cubic-bezier(.2, .9, .3, 1.04);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
}
@supports (transition-timing-function: linear(0, 1)) {
  :root { --spring: linear(0, 0.034 1.6%, 0.132 3.4%, 0.285 5.6%, 0.498 8.4%, 0.702 11.6%, 0.846 14.8%, 0.943 18.2%,
    1.003 21.9%, 1.03 25.7%, 1.036 29.4%, 1.028 34.2%, 1.012 40.9%, 1.001 49.5%, 0.997 60%, 1); }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #141312; --surface-2: #1B1A19; --text: #F5F3F1; --muted: #9C9692; --faint: #6B6662;
    --line: #262423; --chip: #221F1E; --cam: #0B0B0B; --cam-edge: #2A2827;
    --ok: #4CC36E; --ok-soft: #13301D; --warn: #F2A742; --warn-soft: #3A2A10;
    --shadow: none; --sheet-shadow: 0 -8px 30px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #141312; --surface-2: #1B1A19; --text: #F5F3F1; --muted: #9C9692; --faint: #6B6662;
  --line: #262423; --chip: #221F1E; --cam: #0B0B0B; --cam-edge: #2A2827;
  --ok: #4CC36E; --ok-soft: #13301D; --warn: #F2A742; --warn-soft: #3A2A10;
  --shadow: none; --sheet-shadow: 0 -8px 30px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* Feel like an app: no double-tap zoom, no rubber-band scrolling past the top or bottom. */
html, body { margin: 0; min-height: 100%; overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--text); font: 16px/1.4 var(--font);
  padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* Header */
header.top {
  position: sticky; top: 0; z-index: 20;
  background: var(--red); color: var(--on-red);
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
  display: flex; align-items: center; gap: 10px;
}
header.top h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.tagline { font-size: 10px; font-weight: 700; letter-spacing: .12em; border: 1.5px solid rgba(255,255,255,.75); border-radius: 5px; padding: 1px 5px; }
header.top .spacer { flex: 1; }
.store { font-size: 13px; font-weight: 600; opacity: .92; }
.sync-ind { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; background: none; border: 0; color: var(--on-red); padding: 4px; }
.sync-ind svg.i { width: 20px; height: 20px; }

main { padding: 12px 16px 8px; max-width: 640px; margin: 0 auto; }
.view { display: none; }
.view.active { display: block; }
.view > * + * { margin-top: 12px; }
#view-scan > * + * { margin-top: 10px; }
#view-scan > .hint { margin-top: 6px; }

/* Tab bar */
nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding: 4px 0 env(safe-area-inset-bottom, 0px);
}
nav.tabs button {
  flex: 1; border: 0; background: none; padding: 6px 0 8px; font-size: 11px; font-weight: 600; color: var(--faint);
  display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative;
}
nav.tabs button.active { color: var(--red); }
.badge {
  position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px;
  background: var(--red); color: var(--on-red); font-size: 11px; font-weight: 700; line-height: 18px; padding: 0 5px;
  font-variant-numeric: tabular-nums;
}

/* Building blocks */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; }
.card h3 { margin: 0 0 4px; font-size: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 12px; padding: 11px 16px; font-weight: 650; font-size: 15px; text-decoration: none;
  transition: transform .08s ease, background .15s ease;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.primary:active { background: var(--red-press); }
.btn.quiet { background: var(--chip); border-color: transparent; }
.btn.danger { color: var(--red); }
.btn.block { display: flex; width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .5; }
.icon-btn { width: 40px; height: 40px; padding: 0; border-radius: 12px; }

.seg { display: flex; background: var(--chip); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 4px; border-radius: 10px; font-weight: 650; font-size: 14px; color: var(--muted); }
.seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

input.field, select.field, textarea.field {
  width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); outline: none;
}
input.field:focus, textarea.field:focus, select.field:focus { border-color: var(--red); }
.search-wrap { position: relative; }
.search-wrap svg.i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); width: 18px; height: 18px; }
.search-wrap input.field { padding-left: 38px; }
label.f { display: block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--chip); color: var(--text); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; }
.chip.active { background: var(--text); color: var(--bg); }

/* Scan */
/* Sized for iPhone 13 (390×844 pt): a square viewfinder ~358pt wide fills the space between
   the mode switch and the action buttons, and the whole scan screen fits without scrolling. */
.camera { position: relative; background: var(--cam); border-radius: 18px; overflow: hidden; border: 1px solid var(--cam-edge);
  aspect-ratio: 1 / 1; max-height: 52dvh; margin-inline: auto; }
.camera.live { max-height: none; touch-action: none; }   /* pinch goes to the camera, not the page */
/* The feed fills the square and is cropped evenly from the center, whatever shape the camera sends. */
#reader { position: absolute; inset: 0; overflow: hidden; }
#reader video { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block;
  object-fit: cover; object-position: center; transform: scale(var(--view-zoom, 1)); transform-origin: center; }
#reader #qr-shaded-region, #reader img[alt="Info icon"], #reader img[alt="Camera based scan"] { display: none !important; }
.camera .cam-off { height: 100%; justify-content: center; }
/* Our own centered scan frame (corner brackets). */
.viewfinder { position: absolute; inset: 14%; z-index: 2; pointer-events: none;
  background:
    linear-gradient(#fff, #fff) left top / 26px 3px no-repeat, linear-gradient(#fff, #fff) left top / 3px 26px no-repeat,
    linear-gradient(#fff, #fff) right top / 26px 3px no-repeat, linear-gradient(#fff, #fff) right top / 3px 26px no-repeat,
    linear-gradient(#fff, #fff) left bottom / 26px 3px no-repeat, linear-gradient(#fff, #fff) left bottom / 3px 26px no-repeat,
    linear-gradient(#fff, #fff) right bottom / 26px 3px no-repeat, linear-gradient(#fff, #fff) right bottom / 3px 26px no-repeat;
  filter: drop-shadow(0 0 2px rgba(0,0,0,.5)); opacity: .9; }
.zoom-pill { position: absolute; left: 50%; bottom: 12px; z-index: 3; transform: translateX(-50%); padding: 4px 11px; border-radius: 999px;
  background: rgba(0,0,0,.55); color: #fff; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  opacity: 0; transition: opacity .25s ease; pointer-events: none; }
.zoom-pill.show { opacity: 1; }
.cam-off { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 34px 16px; color: var(--on-cam); text-align: center; }
.cam-off svg.i { width: 34px; height: 34px; opacity: .7; }
.cam-off p { margin: 0; font-size: 13px; max-width: 30ch; }
.cam-stop { position: absolute; top: 10px; right: 10px; z-index: 3; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; display: flex; align-items: center; justify-content: center; }
.cam-stop svg.i { width: 18px; height: 18px; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.actions .btn { flex-direction: column; gap: 4px; padding: 10px 6px; font-size: 13px; }
.actions.photo-first { grid-template-columns: 1fr 1fr; }
.actions.photo-first .photo-btn { grid-column: 1 / -1; flex-direction: row; background: var(--red); border-color: var(--red); color: var(--on-red); font-size: 16px; padding: 15px; }

.banner { display: flex; align-items: center; gap: 8px; background: var(--warn-soft); color: var(--text); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.banner .grow { font-weight: 650; }

.last { display: flex; align-items: center; gap: 12px; }
.last .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.last .code { font-size: 12px; color: var(--muted); word-break: break-all; }

/* Lists */
.list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; position: relative; min-height: 60px; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; border-top: 1px solid var(--line); }
.item.tap { cursor: pointer; }
.item.tap:active { background: var(--surface-2); }
.item .name { font-weight: 650; font-size: 15.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; line-height: 1.25; }
.item .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.group-h { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 20px 4px 8px; }
.view > .group-h:first-child { margin-top: 4px; }

.thumb {
  width: 44px; height: 44px; border-radius: 10px; flex: none; overflow: hidden;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: var(--thumb-ink);
  background: var(--thumb-fallback); letter-spacing: -.02em;
}
.thumb img { width: 100%; height: 100%; object-fit: contain; background: var(--img-bg); }
.thumb.lg { width: 76px; height: 76px; font-size: 22px; border-radius: 14px; }
.thumb.art { padding: 3px; }
.thumb.art svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); }

.check {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: none; flex: none; padding: 0;
  display: flex; align-items: center; justify-content: center; color: var(--on-red); transition: background .15s ease, border-color .15s ease;
}
.check svg.i { width: 16px; height: 16px; stroke-width: 3; }
.check.on { background: var(--red); border-color: var(--red); }
.item.done .name { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.item.done .thumb { opacity: .45; }
.qty-tap {
  border: 0; background: var(--chip); border-radius: 12px; min-width: 50px; min-height: 44px; padding: 5px 8px; flex: none;
  display: flex; flex-direction: column; align-items: center; line-height: 1.1;
}
.qty-tap b { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; }
.qty-tap span { font-size: 11px; color: var(--muted); font-weight: 600; }
.item.done .qty-tap { opacity: .5; }
.more-btn { border: 0; background: none; color: var(--faint); width: 26px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; padding: 0; }

.pill { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

.list-head { display: flex; align-items: baseline; gap: 10px; }
.list-head h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty svg.i { width: 40px; height: 40px; color: var(--faint); }
.empty h3 { color: var(--text); margin: 12px 0 4px; }
.empty p { margin: 0; font-size: 14px; }

/* Sheets & dialogs */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .28s var(--ease-out) both; }
.overlay.closing { animation: fadeOut .24s ease forwards; pointer-events: none; }
.sheet {
  background: var(--bg); width: 100%; max-width: 640px; overflow-y: auto; overscroll-behavior: contain;
  max-height: calc(100dvh - env(safe-area-inset-top, 0px) - 12px);
  /* Extra 40px below the fold so the spring's small overshoot never shows a gap at the bottom. */
  border-radius: 22px 22px 0 0; padding: 10px 16px calc(58px + env(safe-area-inset-bottom, 0px)); margin-bottom: -40px;
  box-shadow: var(--sheet-shadow); animation: sheetIn .6s var(--spring) both;
}
.overlay.closing .sheet { animation: sheetOut .26s cubic-bezier(.4, 0, .9, .6) forwards; }
.sheet > * + * { margin-top: 10px; }
.sheet h2 { margin: 4px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.sheet .handle { width: 38px; height: 5px; background: var(--line); border-radius: 3px; margin: 0 auto 8px; }
.overlay.center { align-items: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: 22px; padding: 20px; width: 100%; max-width: 380px; animation: dialogIn .5s var(--spring) both; }
.overlay.closing .dialog { animation: dialogOut .2s ease forwards; }
.dialog p { margin: 0 0 16px; line-height: 1.45; }
.dialog .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.menu-list { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.menu-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 15px 16px; font-size: 16px; font-weight: 550; }
.menu-list button + button { border-top: 1px solid var(--line); }
.menu-list button.danger { color: var(--red); }
.qty { display: flex; align-items: center; gap: 8px; }
.qty button { width: 52px; height: 52px; border-radius: 14px; border: 0; background: var(--chip); font-size: 26px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.qty input { width: 80px; text-align: center; font-size: 28px; font-weight: 800; padding: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-variant-numeric: tabular-nums; }
.qty .unit { color: var(--muted); font-weight: 600; }
#toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  background: var(--toast); color: var(--on-toast); border-radius: 16px; padding: 11px 16px; z-index: 100;
  display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px); font-size: 14px; font-weight: 550; box-shadow: 0 6px 24px rgba(0,0,0,.25);
  opacity: 0; transform: translate(-50%, 18px) scale(.94); pointer-events: none;
  transition: opacity .2s ease, transform .5s var(--spring);
}
#toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }

/* ---------- Motion ----------
   Fluid, spring-based movement in the spirit of iOS 26: controls glide between states,
   sheets spring into place, presses give a soft squeeze and settle back. Small overshoot,
   short durations, nothing bouncy or translucent. All of it turns off with Reduce Motion. */
.seg { position: relative; isolation: isolate; }
nav.tabs { isolation: isolate; }   /* stays position: fixed (set above); fixed already anchors the sliding pill */
.seg button, nav.tabs button { position: relative; z-index: 1; transition: color .25s ease; }
/* Sliding selection pill (position set from JS on the element as --ind-x / --ind-w). */
.seg.has-ind::before, nav.tabs.has-ind::before {
  content: ""; position: absolute; z-index: 0; left: 0; width: var(--ind-w, 0);
  transform: translateX(var(--ind-x, 0)); pointer-events: none;
  transition: transform .55s var(--spring), width .55s var(--spring);
}
.seg.has-ind::before { top: 3px; bottom: 3px; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); }
.seg.has-ind button.active { background: none; box-shadow: none; }
nav.tabs.has-ind::before { top: 4px; height: 50px; background: var(--chip); border-radius: 18px; }
.seg.no-anim::before, nav.tabs.no-anim::before { transition: none; }
/* While the keyboard is open, the tab bar gets out of the way (like native iOS apps) instead of riding on top of it. */
nav.tabs { transition: transform .35s var(--ease-out), visibility 0s; }
body.kb-open nav.tabs { transform: translateY(110%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s; }
/* Every tab keeps the same icon and label position; the active one is shown by color and the pill only. */
nav.tabs button { height: 54px; justify-content: center; line-height: 1.2; }
nav.tabs button svg.i { display: block; transform: none; }

/* Press: quick squeeze, springy release. */
.btn, .chip, .qty-tap, .check, .more-btn, .qty button, .menu-list button, nav.tabs button, .seg button, .cam-stop, .sync-ind {
  transition: transform .5s var(--spring), background-color .2s ease, color .2s ease, border-color .2s ease, opacity .2s ease;
}
.btn:active, .chip:active, .qty-tap:active, .qty button:active, .more-btn:active, .cam-stop:active, .sync-ind:active { transform: scale(.94); transition-duration: .12s; transition-timing-function: ease-out; }
.check:active { transform: scale(.88); transition-duration: .12s; }
.seg button:active { transform: scale(.95); transition-duration: .12s; }
nav.tabs button, nav.tabs button:active { transform: none; }   /* no squeeze: Safari can leave tapped tabs looking pressed */
.menu-list button:active { background: var(--chip); transform: scale(.985); transition-duration: .1s; }
.item.tap { transition: transform .5s var(--spring), background-color .2s ease; }
.item.tap:active { transform: scale(.985); transition-duration: .12s; }

/* Things arriving. */
.view.active { animation: viewIn .42s var(--ease-out) both; }
.item.enter { animation: rowIn .55s var(--spring) both; }
.banner { animation: bannerIn .5s var(--spring) both; }
.check.on svg.i { animation: checkIn .45s var(--spring) both; }
.item .name, .item .thumb { transition: color .3s ease, opacity .3s ease; }
.last.refresh > * { animation: lastIn .45s var(--spring) both; }
#reader video { animation: fade .45s ease both; }
.bump { animation: bump .45s var(--spring); }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheetOut { to { transform: translateY(100%); } }
@keyframes dialogIn { from { transform: scale(.9); opacity: 0; } 40% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes dialogOut { to { transform: scale(.95); opacity: 0; } }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes rowIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes bannerIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes checkIn { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lastIn { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
#toast button { background: none; border: 0; color: var(--toast-action); font-weight: 800; letter-spacing: .04em; padding: 0; }

/* More */
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.status-dot.ok { background: var(--ok); } .status-dot.warn { background: var(--warn); } .status-dot.bad { background: var(--red); }
details.owner summary { cursor: pointer; font-weight: 650; color: var(--muted); font-size: 14px; list-style: none; }
details.owner summary::-webkit-details-marker { display: none; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
.foot { text-align: center; color: var(--faint); font-size: 12px; margin: 20px 0 8px; }
</style>
</head>

        chips.appendChild(b);
      }
    };
    const results = s.querySelector(".results");
    const choose = pid => { done = true; bumpRecent(pid); save(); close(); resolve(pid); };
    const renderResults = () => {
      const q = input.value.trim();
      results.innerHTML = "";
      if (!q && !cat && state.recents.length) {
        const rec = state.recents.map(productById).filter(p => p && !p.retired);
        if (rec.length) {
          results.appendChild(el(`<div class="group-h">Recent</div>`));
          results.appendChild(listOf(rec, choose));
        }
        results.appendChild(el(`<div class="group-h">All products</div>`));
      }
      const items = searchProducts(q, { category: cat });
      const shown = items.slice(0, 150);
      if (shown.length) results.appendChild(listOf(shown, choose));
      if (items.length > shown.length) results.appendChild(el(`<p class="hint center" style="padding:10px">${items.length - shown.length} more. Keep typing to narrow it down.</p>`));
      if (!items.length) results.appendChild(el(`<div class="empty"><p>No match for “${esc(q)}”</p></div>`));
      const add = el(`<button class="btn block" style="margin-top:12px">${icon("plus")}Add new product${q ? ` “${esc(q)}”` : ""}</button>`);
      add.onclick = async () => {
        const pid = await editProduct(null, { prefillName: q });

}

// ---------- Binding logic (strict 1:1 for shelf tags) ----------
async function bindTag(code, pid, { confirm = true } = {}) {
  const p = productById(pid);
  const key = tagKeyFor(code);
  const existing = state.tags[key];
  const oldCodeForProduct = tagForProduct(pid);
  if (existing && existing.productId === pid) { existing.lastSeen = Date.now(); save(); return true; }
  const warnings = [];
  if (existing) {
    const other = productById(existing.productId);
    warnings.push(`This tag is linked to <b>${esc(other ? pFull(other) : "a deleted product")}</b>. That product will be left with no tag.`);
  }
  if (oldCodeForProduct) warnings.push(`<b>${esc(pName(p))}</b> already has a different tag. The old tag will be unlinked.`);
  if (confirm) {
    const ok = await confirmDialog(`Link this shelf tag to<br><b>${esc(pFull(p))}</b>?${warnings.length ? "<br><br>" + warnings.join("<br><br>") : ""}`,
      { ok: warnings.length ? "Replace" : "Link" });
    if (!ok) return false;
  }
  const snap = snapshot();
  if (oldCodeForProduct) dropTag(oldCodeForProduct);
  state.tags[key] = { productId: pid, created: Date.now(), lastSeen: Date.now(), updated: 0 };
  markTag(key);
  save(); renderAll();
  toast(`Linked: ${pName(p)} ${p.pack}`, snap);
  return true;
}
async function addBarcodeToProduct(code, pid) {
  const other = productByBarcode(code);
  const p = productById(pid);
  if (other && other.id === pid) return true;
  if (other) {
    const ok = await confirmDialog(`This barcode is on <b>${esc(pFull(other))}</b>. Move it to <b>${esc(pFull(p))}</b>?`, { ok: "Move" });
    if (!ok) return false;
    other.barcodes = other.barcodes.filter(b => b !== code);
    markProduct(other.id);
  }
  p.barcodes.push(code);
  markProduct(p.id);
  save();
  if (!p.img) fetchOffImage(p, code);
  return true;
}

// ---------- Open Food Facts ----------
async function offLookup(code) {
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,quantity,image_front_small_url,image_front_url`);
    if (r.status === 404) return null;           // null = not in the database
    if (!r.ok) return undefined;                 // undefined = lookup failed
    const j = await r.json();
    if (j.status !== 1 || !j.product) return null;
    return {
      name: j.product.product_name || "", brand: (j.product.brands || "").split(",")[0].trim(),
      quantity: j.product.quantity || "", img: j.product.image_front_small_url || j.product.image_front_url || "",
    };
  } catch (e) { return undefined; }
}
async function fetchOffImage(p, code) {
  if (!navigator.onLine) return;
  const info = await offLookup(code);
  if (info && info.img && !p.img) { p.img = info.img; markProduct(p.id); save(); renderAll(); }
}

// Shared data on GitHub
// ============================================================
function b64encode(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64decode(b64) { return decodeURIComponent(escape(atob(b64.replace(/\s/g, "")))); }
const bytesToB64 = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)));
const b64ToBytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const apiBase = `https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}`;

function emptyShared() { return { version: 1, updated: 0, products: {}, tags: {}, deleted: { products: {}, tags: {} } }; }
function normShared(d) {
  const s = emptyShared();
  if (!d || typeof d !== "object") return s;
  s.updated = d.updated || 0;
  s.products = d.products || {}; s.tags = d.tags || {};
  s.deleted.products = (d.deleted && d.deleted.products) || {}; s.deleted.tags = (d.deleted && d.deleted.tags) || {};
  if (d.config) s.config = d.config;
  return s;
}

// Read a repo file. With a token: GitHub API (fresh, gives the sha needed to write).
// Without: public API first, then the Pages copy next to the app.
async function readRepoFile(path, token) {
  const headers = { Accept: "application/vnd.github+json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  try {
    const r = await fetch(`${apiBase}/contents/${path}?ref=${GITHUB.branch}&t=${Date.now()}`, { headers, cache: "no-store" });
    if (r.status === 404) return { text: null, sha: null };
    if (r.ok) {
      const j = await r.json();
      if (j.content) return { text: b64decode(j.content), sha: j.sha };
      // Files over 1MB come back without content; fetch the raw bytes.
      const raw = await fetch(`${apiBase}/contents/${path}?ref=${GITHUB.branch}`, { headers: { ...headers, Accept: "application/vnd.github.raw" }, cache: "no-store" });
      if (raw.ok) return { text: await raw.text(), sha: j.sha };
    }
    if (token) throw new Error(`GitHub said ${r.status}`);
  } catch (e) { if (token) throw e; }
  const r = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });   // Pages copy (may lag a minute)
  if (r.status === 404) return { text: null, sha: null };
  if (!r.ok) throw new Error(`Couldn't load shared data (${r.status})`);
  return { text: await r.text(), sha: null };
}
async function writeRepoFile(path, text, sha, token, message) {
  const r = await fetch(`${apiBase}/contents/${path}`, {
    method: "PUT",
    headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ message, content: b64encode(text), branch: GITHUB.branch, ...(sha ? { sha } : {}) }),
  });
  if (r.status === 409 || r.status === 422) { const e = new Error("conflict"); e.conflict = true; throw e; }
  if (r.status === 401 || r.status === 403) { const e = new Error("GitHub rejected the upload key"); e.auth = true; throw e; }
  if (!r.ok) throw new Error(`GitHub said ${r.status}`);
  return (await r.json()).content.sha;
}

// Merge shared data into this phone. Newest change wins, item by item.
function applyShared(remote, { overwrite = false } = {}) {
  remote = normShared(remote);
  if (overwrite) {
    const map = new Map(buildSeedProducts().map(p => [p.id, p]));
    for (const id in remote.products) map.set(id, { ...remote.products[id] });
    for (const id in remote.deleted.products) map.delete(id);
    state.products = [...map.values()];
    const tags = {};
    for (const code in remote.tags) {
      const rt = remote.tags[code];
      if (!map.has(rt.productId)) continue;
      tags[code] = { ...rt, lastSeen: (state.tags[code] && state.tags[code].lastSeen) || rt.created || Date.now() };
    }
    state.tags = tags;
    state.deleted = { products: {}, tags: {} };
    state.outbox = { products: {}, tags: {} };
    state.config = { perStoreTags: false, updated: 0, ...(remote.config || {}) };
  } else {
    if (remote.config && (remote.config.updated || 0) > (state.config.updated || 0)) {
      state.config = { ...state.config, ...remote.config };
      delete state.outbox.config;
    }
    const localTs = id => { const p = productById(id); return Math.max(p ? p.updated || 0 : 0, state.deleted.products[id] || 0); };
    for (const id in remote.products) {
      const rp = remote.products[id];
      if ((rp.updated || 0) <= localTs(id)) continue;
      const i = state.products.findIndex(p => p.id === id);
      if (i >= 0) state.products[i] = { ...rp }; else state.products.push({ ...rp });
      delete state.deleted.products[id]; delete state.outbox.products[id];
    }
    for (const id in remote.deleted.products) {
      const ts = remote.deleted.products[id];
      if (ts <= localTs(id)) continue;
      state.products = state.products.filter(p => p.id !== id);
      state.deleted.products[id] = ts; delete state.outbox.products[id];
    }
    const tagTs = c => Math.max(state.tags[c] ? state.tags[c].updated || 0 : 0, state.deleted.tags[c] || 0);
    for (const code in remote.tags) {
      const rt = remote.tags[code];
      if ((rt.updated || 0) <= tagTs(code)) continue;
      state.tags[code] = { ...rt, lastSeen: (state.tags[code] && state.tags[code].lastSeen) || rt.created || Date.now() };
      delete state.deleted.tags[code]; delete state.outbox.tags[code];
    }
    for (const code in remote.deleted.tags) {
      const ts = remote.deleted.tags[code];
      if (ts <= tagTs(code)) continue;
      delete state.tags[code];
      state.deleted.tags[code] = ts; delete state.outbox.tags[code];
    }
  }
  // Keep things consistent: tags must point at real products, one tag per product per scope (newest wins).
  const byProduct = {};
  for (const key of Object.keys(state.tags)) {
    const t = state.tags[key];
    if (!productById(t.productId)) { delete state.tags[key]; continue; }
    const slot = (STORE_KEY_RE.test(key) ? "store:" + scopeOfKey(key) : "shared") + "/" + t.productId;
    const prev = byProduct[slot];
    if (prev && state.tags[prev].updated >= t.updated) delete state.tags[key];
    else { if (prev) delete state.tags[prev]; byProduct[slot] = key; }
  }
  if (state.list) state.list.items = state.list.items.filter(i => productById(i.productId));
  state.products.forEach(p => (p._st = undefined));
  canonicalize(state.products);
}

async function pullShared({ overwrite = false, quiet = true } = {}) {
  let token = null;
  if (uploadsEnabled()) { try { token = await getToken(); } catch (e) { /* read without it */ } }
  const { text } = await readRepoFile(GITHUB.dataPath, token);
  const remote = text ? JSON.parse(text) : emptyShared();
  applyShared(remote, { overwrite });
  state.sync.lastPull = Date.now();
  if (!uploadsEnabled()) state.sync.error = "";
  save(); renderAll();
  if (!quiet) toast(overwrite ? "Replaced with the shared data" : "Up to date");
}

// ---------- Upload key (encrypted with the team password) ----------
const KDF_ITER = 250000;
async function deriveAesKey(password, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptToken(token, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAesKey(password, salt, KDF_ITER);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(token));
  return { v: 1, kdf: "PBKDF2-SHA256", iter: KDF_ITER, salt: bytesToB64(salt), iv: bytesToB64(iv), ct: bytesToB64(ct) };
}
async function decryptToken(blob, password) {
  const key = await deriveAesKey(password, b64ToBytes(blob.salt), blob.iter);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.ct));
  return new TextDecoder().decode(pt);
}
function getPass() { try { return localStorage.getItem(PASS_KEY) || ""; } catch (e) { return ""; } }
function setPass(p) { try { if (p) localStorage.setItem(PASS_KEY, p); else localStorage.removeItem(PASS_KEY); } catch (e) {} }
const uploadsEnabled = () => !!getPass();
let cachedToken = null;
async function loadKeyBlob() {
  const { text } = await readRepoFile(GITHUB.keyPath, null);
  if (!text) throw new Error("Uploads haven't been set up for this app yet.");
  return JSON.parse(text);
}
async function getToken() {
  if (cachedToken) return cachedToken;
  const pass = getPass();
  if (!pass) throw new Error("Uploads are off");
  const blob = await loadKeyBlob();
  try { cachedToken = await decryptToken(blob, pass); }
  catch (e) { const err = new Error("The upload password no longer works. Enable uploads again."); err.auth = true; throw err; }
  return cachedToken;
}
async function checkToken(token) {
  const r = await fetch(apiBase, { headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}` }, cache: "no-store" });
  if (r.status === 401) throw new Error("GitHub didn't accept that key.");
  if (!r.ok) throw new Error(`Couldn't reach the repository (${r.status}). Check that the key has access to ${GITHUB.repo}.`);
  const j = await r.json();
  if (j.permissions && !j.permissions.push) throw new Error("That key can read but not write. Give it Contents: Read and write.");
}

// ---------- Automatic uploads ----------
let uploadTimer = null, uploading = false, uploadAgain = false;
function scheduleUpload(delay = UPLOAD_DELAY_MS) {
  renderSyncIndicator();
  if (!uploadsEnabled()) return;
  clearTimeout(uploadTimer);
  uploadTimer = setTimeout(uploadChanges, delay);
}
async function uploadChanges() {
  if (!uploadsEnabled() || !pendingCount()) { renderSyncIndicator(); return; }
  if (!navigator.onLine) { state.sync.error = "offline"; renderSyncIndicator(); return; }
  if (uploading) { uploadAgain = true; return; }
  uploading = true; renderSyncIndicator();
  try {
    const token = await getToken();
    // What we're sending, with the timestamp it had, so later edits aren't wrongly cleared.
    const sentP = {}, sentT = {};
    for (const id in state.outbox.products) { const p = productById(id); sentP[id] = p ? p.updated : state.deleted.products[id] || 0; }
    for (const c in state.outbox.tags) { const t = state.tags[c]; sentT[c] = t ? t.updated : state.deleted.tags[c] || 0; }
    for (let attempt = 0; attempt < 4; attempt++) {
      const { text, sha } = await readRepoFile(GITHUB.dataPath, token);
      const R = normShared(text ? JSON.parse(text) : null);
      let n = 0;
      for (const id in sentP) {
        const rTs = Math.max((R.products[id] && R.products[id].updated) || 0, R.deleted.products[id] || 0);
        if (rTs > sentP[id]) continue;                         // someone else changed it more recently
        const p = productById(id);
        if (p) { R.products[id] = shareable(p); delete R.deleted.products[id]; }
        else { delete R.products[id]; R.deleted.products[id] = state.deleted.products[id] || Date.now(); }
        n++;
      }
      for (const c in sentT) {
        const rTs = Math.max((R.tags[c] && R.tags[c].updated) || 0, R.deleted.tags[c] || 0);
        if (rTs > sentT[c]) continue;
        const t = state.tags[c];
        if (t) { R.tags[c] = tagShareable(t); delete R.deleted.tags[c]; }
        else { delete R.tags[c]; R.deleted.tags[c] = state.deleted.tags[c] || Date.now(); }
        n++;
      }
      const sentConfig = state.outbox.config ? state.config.updated : null;
      if (sentConfig !== null && (!R.config || (R.config.updated || 0) <= sentConfig)) { R.config = { ...state.config }; n++; }
      R.updated = Date.now();
      try {
        await writeRepoFile(GITHUB.dataPath, JSON.stringify(R, null, 1), sha, token,
          `Shelf Scan: ${n} change${n === 1 ? "" : "s"}${state.storeName ? ` (store ${state.storeName})` : ""}`);
      } catch (e) { if (e.conflict) continue; throw e; }   // someone uploaded at the same moment; re-read and retry
      for (const id in sentP) {
        const p = productById(id), now = p ? p.updated : state.deleted.products[id] || 0;
        if (now === sentP[id]) delete state.outbox.products[id];
      }
      for (const c in sentT) {
        const t = state.tags[c], now = t ? t.updated : state.deleted.tags[c] || 0;
        if (now === sentT[c]) delete state.outbox.tags[c];
      }
      if (sentConfig !== null && state.config.updated === sentConfig) delete state.outbox.config;
      applyShared(R);                                        // pick up everyone else's changes too
      state.sync.lastPush = state.sync.lastPull = Date.now();
      state.sync.error = "";
      save(); renderAll();
      return;
    }
    throw new Error("Too many people uploading at once. Will retry.");
  } catch (e) {
    state.sync.error = e.message || String(e);
    if (e.auth) cachedToken = null;
    save();
    if (!e.auth) scheduleUpload(30000);                      // try again shortly
  } finally {
    uploading = false;
    renderSyncIndicator();
    if (view === "more") renderMore();
    if (uploadAgain) { uploadAgain = false; scheduleUpload(500); }
  }
}
window.addEventListener("online", () => { state.sync.error = ""; scheduleUpload(500); });

function syncStatus() {
  const n = pendingCount();
  if (!uploadsEnabled()) return { dot: "", text: "Uploads are off on this phone", short: "" };
  if (uploading) return { dot: "warn", text: `Uploading ${n} change${n === 1 ? "" : "s"}…`, short: "up" };
  if (state.sync.error === "offline" || (!navigator.onLine && n)) return { dot: "warn", text: `${n} change${n === 1 ? "" : "s"} waiting for signal`, short: "wait" };
  if (state.sync.error) return { dot: "bad", text: state.sync.error, short: "err" };
  if (n) return { dot: "warn", text: `${n} change${n === 1 ? "" : "s"} waiting to upload`, short: "wait" };
  return { dot: "ok", text: `All changes uploaded${state.sync.lastPush ? " · " + ago(state.sync.lastPush) : ""}`, short: "ok" };
}
function renderSyncIndicator() {
  const b = $("#sync-ind"); if (!b) return;
  const s = syncStatus(), n = pendingCount();
  b.hidden = !s.short;
  b.innerHTML = s.short === "ok" ? icon("cloud") : s.short === "err" ? icon("cloudoff") : `${icon("upload")}${n || ""}`;
  b.setAttribute("aria-label", s.text);
}

// ---------- Scan handling ----------
let mode = "count";
let pending = null;   // { kind: "bindTag"|"rebindTag"|"setupTag", code } | { kind: "tagForProduct", pid }
let lastScan = { code: "", at: 0 };
let lastScanned = null;   // { kind, code }

const MODE_HELP = {
  count: "Scan a shelf tag or barcode, then enter how many you need.",
  setup: "Scan a shelf tag, then its product barcode. Links instantly.",
};
function setMode(m) {

function setPending(p) { pending = p; renderPending(); }

  if (!pending) return;

// Link tags mode: link immediately, no confirm (undo is in the toast), then straight back to scanning.
async function setupLink(tagCode, pid) {

function renderLastScan() {
  const box = $("#last-scan");
  if (!lastScanned) {
    box.innerHTML = `<div class="grow"><div class="label">Last scan</div><div class="muted small" style="margin-top:2px">Nothing scanned yet</div></div>`;
    return;
  }
  const { kind, code } = lastScanned;
  const t = kind === "tag" && lookupTag(code);
  const p = kind === "tag" ? (t && productById(t.rec.productId)) : productByBarcode(code);
  box.innerHTML = `${p ? thumbHtml(p) : ""}<div class="grow"><div class="label">Last scan · ${kind === "tag" ? "Shelf tag" : "Barcode"}</div>
    <div style="font-weight:650;margin-top:2px">${p ? esc(pName(p)) + `<div class="muted small" style="font-weight:500">${esc(pSub(p))}</div>` : "Not linked yet"}</div>
    <div class="code">${esc(code)}</div></div>`;

function onDecoded(text, formatName) {
  if (modalDepth > 0) return;                    // ignore scans while a sheet is open
  const now = Date.now();
  if (text === lastScan.code && now - lastScan.at < 2500) return;
  lastScan = { code: text, at: now };
  const twoD = /QR|DATA_MATRIX|AZTEC|PDF_417/.test(formatName || "");
  handleCode(text, twoD ? "tag" : "barcode");
}

async function handleCode(raw, kind) {
  const code = kind === "tag" ? normalizeTag(raw) : normalizeBarcode(raw);
  lastScanned = { kind, code }; renderLastScan();
  const card = $("#last-scan");
  card.classList.remove("refresh"); void card.offsetWidth; card.classList.add("refresh");
  beep(true);

  return handleBarcode(code);
}

async function handleTag(code) {
  if (!(await ensureStoreForTags())) return;
  const found = lookupTag(code);
  const known = found && found.rec;
  if (pending && pending.kind === "tagForProduct") {
    const pid = pending.pid; setPending(null);
    await bindTag(code, pid);
    return;
  }
  if (mode === "setup") {
    setPending({ kind: "setupTag", code });
    if (known) { const p = productById(known.productId); toast(`Currently: ${p ? pName(p) + " " + p.pack : "?"}`); }
    return;
  }
  if (known) {
    known.lastSeen = Date.now(); save();
    const p = productById(known.productId);
    if (!p) { delete state.tags[found.key]; save(); return handleTag(code); }
    return productSheet(p.id, { tagCode: code });
  }
  const choice = await menu("New shelf tag", [
    { label: "Scan the product barcode", value: "scan" },
    { label: "Pick from product list", value: "pick" },
  ]);
  if (choice === "scan") setPending({ kind: "bindTag", code });
  if (choice === "pick") {
    const pid = await pickProduct({ title: "Which product is this tag for?" });
    if (pid && await bindTag(code, pid) && mode === "count") productSheet(pid, { tagCode: code });
  }
}

async function handleBarcode(code) {
  let p = productByBarcode(code);
  if (pending && (pending.kind === "bindTag" || pending.kind === "rebindTag" || pending.kind === "setupTag")) {
    const tagCode = pending.code, wasKind = pending.kind;
    if (wasKind === "setupTag") {
      if (!p) {
        // Unknown barcode: go straight to the product search, learn the barcode, link the tag.
        const pid = await pickProduct({ title: "Which product is this barcode?" });
        if (!pid || !(await addBarcodeToProduct(code, pid))) return;
        p = productById(pid);
      }
      return setupLink(tagCode, p.id);
    }
    if (!p) {
      const pid = await resolveUnknownBarcode(code, "Which product is this barcode?");
      if (!pid) return;
      p = productById(pid);
    }
    setPending(null);
    const ok = await bindTag(tagCode, p.id);
    if (ok && mode === "count") productSheet(p.id, { tagCode });
    return;
  }
  if (pending && pending.kind === "tagForProduct") { toast("That's a barcode. Scan the shelf tag QR."); beep(false); return; }
  if (mode === "setup") { toast("Scan a shelf tag first, then the product"); beep(false); return; }
  if (!p) {
    const pid = await resolveUnknownBarcode(code);
    if (!pid) return;
    p = productById(pid);
  }
  productSheet(p.id);
}

// Unknown barcode → look up on Open Food Facts, then pick existing or add new.
async function resolveUnknownBarcode(code, title = "New barcode") {
  const s = el(`<div class="sheet"><div class="handle"></div><h2></h2>
    <p class="hint">Barcode <code>${esc(code)}</code></p>
    <div class="card" id="off-box"><span class="hint">Looking it up…</span></div>
    <button class="btn primary block" data-a="pick">Pick existing product</button>
    <button class="btn block" data-a="new">Add as new product</button>
    <button class="btn block quiet" data-a="cancel">Cancel</button></div>`);
  s.querySelector("h2").textContent = title;
  return new Promise(resolve => {
    let done = false, info = null;
    const close = openLayer(s, { onClose: () => { if (!done) resolve(null); } });
    const box = s.querySelector("#off-box");
    (navigator.onLine ? offLookup(code) : Promise.resolve(undefined)).then(r => {
      info = r;
      if (!box.isConnected) return;
      box.innerHTML = r
        ? `<div class="row">${r.img ? `<div class="thumb lg"><img src="${esc(r.img)}" alt=""></div>` : ""}<div class="grow">
             <div style="font-weight:650">${esc(r.name || "(no name)")}</div>
             <div class="hint">${esc([r.brand, r.quantity].filter(Boolean).join(" · "))}</div>
             <div class="hint">from Open Food Facts</div></div></div>`
        : `<span class="hint">${r === null ? "Not found online." : "Online lookup unavailable."} Pick the product or add it.</span>`;
    });
    const finish = async pid => {
      if (!pid) return;
      if (!(await addBarcodeToProduct(code, pid))) return;
      const p = productById(pid);
      if (info && info.img && !p.img) { p.img = info.img; markProduct(pid); save(); }
      done = true; close(); renderAll(); resolve(pid);
    };
    s.querySelector('[data-a="pick"]').onclick = async () => finish(await pickProduct({ title: "Which product is this barcode?" }));
    s.querySelector('[data-a="new"]').onclick = async () => finish(await editProduct(null, { barcode: code, off: info }));
    s.querySelector('[data-a="cancel"]').onclick = () => { done = true; close(); resolve(null); };
  });
}

      <button class="btn sm quiet" data-a="lookup">${icon("search")}Look up barcode online</button>
      <datalist id="dl-brands">${[...new Set(state.products.map(x => x.brand))].map(b => `<option value="${esc(b)}">`).join("")}</datalist>
      <datalist id="dl-cats">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist>

    const renderThumb = () => (s.querySelector("#ep-thumb").innerHTML = thumbHtml({ ...p, brand: p.brand || "?" }, true));
    const renderCodes = () => {

    s.querySelector('input[type="file"]').onchange = async e => {

      toast("Looking up…");

      if (!info) return toast(info === null ? "Not found on Open Food Facts" : "Online lookup unavailable");
      if (info.img) { p.img = info.img; renderThumb(); }

      const snap = snapshot();
      for (const c of p.barcodes) {
        const other = state.products.find(x => x.id !== p.id && x.barcodes.includes(c));
        if (other) {

          if (!ok) return;

          markProduct(other.id);

      if (isNew) {
        let id = slug(pFull(p)) || "product", n = 2;
        while (productById(id) || state.deleted.products[id]) id = slug(pFull(p)) + "-" + n++;
        p.id = id;
        state.products.push(p);
      } else {
        const i = state.products.findIndex(x => x.id === p.id);
        state.products[i] = p;
      }
      markProduct(p.id);
      save(); done = true; close(); renderAll();
      toast(isNew ? `Added ${pName(p)}` : "Saved", snap);
      resolve(p.id);
    };
    const retireBtn = s.querySelector('[data-a="retire"]');
    if (retireBtn) retireBtn.onclick = () => {
      const snap = snapshot();
      const real = productById(p.id); real.retired = !real.retired;
      markProduct(real.id);
      save(); done = true; close(); renderAll();
      toast(real.retired ? "Retired" : "Restored", snap); resolve(p.id);
    };
    const delBtn = s.querySelector('[data-a="delete"]');
    if (delBtn) delBtn.onclick = async () => {
      if (!(await confirmDialog(`Delete <b>${esc(pFull(p))}</b>? Its shelf tag will be unlinked.`, { ok: "Delete", danger: true }))) return;
      const snap = snapshot();
      dropProduct(p.id);
      save(); done = true; close(); renderAll(); toast("Deleted", snap); resolve(null);
    };
    s.querySelector('[data-a="cancel"]').onclick = () => { done = true; close(); resolve(null); };
  });
}
function shrinkImage(file, max) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => resolve("");
    img.src = URL.createObjectURL(file);
  });
}

// List
let hideDone = false;

function renderList() {
  const v = $("#view-list");
  v.innerHTML = "";
  const items = state.list ? state.list.items : [];
  const firstRender = listSeen === null;
  const prevSeen = listSeen || new Set();
  listSeen = new Set(items.map(i => i.productId));
  if (!items.length) {
    v.appendChild(el(`<div class="empty">${icon("list")}<h3>Your list is empty</h3><p>Scan a shelf tag or barcode to add what you need.</p></div>`));
    return;

  const left = items.filter(i => i.status !== "done").length;
  const head = el(`<div class="list-head"><h2>List</h2><span class="muted grow">${left} of ${items.length} left</span>
    <button class="btn sm quiet">${hideDone ? "Show all" : "Hide crossed off"}</button></div>`);
  head.querySelector("button").onclick = () => { hideDone = !hideDone; renderList(); };
  v.appendChild(head);
  const groups = {};
  for (const it of items) {

    if (hideDone && it.status === "done") continue;

    v.appendChild(el(`<div class="group-h">${esc(cat)}</div>`));

    groups[cat].sort((a, b) => pName(a.p).localeCompare(pName(b.p)));
    for (const { it, p } of groups[cat]) {
      const done = it.status === "done";
      const isNew = !firstRender && !prevSeen.has(it.productId);
      const r = el(`<div class="item tap${done ? " done" : ""}${isNew ? " enter" : ""}">
        <button class="check${done ? " on" : ""}" aria-label="Cross off">${done ? icon("check") : ""}</button>

        <button class="more-btn" data-a="more" aria-label="More">${icon("dots")}</button></div>`);
      if (bumpQtyFor === it.productId) { bump(r.querySelector(".qty-tap b")); bumpQtyFor = null; }
      // Tapping the row crosses it off (purely a reminder). Updated in place so the check and strikethrough animate.
      r.onclick = e => {

function passwordDialog(title, note) {
  return new Promise(resolve => {
    const d = el(`<div class="dialog"><p><b>${esc(title)}</b><br><span class="hint">${esc(note)}</span></p>
      <input class="field" type="text" id="pw-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Password">

      <div class="btns" style="margin-top:14px"><button class="btn" data-a="c">Cancel</button><button class="btn primary" data-a="ok">Enable</button></div></div>`);
    let done = false;
    const close = openLayer(d, { center: true, onClose: () => { if (!done) resolve(null); } });
    const inp = d.querySelector("input"), err = d.querySelector("#pw-err"), ok = d.querySelector('[data-a="ok"]');
    d.querySelector('[data-a="c"]').onclick = () => { done = true; close(); resolve(null); };
    const go = async () => {
      if (!inp.value) return;
      ok.disabled = true; ok.textContent = "Checking…"; err.textContent = "";
      try { await resolveCheck(inp.value); done = true; close(); resolve(inp.value); }
      catch (e) { err.textContent = e.message; ok.disabled = false; ok.textContent = "Enable"; }
    };
    let resolveCheck;
    d.check = fn => (resolveCheck = fn);
    ok.onclick = go;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    setTimeout(() => inp.focus(), 50);
    passwordDialog.current = d;
  });
}

// ---------- Barcode matcher ----------
// Strict product matching used to import barcodes in bulk (.claude/usda/match.js): brand, flavor,
// container, size and pack count must all agree, and limited editions are ruled out.
const OZ_PER = { oz: 1, floz: 1, ml: 1 / 29.5735, l: 33.814, liter: 33.814, litre: 33.814 };
const BRAND_SEARCH = {
  "Coca-Cola": "coca cola", "Diet Coke": "diet coke", "Mr. Pibb": "mr pibb", "Seagram's": "seagrams",
  "Diet Dr Pepper": "diet dr pepper", "AHA": "aha sparkling water", "FUZE": "fuze tea", "Hubert's": "huberts lemonade",
  "Hi-C": "hi-c", "Monster Energy": "monster energy", "Reign": "reign energy", "NOS": "nos energy", "Core Power Elite": "core power elite",
};
const brandKey = b => ({ "Coca-Cola": "coke", "Mr. Pibb": "pibb", "Barq's": "barq", "Seagram's": "seagram", "Hubert's": "hubert",
  "BODYARMOR": "bodyarmor", "BODYARMOR LYTE": "bodyarmor", "vitaminwater": "vitaminwater", "smartwater": "smartwater", "Monster Energy": "monster" }[b]
  || bfNorm(b));
// Extra words that rule a listing out for a brand (the sibling line that shares its name).
const BRAND_EXCLUDE = { "Coca-Cola": ["diet"], "Dr Pepper": ["diet"], "BODYARMOR": ["lyte", "sportwater"], "Topo Chico": ["sabores"], "Core Power": ["elite"],
  "smartwater": ["sparkling"], "Dasani": ["sparkling"] };
const BF_VARIANTS = ["zero", "diet", "cherry", "vanilla", "caffeine", "lime", "orange", "cream", "peach", "grape", "strawberry", "pineapple",
  "berry", "mango", "punch", "tropical", "citrus", "raspberry", "lemon", "lemonade", "ginger", "tonic", "club", "seltzer", "float", "chill",
  "tea", "mexico", "mexican", "sugar", "free", "lyte", "ultra", "watermelon", "kiwi", "pomegranate", "blueberry", "passionfruit", "coconut"];
// Limited editions and discontinued lines that share a regular product's name.
const BF_LIMITED = ["starlight", "y3000", "creations", "creation", "dreamworld", "dream", "life", "kosher", "reduced", "ultimate", "futuristic",
  "byte", "spiced", "marshmello", "oreo", "edition", "limited", "holiday", "wave", "move", "remix", "energy", "plus",
  "stevia", "vitamin", "coffee", "feisty", "twisted", "zesty", "ginger", "lime", "mango", "blueberry", "strawberry",
  "mix", "powder", "drops", "ashwagandha", "ashwaganda", "tangerine", "strawberries", "just", "organic", "splenda", "caffeinated"];
function bfNorm(s) {
  return (s || "").toLowerCase().replace(/coca[\s-]?cola|cocacola/g, "coke").replace(/barq'?s/g, "barq").replace(/['’`®™]/g, "")
    .replace(/body armor/g, "bodyarmor").replace(/vitamin water/g, "vitaminwater").replace(/smart water/g, "smartwater")
    .replace(/[^a-z0-9.]+/g, " ").replace(/\s+/g, " ").trim();
}
const bfFlavorTokens = f => bfNorm(f.replace(/\(Mexican\)/i, "mexican")).split(" ").filter(w => w && !["original", "taste", "the", "and", "with"].includes(w));
// Volumes mentioned in a listing, in fl oz.
function bfVolumes(t) {
  const out = [];
  for (const m of t.matchAll(/(\d+(?:\.\d+)?)\s*(fl\.?\s*oz|oz|ml|l|liters?|litres?)\b/g)) {
    const u = m[2].replace(/\s|\./g, "").replace(/s$/, "");
    out.push(parseFloat(m[1]) * (OZ_PER[u === "floz" ? "floz" : u] || 1));
  }
  return out;
}
function bfProductOz(p) { const v = bfVolumes(p.size.toLowerCase()); return v[0] || 0; }
const near = (a, b) => Math.abs(a - b) / b < 0.04;
function bfMatchScore(p, c, brandsSeen) {
  const nameN = bfNorm(c.product_name), allN = bfNorm(`${c.product_name} ${c.brands || ""}`);
  const words = new Set(allN.split(" "));
  const key = brandKey(p.brand);
  if (!allN.includes(key)) return 0;
  if ((BRAND_EXCLUDE[p.brand] || []).some(w => words.has(w))) return 0;
  // Another brand named in the product name (not just the maker field) → not this product.
  for (const b of brandsSeen) { const k = brandKey(b); if (b !== p.brand && k !== key && !key.includes(k) && nameN.includes(k)) return 0; }
  const own = bfFlavorTokens(p.flavor);
  if (!own.every(w => w === "mexican" ? /mexic/.test(allN) : words.has(w))) return 0;
  const sibling = new Set(state.products.filter(x => x.brand === p.brand).flatMap(x => bfFlavorTokens(x.flavor)));
  // Words from the brand's own name ("diet" in Diet Coke, "energy" in Monster Energy) never count against it.
  const brandWords = new Set(bfNorm(p.brand).split(" "));
  if ([...new Set([...sibling, ...BF_VARIANTS])].some(w => !own.includes(w) && !brandWords.has(w) && !(w === "mexico" && own.includes("mexican")) && words.has(w))) return 0;
  // Limited editions ("Starlight", "Creations", "Life"…) are separate products.
  if (BF_LIMITED.some(w => words.has(w) && !own.includes(w) && !brandWords.has(w))) return 0;
  // "Juice Monster" is its own line; only its flavors may say "juice".
  if (p.brand === "Monster Energy" && words.has("juice") && !/loco|pipeline|pacific/i.test(p.flavor)) return 0;
  // Container type must not contradict (can vs bottle vs glass).
  const tq = `${c.product_name} ${c.quantity || ""}`.toLowerCase();
  const kind = /glass/.test(p.size) ? "glass" : /can/.test(p.size) ? "can" : /carton/.test(p.size) ? "carton" : "bottle";
  if (kind === "can" && /bottle|glass/.test(tq)) return 0;
  if (kind !== "can" && /\bcans?\b/.test(tq)) return 0;
  if (kind === "glass" && /plastic/.test(tq)) return 0;
  if (kind === "bottle" && /glass/.test(tq)) return 0;
  if (kind === "glass" && !/glass|mexic|mineral/.test(tq)) return 0;
  // Size and pack must both be stated and match.
  const size = bfProductOz(p), pack = p.pack === "Single" ? 1 : parseInt(p.pack, 10);
  const vols = bfVolumes(tq);
  if (!size || !vols.length) return 0;
  const m = tq.match(/\b(\d{1,2})\s*(?:x|pk|pack|ct|count|cans|bottles)\b/) || tq.match(/\bpack of (\d{1,2})\b/);
  let count = m ? parseInt(m[1], 10) : null;
  const hasUnit = vols.some(v => near(v, size));
  const total = vols.find(v => !near(v, size) && v > size);
  // Only work out a pack count from a total volume when the listing isn't clearly a single container
  // (a 3L bottle holds about the same as six 16.9oz bottles).
  const singular = /\b(bottle|can|carton|glass bottle)\b(?!s)/.test(tq) && !/\b(bottles|cans|cartons|pack|pk)\b/.test(tq);
  if (!count && singular) count = 1;
  if (!count && total && Number.isInteger(Math.round(total / size)) && near(total, Math.round(total / size) * size)) count = Math.round(total / size);
  if (!hasUnit && !(count && total && near(total, count * size))) return 0;
  if ((count || 1) !== pack) return 0;
  return 10 + Math.log10((c.unique_scans_n || 0) + 1);
}
// ---------- end barcode matcher ----------

// ---------- Pinch to zoom ----------
// Uses the camera's real zoom when Safari exposes it (sharper, and the scanner sees the zoomed image).
// Otherwise it enlarges the preview only, which still helps with aiming.
const zoom = { track: null, hw: null, level: 1, min: 1, max: 4, pending: null };
function setupZoom() {
  zoom.track = null; zoom.hw = null; zoom.level = 1; zoom.min = 1; zoom.max = 4;
  try {
    const v = document.querySelector("#reader video");
    const track = v && v.srcObject && v.srcObject.getVideoTracks()[0];
    const caps = track && track.getCapabilities ? track.getCapabilities() : null;
    if (caps && caps.zoom && caps.zoom.max > caps.zoom.min) {
      zoom.track = track; zoom.hw = caps.zoom;
      zoom.min = caps.zoom.min; zoom.max = Math.min(caps.zoom.max, caps.zoom.min * 6);
      zoom.level = (track.getSettings && track.getSettings().zoom) || caps.zoom.min;
    }
  } catch (e) { /* preview zoom only */ }
}
function setZoom(z, { showPill = true } = {}) {
  z = Math.min(zoom.max, Math.max(zoom.min, z));
  zoom.level = z;
  if (zoom.hw && zoom.track) {
    // Coalesce rapid pinch updates into one constraint change per frame.
    if (!zoom.pending) zoom.pending = requestAnimationFrame(() => {
      zoom.pending = null;
      zoom.track.applyConstraints({ advanced: [{ zoom: zoom.level }] }).catch(() => {
        zoom.hw = null; zoom.min = 1; zoom.max = 4; setZoom(1);   // camera refused: fall back to preview zoom
      });
    });
  } else {
    $("#camera").style.setProperty("--view-zoom", z.toFixed(3));
  }
  if (showPill) {
    const pill = $("#zoom-pill");
    pill.textContent = `${(z / zoom.min).toFixed(1).replace(/\.0$/, "")}×`;
    pill.classList.add("show");
    clearTimeout(setZoom.t); setZoom.t = setTimeout(() => pill.classList.remove("show"), 900);
  }
}
(() => {
  const cam = $("#camera");
  let startDist = 0, startZoom = 1, lastTap = 0;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  cam.addEventListener("touchstart", e => {
    if (!camOn) return;
    if (e.touches.length === 2) { startDist = dist(e.touches); startZoom = zoom.level; e.preventDefault(); }
    else if (e.touches.length === 1 && !e.target.closest("button")) {
      // Double-tap the feed to go back to 1×.
      const now = Date.now();
      if (now - lastTap < 300) { setZoom(zoom.min); lastTap = 0; } else lastTap = now;
    }
  }, { passive: false });
  cam.addEventListener("touchmove", e => {
    if (!camOn || e.touches.length !== 2 || !startDist) return;
    e.preventDefault();
    setZoom(startZoom * (dist(e.touches) / startDist));
  }, { passive: false });
  cam.addEventListener("touchend", e => { if (e.touches.length < 2) startDist = 0; });
  // iOS also fires gesture events for pinches; stop them from zooming the page.
  ["gesturestart", "gesturechange", "gestureend"].forEach(t => cam.addEventListener(t, e => e.preventDefault()));
})();
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopCamera();
  else if (view === "scan" && state.settings.camOK) startCamera();
});

// Scan from a photo (fallback where the live camera is blocked).
let photoScanner = null;
function downscale(file, max) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      if (k === 1) { URL.revokeObjectURL(img.src); return resolve(file); }
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => resolve(b ? new File([b], "scan.jpg", { type: "image/jpeg" }) : file), "image/jpeg", 0.92);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}
async function scanPhoto(file) {
  const status = $("#photo-status");
  status.hidden = false;
  if (!window.Html5Qrcode) { status.textContent = "The scanner didn't load. Check your signal and reopen the app."; return; }
  status.textContent = "Reading code…";
  photoScanner = photoScanner || new Html5Qrcode("photo-reader", { verbose: false, formatsToSupport: scanFormats() });
  for (const max of [1600, 3000]) {        // normal size first, then full resolution for small codes
    try {
      const f = await downscale(file, max);
      const r = photoScanner.scanFileV2 ? await photoScanner.scanFileV2(f, false) : { decodedText: await photoScanner.scanFile(f, false) };
      const fmt = r && r.result && r.result.format && r.result.format.formatName;
      status.hidden = true;
      lastScan = { code: "", at: 0 };
      onDecoded(r.decodedText, fmt);
      return;
    } catch (e) { /* try next size */ }
  }
  beep(false);
  status.textContent = "No code found. Get closer so the code fills the photo, and avoid glare.";
}

function enterCode() {
  const d = el(`<div class="dialog"><p><b>Enter a code</b><br><span class="hint">For a damaged tag, or testing.</span></p>
    <input class="field" id="code-input" autocomplete="off" autocapitalize="off" placeholder="Code or link">
    <div class="seg" style="margin-top:10px" id="code-kind"><button data-k="tag" class="active">Shelf tag</button><button data-k="barcode">Barcode</button></div>
    <div class="btns" style="margin-top:16px"><button class="btn" data-a="c">Cancel</button><button class="btn primary" data-a="go">Go</button></div></div>`);
  const close = openLayer(d, { center: true });
  let kind = "tag";
  d.querySelectorAll("#code-kind button").forEach(b => (b.onclick = () => {
    kind = b.dataset.k; d.querySelectorAll("#code-kind button").forEach(x => x.classList.toggle("active", x === b));
    syncIndicator(d.querySelector("#code-kind"));
  }));
  const inp = d.querySelector("input");
  const go = () => { const v = inp.value.trim(); if (!v) return; close(); handleCode(v, kind); };
  d.querySelector('[data-a="go"]').onclick = go;
  d.querySelector('[data-a="c"]').onclick = close;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  setTimeout(() => inp.focus(), 50);
}

// ---------- Wire up ----------
fillIcons();
load();
document.querySelectorAll("#tabs button").forEach(b => (b.onclick = () => showView(b.dataset.view)));
document.querySelectorAll("#mode-seg button").forEach(b => (b.onclick = () => {
  setMode(b.dataset.mode);
  if (b.dataset.mode === "setup") startCamera();   // Link tags opens straight into the live camera where allowed
}));
$("#btn-cam-start").onclick = startCamera;
$("#btn-cam-stop").onclick = stopCamera;
$("#sync-ind").onclick = () => showView("more");
$("#btn-pick-manual").onclick = async () => {
  if (mode === "setup" && pending && pending.kind === "setupTag") {
    const tagCode = pending.code;
    const pid = await pickProduct({ title: "Which product is this tag for?" });
    if (pid) setupLink(tagCode, pid);
    return;
  }
  const pid = await pickProduct({ title: "Add which product?" });
  if (pid) productSheet(pid);
};
$("#btn-enter-code").onclick = enterCode;
$("#photo-input").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (f) scanPhoto(f);
});
setMode("count");
renderAll();
save();
syncAllIndicators(false);
if (state.settings.camOK) startCamera();

// Pull everyone's latest shared data on open, then upload anything waiting.
if (navigator.onLine) pullShared().catch(() => {}).finally(() => scheduleUpload(1000));

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
