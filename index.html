<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F40009">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shelf Scan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Shelf Scan</title>
<style>
/* Shelf Scan: one-handed iPhone tool.
   Rules: Coke red is reserved for the brand bar, primary actions and "selected"; everything else is warm neutrals.
   Controls that get used constantly sit in the bottom third (thumb reach); the top of the screen is for reading.
   Spacing steps: 4 / 8 / 12 / 16 / 24. Radii: 12 controls, 16 cards, 22 sheets. Touch targets are at least 44pt. */
:root {
  --red: #F40009; --red-press: #C80008; --on-red: #FFFFFF; --ink: #1B1B1B; --on-ink: #FFFFFF;
  --bg: #F3F1EF; --surface: #FFFFFF; --surface-2: #F9F8F6; --text: #151311; --muted: #6B6560; --faint: #A39E99;
  --line: #E7E3DF; --chip: #EDE9E5;
  --ok: #1E8E3E; --ok-soft: #E3F4E8; --warn: #A85F00; --warn-soft: #FFF0D8;
  --scrim: rgba(12, 8, 8, .5); --toast: #151311; --on-toast: #FFFFFF; --toast-action: #FF6B70;
  --shadow: 0 1px 2px rgba(40, 20, 20, .05), 0 6px 18px rgba(40, 20, 20, .06);
  --sheet-shadow: 0 -10px 34px rgba(0, 0, 0, .2);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --r: 16px; --tab-h: 56px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --spring: cubic-bezier(.2, .9, .3, 1.04); --ease-out: cubic-bezier(.22, 1, .36, 1);
}
@supports (transition-timing-function: linear(0, 1)) {
  :root { --spring: linear(0, 0.034 1.6%, 0.132 3.4%, 0.285 5.6%, 0.498 8.4%, 0.702 11.6%, 0.846 14.8%, 0.943 18.2%, 1.003 21.9%, 1.03 25.7%, 1.036 29.4%, 1.028 34.2%, 1.012 40.9%, 1.001 49.5%, 0.997 60%, 1); }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #F5F3F1; --on-ink: #111111;
    --bg: #000000; --surface: #151413; --surface-2: #1C1B1A; --text: #F5F3F1; --muted: #9C9692; --faint: #6B6662; --line: #272524; --chip: #232120;
    --ok: #4CC36E; --ok-soft: #13301D; --warn: #F2A742; --warn-soft: #3A2A10;
    --shadow: none; --sheet-shadow: 0 -10px 34px rgba(0, 0, 0, .65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #F5F3F1; --on-ink: #111111;
  --bg: #000000; --surface: #151413; --surface-2: #1C1B1A; --text: #F5F3F1; --muted: #9C9692; --faint: #6B6662; --line: #272524; --chip: #232120;
  --ok: #4CC36E; --ok-soft: #13301D; --warn: #F2A742; --warn-soft: #3A2A10;
  --shadow: none; --sheet-shadow: 0 -10px 34px rgba(0, 0, 0, .65); color-scheme: dark;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100vh; min-height: 100lvh; overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; padding-bottom: calc(var(--tab-h) + var(--safe-b)); }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; }
.hint { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.35; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 8px; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }

/* ---------- Brand bar ---------- */
header.top {
  position: sticky; top: 0; z-index: 20; background: var(--red); color: var(--on-red);
  padding: calc(6px + var(--safe-t)) 16px 6px; min-height: calc(44px + var(--safe-t));
  display: flex; align-items: center; gap: 10px;
}
header.top h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
header.top .spacer { flex: 1; }
.store { font-size: 13px; font-weight: 650; opacity: .9; }
.sync-ind { display: flex; align-items: center; gap: 4px; min-width: 44px; height: 44px; justify-content: center; margin: -6px -10px -6px 0; font-size: 12px; font-weight: 700; background: none; border: 0; color: var(--on-red); padding: 0; }
.sync-ind svg.i { width: 20px; height: 20px; }

main { padding: 16px 16px 24px; max-width: 640px; margin: 0 auto; }
.view { display: none; }
.view.active { display: block; animation: viewIn .3s var(--ease-out) both; }
.view > * + * { margin-top: 12px; }

/* ---------- Tab bar ---------- */
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 0 0 var(--safe-b); isolation: isolate; transition: transform .35s var(--ease-out); }
nav.tabs button { flex: 1; position: relative; z-index: 1; height: var(--tab-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 650; color: var(--faint); transition: color .25s ease; }
nav.tabs button.active { color: var(--red); }
nav.tabs.has-ind::before { content: ""; position: absolute; z-index: 0; left: 0; top: 6px; height: calc(var(--tab-h) - 12px); width: var(--ind-w, 0); transform: translateX(var(--ind-x, 0)); background: var(--chip); border-radius: 16px; pointer-events: none; transition: transform .5s var(--spring), width .5s var(--spring); }
nav.tabs.no-anim::before { transition: none; }
body.kb-open nav.tabs { transform: translateY(110%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s; }
.badge { position: absolute; top: 5px; left: calc(50% + 7px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--red); color: var(--on-red); font-size: 11px; font-weight: 800; line-height: 18px; padding: 0 5px; font-variant-numeric: tabular-nums; }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); font-weight: 650; font-size: 15px; text-decoration: none; transition: transform .45s var(--spring), background-color .2s ease; }
.btn:active { transform: scale(.97); transition-duration: .1s; }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.primary:active { background: var(--red-press); }
.btn.quiet { background: var(--chip); border-color: transparent; }
.btn.danger { color: var(--red); }
.btn.block { display: flex; width: 100%; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; }
.icon-btn { width: 44px; padding: 0; }
.seg { display: flex; position: relative; isolation: isolate; background: var(--chip); border-radius: 14px; padding: 3px; }
.seg button { position: relative; z-index: 1; flex: 1; min-height: 42px; border: 0; background: none; border-radius: 11px; font-weight: 700; font-size: 15px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; transition: color .25s ease; }
.seg button.active { color: var(--text); }
.seg.has-ind::before { content: ""; position: absolute; z-index: 0; left: 0; top: 3px; bottom: 3px; width: var(--ind-w, 0); transform: translateX(var(--ind-x, 0)); background: var(--surface); border-radius: 11px; box-shadow: 0 1px 3px rgba(0, 0, 0, .14); pointer-events: none; transition: transform .5s var(--spring), width .5s var(--spring); }
.seg.no-anim::before { transition: none; }
input.field, select.field, textarea.field { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); outline: none; }
input.field:focus, textarea.field:focus { border-color: var(--red); }
.search-wrap { position: relative; }
.search-wrap svg.i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); width: 18px; height: 18px; }
.search-wrap input.field { padding-left: 42px; }
label.f { display: block; font-size: 12px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }

/* ---------- Building blocks ---------- */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.pill { display: inline-block; font-size: 11px; font-weight: 750; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.kind.aisle { background: var(--chip); color: var(--text); } .pill.kind.display { background: var(--ink); color: var(--on-ink); }
.kcount { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--red); color: var(--on-red); font-size: 12px; font-weight: 800; line-height: 20px; font-variant-numeric: tabular-nums; }
.banner { display: flex; align-items: center; gap: 10px; background: var(--warn-soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 600; }
.banner.busy { background: var(--chip); font-weight: 500; }
.banner svg.i { color: var(--warn); }
.empty { text-align: center; padding: 56px 24px; color: var(--muted); }
.empty svg.i { width: 40px; height: 40px; color: var(--faint); }
.empty h3 { color: var(--text); margin: 12px 0 4px; font-size: 17px; }
.empty p { margin: 0; font-size: 14px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--red); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
.list-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.list-head h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.foot { text-align: center; color: var(--faint); font-size: 12px; margin: 24px 0 8px; }

/* ---------- Lists ---------- */
.list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px; position: relative; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 1px solid var(--line); }
.item.tap { cursor: pointer; transition: background-color .2s ease; }
.item.tap:active { background: var(--surface-2); }
.item .name { font-weight: 650; font-size: 16px; line-height: 1.25; }
.item > svg.i { color: var(--faint); width: 18px; height: 18px; }
.group-h { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 24px 4px 8px; display: flex; align-items: center; gap: 8px; }
.group-h .muted { font-weight: 700; letter-spacing: 0; }
.view > .group-h:first-child { margin-top: 8px; }
.cluster-h { display: flex; align-items: baseline; gap: 8px; font-size: 17px; font-weight: 800; letter-spacing: -.01em; margin: 24px 4px 8px; }
.cluster-h .n { font-size: 13px; font-weight: 700; color: var(--faint); }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--faint); background: none; flex: none; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--on-red); transition: background-color .15s ease, border-color .15s ease; }
.check svg.i { width: 17px; height: 17px; stroke-width: 3; }
.check.on { background: var(--red); border-color: var(--red); }
.shelf-thumb { position: relative; width: 52px; height: 52px; flex: none; border: 0; padding: 0; border-radius: 12px; overflow: hidden; background: var(--chip); display: flex; align-items: center; justify-content: center; color: var(--faint); }
.shelf-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shelf-thumb.missing img { display: none; }
.item.done .shelf-thumb { opacity: .45; }
.blurb { font-size: 16px; line-height: 1.35; }
.blurb .hl { font-weight: 800; background: color-mix(in srgb, var(--red) 12%, transparent); border-radius: 4px; padding: 0 2px; }
.item.done .blurb { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip-sm { font-size: 12px; font-weight: 650; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.flag-tag { font-size: 12px; font-weight: 750; padding: 3px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.need.flagged { box-shadow: inset 3px 0 0 var(--warn); }

/* ---------- Docked controls (bottom third, above the tab bar) ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + var(--safe-b) + 10px); z-index: 15; padding: 0 16px; pointer-events: none; display: flex; justify-content: center; gap: 10px; }
.dock > * { pointer-events: auto; max-width: 608px; }
.dock.solid { bottom: calc(var(--tab-h) + var(--safe-b)); padding: 10px 16px; background: var(--bg); border-top: 1px solid var(--line); pointer-events: auto; }
.dock.solid .seg { max-width: 608px; width: 100%; }
.dock .fab { box-shadow: 0 8px 22px rgba(0, 0, 0, .22); }
.dock-space { height: 84px; }
.fab { min-height: 52px; padding: 0 20px; border-radius: 26px; background: var(--red); border: 0; color: var(--on-red); font-weight: 750; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
.fab:active { background: var(--red-press); }
body.kb-open .dock { display: none; }

/* ---------- Capture: a viewfinder with the controls under the thumb ---------- */
#view-capture { padding: 0; }
#view-ba { padding: 0; }
#view-capture.active { display: flex; flex-direction: column; gap: 12px; height: calc(100dvh - 44px - var(--safe-t) - var(--tab-h) - var(--safe-b)); min-height: 440px; padding: 12px 16px 12px; }
#view-ba.active { display: flex; flex-direction: column; gap: 12px; height: calc(100dvh - 44px - var(--safe-t) - var(--tab-h) - var(--safe-b)); min-height: 440px; padding: 12px 16px 12px; }
#view-capture > * + * { margin-top: 0; }
#view-ba > * + * { margin-top: 0; }
.camera { position: relative; flex: 1 1 auto; min-height: 220px; border-radius: 24px; overflow: hidden; background: #000; border: 3px solid var(--red); transition: border-color .3s ease; }
#view-capture.mode-display .camera { border-color: var(--ink); }
#view-ba.mode-display .camera { border-color: var(--ink); }
.camera video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; animation: fade .4s ease both; }
.camera.flash::after { content: ""; position: absolute; inset: 0; z-index: 6; background: #fff; animation: fadeOut .35s ease forwards; pointer-events: none; }
.cam-off, .cam-wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; color: #D9D6D3; }
.cam-wait { font-size: 14px; }
.cam-off svg.i { width: 36px; height: 36px; opacity: .6; }
.cam-off p { margin: 0; font-size: 13px; max-width: 32ch; line-height: 1.4; }
.cam-off .btn.quiet { background: rgba(255, 255, 255, .14); color: #fff; }
.cam-chip { position: absolute; top: 12px; left: 12px; z-index: 3; padding: 6px 12px; border-radius: 999px; background: var(--red); color: var(--on-red); font-size: 11px; font-weight: 800; letter-spacing: .16em; transition: background-color .3s ease; }
#view-capture.mode-display .cam-chip { background: var(--ink); color: var(--on-ink); }
#view-ba.mode-display .cam-chip { background: var(--ink); color: var(--on-ink); }
.cam-stop { position: absolute; top: 8px; right: 8px; z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .5); color: #fff; display: flex; align-items: center; justify-content: center; }
.cam-stop svg.i { width: 18px; height: 18px; }
.queue-line { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 3; margin: 0; padding: 7px 14px; border-radius: 999px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); }
.queue-line:not(.busy) .spin { display: none; }
.deck { display: flex; flex-direction: column; gap: 12px; flex: none; }
.cap-seg { background: var(--chip); }
.deck-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.deck-side { width: 56px; height: 56px; border-radius: 16px; border: 0; padding: 0; background: var(--chip); color: var(--text); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.deck-side.left { justify-self: start; } .deck-side.right { justify-self: end; }
.deck-side img { width: 100%; height: 100%; object-fit: cover; display: block; }
.deck-side .badge { top: -2px; left: auto; right: -2px; }
.shutter-big { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--red); background: var(--surface); padding: 5px; transition: transform .45s var(--spring), border-color .3s ease; }
.shutter-big span { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--red); transition: background-color .3s ease; }
.shutter-big:active { transform: scale(.9); transition-duration: .1s; }
.shutter-big:disabled { opacity: .4; }
#view-capture.mode-display .shutter-big { border-color: var(--ink); }
#view-ba.mode-display .shutter-big { border-color: var(--ink); }
#view-capture.mode-display .shutter-big span { background: var(--ink); }
#view-ba.mode-display .shutter-big span { background: var(--ink); }
.cap-hint { margin: 0; text-align: center; font-size: 13px; color: var(--muted); }
#model-banner { flex: none; }

/* ---------- Sheets and dialogs ---------- */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .25s var(--ease-out) both; }
.overlay.closing { animation: fadeOut .22s ease forwards; pointer-events: none; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; overflow-y: auto; overscroll-behavior: contain; max-height: calc(100dvh - var(--safe-t) - 12px); border-radius: 24px 24px 0 0; padding: 10px 16px calc(56px + var(--safe-b)); margin-bottom: -40px; box-shadow: var(--sheet-shadow); animation: sheetIn .55s var(--spring) both; }
.overlay.closing .sheet { animation: sheetOut .24s cubic-bezier(.4, 0, .9, .6) forwards; }
.sheet > * + * { margin-top: 12px; }
.sheet h2 { margin: 4px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.sheet .handle { width: 38px; height: 5px; background: var(--line); border-radius: 3px; margin: 0 auto 6px; }
.overlay.center { align-items: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: 22px; padding: 22px; width: 100%; max-width: 380px; animation: dialogIn .45s var(--spring) both; }
.overlay.closing .dialog { animation: dialogOut .2s ease forwards; }
.dialog p { margin: 0 0 16px; line-height: 1.45; }
.dialog .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.menu-list { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.menu-list button { display: block; width: 100%; min-height: 52px; text-align: left; border: 0; background: none; padding: 0 16px; font-size: 16px; font-weight: 550; transition: background-color .15s ease; }
.menu-list button + button { border-top: 1px solid var(--line); }
.menu-list button:active { background: var(--chip); }
.menu-list button.danger { color: var(--red); }
.update-dialog { text-align: center; }
.update-dialog h3 { margin: 12px 0 6px; font-size: 19px; font-weight: 800; }
.update-dialog p { color: var(--muted); font-size: 15px; }
.update-dialog .btns { justify-content: stretch; }
.update-dialog .btns .btn { flex: 1; }
.update-icon { width: 52px; height: 52px; margin: 0 auto; border-radius: 16px; background: var(--red); color: var(--on-red); display: flex; align-items: center; justify-content: center; }
#toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + var(--safe-b) + 16px); z-index: 100; background: var(--toast); color: var(--on-toast); border-radius: 16px; padding: 12px 18px; display: flex; align-items: center; gap: 16px; max-width: calc(100% - 32px); font-size: 14px; font-weight: 550; box-shadow: 0 8px 28px rgba(0, 0, 0, .28); opacity: 0; transform: translate(-50%, 16px) scale(.96); pointer-events: none; transition: opacity .2s ease, transform .45s var(--spring); }
#toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
#toast button { background: none; border: 0; color: var(--toast-action); font-weight: 800; letter-spacing: .04em; padding: 8px 0 8px 4px; }

/* ---------- Recorder, note sheet, photo ---------- */
.rec-sheet { text-align: center; }
.rec-sheet h2 { text-align: center; }
.rec-meter { height: 12px; border-radius: 6px; background: var(--chip); overflow: hidden; margin: 16px 4px 0; }
.rec-meter i { display: block; height: 100%; width: 100%; background: var(--red); transform: scaleX(0); transform-origin: left; transition: transform .08s linear; }
.rec-time { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.rec-done { min-height: 60px; font-size: 18px; }
.rec-alt .btn { font-size: 14px; }
.transcript { font-size: 16px; line-height: 1.4; background: var(--surface); border-radius: 14px; padding: 12px 14px; }
.zoom-stage { position: relative; height: 34dvh; background: #000; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; touch-action: none; }
.zoom-stage img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center; will-change: transform; user-select: none; -webkit-user-drag: none; }
.zoom-stage.empty-photo::after { content: "No photo for this note"; color: #aaa; font-size: 13px; position: absolute; }
.zoom-hint { position: absolute; left: 12px; bottom: 8px; font-size: 11px; color: rgba(255, 255, 255, .7); pointer-events: none; }
.viewer-dots { display: flex; justify-content: center; gap: 8px; min-height: 12px; }
.viewer-dots:empty { display: none; }
.viewer-dots .dot { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; background: var(--line); }
.viewer-dots .dot.on { background: var(--text); }

/* ---------- Settings ---------- */
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.status-dot.ok { background: var(--ok); } .status-dot.warn { background: var(--warn); } .status-dot.bad { background: var(--red); }
.mprog { height: 10px; border-radius: 5px; background: var(--chip); overflow: hidden; margin-top: 12px; }
.mprog i { display: block; height: 100%; width: 0; background: var(--red); transition: width .3s ease; }
details.owner summary { cursor: pointer; font-weight: 650; color: var(--muted); font-size: 14px; list-style: none; min-height: 32px; display: flex; align-items: center; }
details.owner summary::-webkit-details-marker { display: none; }

/* ---------- Motion ---------- */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes viewIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheetOut { to { transform: translateY(100%); } }
@keyframes dialogIn { from { transform: scale(.92); opacity: 0; } 40% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes dialogOut { to { transform: scale(.95); opacity: 0; } }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.14); } 100% { transform: scale(1); } }
.bump { animation: bump .45s var(--spring); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

body[data-view="capture"] main { padding: 0; max-width: none; }
body[data-view="ba"] main { padding: 0; max-width: none; }
body[data-view="capture"] #view-capture.active { max-width: 640px; margin: 0 auto; }
body[data-view="ba"] #view-ba.active { max-width: 640px; margin: 0 auto; }
.item.compact { min-height: 52px; padding-top: 8px; padding-bottom: 8px; }

.by-tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;line-height:1;padding:4px 8px;border-radius:999px;background:var(--ink,#1d1d1f);color:#fff;white-space:nowrap}
.pend-tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;line-height:1;padding:4px 8px;border-radius:999px;border:1px dashed currentColor;opacity:.6;white-space:nowrap}

/* ---------- Note player: the word being said is lit up ---------- */
.w { border-radius: 4px; transition: background-color .12s ease, color .12s ease; }
.w.on { background: var(--ink); color: var(--on-ink); box-shadow: 0 0 0 2px var(--ink); }
.item.done .w.on { text-decoration: none; }
.pbtn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; padding: 0; background: var(--chip); color: var(--text); display: flex; align-items: center; justify-content: center; }
.pbtn svg.i { width: 18px; height: 18px; }
.pbtn.playing { background: var(--red); color: var(--on-red); }
.pbtn.big { width: 44px; height: 44px; }
.pbar { display: flex; align-items: center; gap: 12px; }
.pbar input[type=range] { flex: 1; min-width: 0; accent-color: var(--red); height: 32px; }
.ptime { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- Before/After ---------- */
.slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; flex: none; }
.slot { min-width: 0; min-height: 46px; padding: 3px 2px; border: 0; border-radius: 12px; background: var(--chip); color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; transition: background-color .2s ease, color .2s ease; }
.slot b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.slot small { height: 11px; font-size: 10px; font-weight: 700; line-height: 11px; opacity: .8; }
.slot.active { background: var(--ink); color: var(--on-ink); }
.slot.act { background: var(--red); color: var(--on-red); }
.slot.act:active { background: var(--red-press); }
.slot.act svg.i { width: 20px; height: 20px; }
.shot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.shot { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 12px; overflow: hidden; background: var(--chip); }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot span { position: absolute; left: 4px; bottom: 4px; padding: 2px 7px; border-radius: 999px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 11px; font-weight: 650; }
.shot-sheet .zoom-stage { aspect-ratio: auto; }

.save-hint { position: fixed; z-index: 200; left: 16px; right: 16px; top: calc(var(--safe-t) + 116px); max-width: 420px; margin: 0 auto; padding: 14px 16px; border-radius: 16px; background: var(--ink); color: var(--on-ink); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.35; pointer-events: none; }
.save-hint b { font-size: 16px; }

  <section class="view mode-aisle" id="view-ba">
    <div class="slots" id="ba-slots"></div>
    <div class="camera" id="ba-camera">
      <video id="ba-video" playsinline muted autoplay hidden></video>

  if (overwrite) {
    const map = new Map(buildSeedProducts().map(p => [p.id, p]));
    for (const id in remote.products) map.set(id, { ...remote.products[id] });
    for (const id in remote.deleted.products) map.delete(id);
    state.products = [...map.values()];
    state.deleted = { products: {} };
    state.outbox = { products: {} };
  } else {
    const localTs = id => { const p = productById(id); return Math.max(p ? p.updated || 0 : 0, state.deleted.products[id] || 0); };
    for (const id in remote.products) {
      const rp = remote.products[id];
      if ((rp.updated || 0) <= localTs(id)) continue;
      const i = state.products.findIndex(p => p.id === id);
      if (i >= 0) state.products[i] = { ...rp }; else state.products.push({ ...rp });
      delete state.deleted.products[id]; delete state.outbox.products[id];
    }
    for (const id in remote.deleted.products) {
      const ts = remote.deleted.products[id];
      if (ts <= localTs(id)) continue;
      state.products = state.products.filter(p => p.id !== id);
      state.deleted.products[id] = ts; delete state.outbox.products[id];
    }
  }
  state.products.forEach(p => (p._st = undefined));
  canonicalize(state.products);
}

async function pullShared({ overwrite = false, quiet = true } = {}) {
  let token = null;
  if (uploadsEnabled()) { try { token = await getToken(); } catch (e) { /* read without it */ } }
  const { text } = await readRepoFile(GITHUB.dataPath, token);
  const remote = text ? JSON.parse(text) : emptyShared();
  applyShared(remote, { overwrite });
  state.sync.lastPull = Date.now();
  if (!uploadsEnabled()) state.sync.error = "";
  save(); renderAll();
  if (!quiet) toast(overwrite ? "Replaced with the shared data" : "Up to date");
}

// ---------- Database key (unlocks the saved GitHub access token) ----------
const KDF_ITER = 250000;
async function deriveAesKey(password, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptToken(token, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAesKey(password, salt, KDF_ITER);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(token));
  return { v: 1, kdf: "PBKDF2-SHA256", iter: KDF_ITER, salt: bytesToB64(salt), iv: bytesToB64(iv), ct: bytesToB64(ct) };
}
async function decryptToken(blob, password) {
  const key = await deriveAesKey(password, b64ToBytes(blob.salt), blob.iter);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.ct));
  return new TextDecoder().decode(pt);
}
function getPass() { try { return localStorage.getItem(PASS_KEY) || ""; } catch (e) { return ""; } }
function setPass(p) { try { if (p) localStorage.setItem(PASS_KEY, p); else localStorage.removeItem(PASS_KEY); } catch (e) {} }
const uploadsEnabled = () => !!getPass();
let cachedToken = null;
async function loadKeyBlob() {
  const { text } = await readRepoFile(GITHUB.keyPath, null);
  if (!text) throw new Error("Uploads haven't been set up for this app yet.");
  return JSON.parse(text);
}
async function getToken() {
  if (cachedToken) return cachedToken;
  const pass = getPass();
  if (!pass) throw new Error("Uploads are off");
  const blob = await loadKeyBlob();
  try { cachedToken = await decryptToken(blob, pass); }
  catch (e) { const err = new Error("The database key no longer works. Connect again."); err.auth = true; throw err; }
  return cachedToken;
}
async function checkToken(token) {
  const r = await fetch(apiBase, { headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}` }, cache: "no-store" });
  if (r.status === 401) throw new Error("GitHub didn't accept that key.");
  if (!r.ok) throw new Error(`Couldn't reach the repository (${r.status}). Check that the key has access to ${GITHUB.repo}.`);
  const j = await r.json();
  if (j.permissions && !j.permissions.push) throw new Error("That key can read but not write. Give it Contents: Read and write.");
}

// ---------- Automatic uploads ----------
let uploadTimer = null, uploading = false, uploadAgain = false;
function scheduleUpload(delay = UPLOAD_DELAY_MS) {
  renderSyncIndicator();
  if (!uploadsEnabled()) return;
  clearTimeout(uploadTimer);
  uploadTimer = setTimeout(uploadChanges, delay);
}
async function uploadChanges() {
  if (!uploadsEnabled() || !pendingCount()) { renderSyncIndicator(); return; }
  if (!navigator.onLine) { state.sync.error = "offline"; renderSyncIndicator(); return; }
  if (uploading) { uploadAgain = true; return; }
  uploading = true; renderSyncIndicator();
  try {
    const token = await getToken();
    // What we're sending, with the timestamp it had, so later edits aren't wrongly cleared.
    const sentP = {};
    for (const id in state.outbox.products) { const p = productById(id); sentP[id] = p ? p.updated : state.deleted.products[id] || 0; }
    for (let attempt = 0; attempt < 4; attempt++) {
      const { text, sha } = await readRepoFile(GITHUB.dataPath, token);
      const R = normShared(text ? JSON.parse(text) : null);
      let n = 0;
      for (const id in sentP) {
        const rTs = Math.max((R.products[id] && R.products[id].updated) || 0, R.deleted.products[id] || 0);
        if (rTs > sentP[id]) continue;                         // someone else changed it more recently
        const p = productById(id);
        if (p) { R.products[id] = shareable(p); delete R.deleted.products[id]; }
        else { delete R.products[id]; R.deleted.products[id] = state.deleted.products[id] || Date.now(); }
        n++;
      }
      R.updated = Date.now();
      try {
        await writeRepoFile(GITHUB.dataPath, JSON.stringify(R, null, 1), sha, token,
          `Shelf Scan: ${n} change${n === 1 ? "" : "s"}${state.storeName ? ` (store ${state.storeName})` : ""}`);
      } catch (e) { if (e.conflict) continue; throw e; }   // someone uploaded at the same moment; re-read and retry
      for (const id in sentP) {
        const p = productById(id), now = p ? p.updated : state.deleted.products[id] || 0;
        if (now === sentP[id]) delete state.outbox.products[id];
      }
      applyShared(R);                                        // pick up everyone else's changes too
      state.sync.lastPush = state.sync.lastPull = Date.now();
      state.sync.error = "";
      save(); renderAll();
      return;
    }
    throw new Error("Too many people uploading at once. Will retry.");
  } catch (e) {
    state.sync.error = e.message || String(e);
    if (e.auth) cachedToken = null;
    save();
    if (!e.auth) scheduleUpload(30000);                      // try again shortly
  } finally {
    uploading = false;
    renderSyncIndicator();
    if (view === "more") renderMore();
    if (uploadAgain) { uploadAgain = false; scheduleUpload(500); }
  }
}
window.addEventListener("online", () => { state.sync.error = ""; scheduleUpload(500); });

function syncStatus() {
  const n = pendingCount();
  if (!uploadsEnabled()) return { dot: "", text: "Uploads are off on this phone", short: "" };
  if (uploading) return { dot: "warn", text: `Uploading ${n} change${n === 1 ? "" : "s"}…`, short: "up" };
  if (state.sync.error === "offline" || (!navigator.onLine && n)) return { dot: "warn", text: `${n} change${n === 1 ? "" : "s"} waiting for signal`, short: "wait" };
  if (state.sync.error) return { dot: "bad", text: state.sync.error, short: "err" };
  if (n) return { dot: "warn", text: `${n} change${n === 1 ? "" : "s"} waiting to upload`, short: "wait" };
  return { dot: "ok", text: `All changes uploaded${state.sync.lastPush ? " · " + ago(state.sync.lastPush) : ""}`, short: "ok" };
}
function renderSyncIndicator() {
  const b = $("#sync-ind"); if (!b) return;
  const s = syncStatus(), n = pendingCount();
  b.hidden = !s.short;
  b.innerHTML = s.short === "ok" ? icon("cloud") : s.short === "err" ? icon("cloudoff") : `${icon("upload")}${n || ""}`;
  b.setAttribute("aria-label", s.text);
}

// ============================================================
// Team sync (Beta 6): phones that use the same team key share one Needed list through the GitHub repo.
// ============================================================
// Everything lives in one folder (sync/). Each phone only ever writes its own files, so nothing can conflict:
//   <keyhash>_<phone>_<note>.json   the note (words, Aisle/Display, photo names)
//   <keyhash>_<phone>_<photo>.jpg   a photo (already shrunk to ~150 KB)
//   <keyhash>_<phone>_ticks.json    this phone's ticks (the newest tick on a product wins, whoever made it)
// Other phones' files are read, never changed. A phone deletes its own files when the note goes (or after 7 days).
const TEAM_DIR = "sync", TEAM_POLL_MS = 5000, TEAM_MAX_AGE = 7 * 24 * 3600 * 1000;
const devId = (() => {
  const make = () => "d" + Math.random().toString(36).slice(2, 8);
  try { let d = localStorage.getItem("shelfscan.dev"); if (!d) { d = make(); localStorage.setItem("shelfscan.dev", d); } return d; } catch (e) { return make(); }
})();
const T = { kh: "", khFor: "", list: new Map(), listCount: 0, listed: false, etag: "", busy: false, again: false, ticksDirty: false, last: 0, error: "", offline: false, miss: false, devices: new Set([devId]), timer: null, priv: null, privFor: "" };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isMine = n => !n.dev;
const teamKey = () => ((state.team && state.team.key) || "").trim().toLowerCase().replace(/\s+/g, " ");
const teamOn = () => !!teamKey() && uploadsEnabled();
const myName = () => (state.team.name || "").trim() || `Phone ${devId.slice(-3).toUpperCase()}`;
const teamRepo = () => (state.team.repo || "").trim() || `${GITHUB.owner}/${GITHUB.repo}`;
const teamShares = n => isMine(n) && n.status === "done" && !!n.text && Date.now() - n.at < TEAM_MAX_AGE;
const teamPending = n => !!teamKey() && teamShares(n) && (n.mod || 0) > (n.pushed || 0);
async function keyHash() {
  const k = teamKey(); if (T.khFor === k) return T.kh;
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("shelfscan|" + k));
  T.kh = [...new Uint8Array(buf)].slice(0, 5).map(b => b.toString(16).padStart(2, "0")).join(""); T.khFor = k;
  T.list = new Map(); T.etag = ""; T.listed = false; return T.kh;
}
const blobToB64 = b => new Promise(res => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.readAsDataURL(b); });

// ---- GitHub calls ----
async function gh(path, { method = "GET", body, accept, etag } = {}) {
  const token = await getToken();
  const headers = { Accept: accept || "application/vnd.github+json", Authorization: `Bearer ${token}` };
  if (body) headers["Content-Type"] = "application/json";
  if (etag) headers["If-None-Match"] = etag;
  return fetch(`https://api.github.com/repos/${teamRepo()}${path ? "/" + path : ""}`, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
}
function httpErr(r) {
  if (r.status === 401) { const e = new Error("GitHub didn't accept the saved key. Connect again."); e.auth = true; return e; }
  if (r.status === 403 || r.status === 429) return new Error("GitHub is limiting requests. Pausing a moment.");
  if (r.status === 404) return new Error("Can't find that repo, or the key can't see it.");
  return new Error(`GitHub said ${r.status}`);
}
async function teamList() {
  const r = await gh(`contents/${TEAM_DIR}?ref=${GITHUB.branch}`, { etag: T.etag });
  if (r.status === 304) return false;
  if (r.status === 404) { T.list = new Map(); T.listCount = 0; T.etag = ""; T.listed = true; return true; }
  if (!r.ok) throw httpErr(r);
  const arr = await r.json();
  T.etag = r.headers.get("ETag") || "";
  T.list = new Map(arr.filter(f => f.type === "file").map(f => [f.name, f.sha])); T.listCount = arr.length; T.listed = true;
  return true;
}
async function teamReadJSON(name) {
  const r = await gh(`contents/${TEAM_DIR}/${name}?ref=${GITHUB.branch}`);
  if (r.status === 404) return null;
  if (!r.ok) throw httpErr(r);
  const j = await r.json();
  try { return JSON.parse(b64decode(j.content)); } catch (e) { return null; }
}
async function teamPut(name, b64, message) {
  for (let a = 0; a < 3; a++) {
    const sha = T.list.get(name);
    const r = await gh(`contents/${TEAM_DIR}/${name}`, { method: "PUT", body: { message, content: b64, branch: GITHUB.branch, ...(sha ? { sha } : {}) } });
    if (r.ok) { const j = await r.json(); T.list.set(name, j.content.sha); return; }
    if (r.status === 409) { await sleep(400 + Math.random() * 700); continue; }   // the other phone committed at the same moment
    if (r.status === 422) { if (name.endsWith(".jpg")) { if (!T.list.has(name)) T.list.set(name, "?"); return; } T.etag = ""; throw new Error("Sync hiccup. Retrying."); }
    throw httpErr(r);
  }
  throw new Error("GitHub was busy. Retrying.");
}
async function teamDel(name, sha) {
  for (let a = 0; a < 3; a++) {
    const r = await gh(`contents/${TEAM_DIR}/${name}`, { method: "DELETE", body: { message: "Shelf Scan: remove", sha, branch: GITHUB.branch } });
    if (r.ok || r.status === 404 || r.status === 422) { T.list.delete(name); if (r.status === 422) T.etag = ""; return; }
    if (r.status === 409) { await sleep(400 + Math.random() * 700); continue; }
    throw httpErr(r);
  }
}

// ---- noticing changes (called from save) ----
// An own note counts as changed when its words, kind, photos, status or author name change; a tick when its value flips.
function teamTrack() {
  if (!teamKey() || !state.team) return false;
  const now = Date.now(), tk = state.team.tick; let touched = false;
  for (const n of state.notes) {
    if (isMine(n)) {
      const sig = JSON.stringify([n.text, n.kind, n.photos, n.status, myName()]);
      if (n._sig !== sig) { n._sig = sig; n.mod = now; touched = true; }
    }
    const dev = n.dev || devId, keys = new Set([...Object.keys(n.ticks || {}), ...(n.parts || []).map(p => p.vk), "?"]);
    for (const vk of keys) {
      const k = `${dev}/${n.id}/${vk}`, cur = !!(n.ticks || {})[vk], e = tk[k];
      if ((e ? e.v : false) !== cur) { tk[k] = { v: cur, t: now, by: devId }; T.ticksDirty = true; touched = true; }
    }
  }
  return touched;
}
function teamSoon(ms = 1500) { clearTimeout(T.timer); T.timer = setTimeout(teamCycle, ms); }

// ---- bringing in other phones' work ----
function applyTheirNote(dev, kh, j) {
  if (!j || !j.id || !j.text || state.team.hidden[j.id]) return false;
  if (Date.now() - (j.at || 0) > TEAM_MAX_AGE) return false;
  let n = state.notes.find(x => x.id === j.id), isNew = false;
  if (!n) { n = { id: j.id, at: j.at, photos: [], audio: null, secs: 0, status: "done", ticks: {}, err: "", dev, team: kh }; state.notes.push(n); isNew = true; }
  else if (!n.dev) return false;   // never overwrite one of my own notes
  if (!isNew && n.mod === j.mod) return false;
  let r; try { r = readBlurb(j.text); } catch (e) { r = { parts: [], flag: true }; }
  Object.assign(n, { text: j.text, kind: j.kind === "display" ? "display" : "aisle", photos: j.photos || [], mod: j.mod, by: j.by || "", parts: r.parts, flag: r.flag, at: j.at });
  return true;
}
// For every product on every note the newest tick wins, whichever phone made it.
function teamMergeTicks() {
  const tk = state.team.tick, eff = { ...tk };
  for (const dev in state.team.rt) for (const [k, e] of Object.entries(state.team.rt[dev])) { const c = eff[k]; if (!c || e.t > c.t) eff[k] = e; }
  for (const n of state.notes) {
    const pre = `${n.dev || devId}/${n.id}/`;
    for (const k in eff) if (k.startsWith(pre)) { const vk = k.slice(pre.length), e = eff[k]; n.ticks = n.ticks || {}; if (!!n.ticks[vk] !== e.v) n.ticks[vk] = e.v; if (e !== tk[k]) tk[k] = { v: e.v, t: e.t, by: e.by }; }
  }
}
async function teamPull(kh) {
  let touched = false; T.miss = false; T.devices = new Set([devId]);
  const pre = kh + "_", theirs = [];
  for (const name of T.list.keys()) {
    if (!name.startsWith(pre)) continue;
    const rest = name.slice(pre.length), i = rest.indexOf("_"); if (i < 0) continue;
    const dev = rest.slice(0, i); T.devices.add(dev);
    if (dev !== devId) theirs.push({ name, dev, what: rest.slice(i + 1) });
  }
  for (const f of theirs) {
    if (!f.what.endsWith(".json")) continue;
    const sha = T.list.get(f.name); if (state.team.seen[f.name] === sha) continue;
    const j = await teamReadJSON(f.name); if (!j) continue;
    if (f.what === "ticks.json") { state.team.rt[f.dev] = j.t || {}; touched = true; }
    else if (applyTheirNote(f.dev, kh, j)) touched = true;
    state.team.seen[f.name] = sha;
  }
  // Their notes that are gone (deleted or expired), or that belong to another team key, leave this phone too.
  if (T.listCount < 1000) {
    const have = new Set(theirs.map(f => f.name)), before = state.notes.length;
    state.notes = state.notes.filter(n => isMine(n) || (n.team === kh && have.has(`${kh}_${n.dev}_${n.id}.json`) && Date.now() - n.at < TEAM_MAX_AGE));
    if (state.notes.length !== before) touched = true;
  }
  for (const n of state.notes) if (n.dev) for (const pid of n.photos || []) {
    if (await getPhoto(pid).catch(() => null)) continue;
    const nm = `${kh}_${n.dev}_${pid}.jpg`;
    if (!T.list.has(nm)) { T.miss = true; continue; }
    const r = await gh(`contents/${TEAM_DIR}/${nm}?ref=${GITHUB.branch}`, { accept: "application/vnd.github.raw" });
    if (r.ok) { await putPhoto(pid, new Blob([await r.arrayBuffer()], { type: "image/jpeg" })); touched = true; } else T.miss = true;
  }
  if (touched) { state.notes.sort((a, b) => b.at - a.at); teamMergeTicks(); }
  return touched;
}

// ---- sending this phone's work ----
async function teamPush(kh) {
  const mine = state.notes.filter(teamShares), my = `${kh}_${devId}_`;
  for (const n of mine) {
    if ((n.mod || 0) <= (n.pushed || 0)) continue;
    const mod = n.mod;
    for (const pid of n.photos || []) {
      const nm = `${my}${pid}.jpg`; if (T.list.has(nm)) continue;
      const b = await getPhoto(pid).catch(() => null); if (!b) continue;
      await teamPut(nm, await blobToB64(b), "Shelf Scan: photo");
    }
    await teamPut(`${my}${n.id}.json`, b64encode(JSON.stringify({ id: n.id, at: n.at, mod, kind: noteKind(n), text: n.text, photos: n.photos || [], by: myName() })), "Shelf Scan: note");
    n.pushed = mod; save();
  }
  // Ticks: only this phone's own entries, for notes that still exist.
  const tk = state.team.tick, alive = new Set(state.notes.map(n => `${n.dev || devId}/${n.id}/`));
  for (const k of Object.keys(tk)) { const i = k.indexOf("/", k.indexOf("/") + 1); if (!alive.has(k.slice(0, i + 1))) delete tk[k]; }
  if (T.ticksDirty) {
    const t = {}; for (const k in tk) if (tk[k].by === devId) t[k] = tk[k];
    await teamPut(`${my}ticks.json`, b64encode(JSON.stringify({ t })), "Shelf Scan: ticks");
    T.ticksDirty = false;
  }
  // Clean up: my files for notes that are gone, cleared, expired or whose photo was removed.
  if (T.listed && T.listCount < 1000) {
    const keep = new Set([`${my}ticks.json`, ...mine.map(n => `${my}${n.id}.json`), ...mine.flatMap(n => (n.photos || []).map(p => `${my}${p}.jpg`))]);
    for (const [name, sha] of [...T.list]) if (name.startsWith(my) && !keep.has(name)) await teamDel(name, sha);
  }
}

async function teamCycle() {
  if (!teamOn()) { teamStatusRender(); return; }
  if (!navigator.onLine) { T.offline = true; teamStatusRender(); return; }
  if (T.busy) { T.again = true; return; }
  T.busy = true; T.offline = false;
  try {
    const kh = await keyHash();
    if (T.privFor !== teamRepo()) { const r = await gh(""); if (r.ok) { T.priv = !!(await r.json()).private; T.privFor = teamRepo(); } else throw httpErr(r); }
    const changed = await teamList();
    const touched = (changed || T.miss) ? await teamPull(kh) : false;
    await teamPush(kh);
    T.error = ""; T.last = Date.now();
    if (touched) { save(); renderAll(); }
  } catch (e) { T.error = e.message || String(e); if (e.auth) cachedToken = null; }
  finally { T.busy = false; teamStatusRender(); if (T.again) { T.again = false; teamSoon(300); } }
}

// ---- what the screens show ----
const teamWaiting = () => state.notes.filter(teamPending).length + (T.ticksDirty ? 1 : 0);
function teamStatus() {
  const w = teamWaiting();
  if (!teamKey()) return { dot: "", text: "Off. Enter a team key to share your list." };
  if (!uploadsEnabled()) return { dot: "warn", text: "Connect above first. The database key unlocks the connection." };
  if (T.offline || !navigator.onLine) return { dot: "warn", text: w ? `${w} waiting for signal` : "No signal. Your list is safe on this phone." };
  if (T.error) return { dot: "bad", text: T.error };
  if (!T.last) return { dot: "warn", text: "Connecting…" };
  const n = T.devices.size;
  return { dot: w ? "warn" : "ok", text: `${w ? `Sending ${w}…` : "Live"} · ${n} phone${n === 1 ? "" : "s"} on this key · checked ${ago(T.last)}` };
}
function teamStatusRender() {
  const s = teamStatus(), t = document.getElementById("team-status-text"), d = document.getElementById("team-status-dot");
  if (t) t.textContent = s.text;
  if (d) d.className = "status-dot " + s.dot;
}
setInterval(teamStatusRender, 3000);
function teamTags(n) {
  let h = "";
  if (n.dev && n.by) h += `<span class="by-tag">${esc(n.by)}</span>`;
  if (teamPending(n)) h += `<span class="pend-tag">Not synced yet</span>`;
  return h;
}
function teamSetKey(k) {
  k = k.trim();
  if (k.toLowerCase() === (state.team.key || "").toLowerCase()) { state.team.key = k; save(); return; }
  state.team.key = k; state.team.seen = {}; state.team.rt = {};
  state.notes = state.notes.filter(isMine);
  for (const n of state.notes) { n.pushed = 0; n._sig = ""; }
  T.list = new Map(); T.etag = ""; T.khFor = ""; T.listed = false; T.last = 0; T.ticksDirty = true;
  save(); renderAll(); if (teamKey()) teamSoon(300);
}
async function teamTest() {
  if (!uploadsEnabled()) return toast("Connect first");
  if (!teamKey()) return toast("Enter a team key first");
  try {
    const r = await gh("");
    if (!r.ok) throw httpErr(r);
    const j = await r.json();

const timeOf = ts => new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

// ---------- Capture ----------

    vb.querySelector("button").onclick = () => showView("more");
  } else vb.hidden = true;

function noteSummary(n) {
  if (n.status === "queued") return haveModel("asr") ? "Waiting to listen…" : "Saved. It will be read once the speech model is downloaded.";
  if (n.status === "error") return n.err || "Couldn't read this note";

}

// ---------- Needed ----------
// Each blurb is a row, word for word. The matcher only decides where it sits: a blurb shows up under every
// product it mentions (so working through the back room one product at a time, nothing is missed), with a tick
// of its own for each product. Aisle and display needs never mix.
const KINDS = ["aisle", "display"];
const noteKind = n => (n.kind === "display" ? "display" : "aisle");
const KIND_LABEL = { aisle: "Aisle", display: "Display" };
const captureKind = () => (state.settings.captureKind === "display" ? "display" : "aisle");
const curKind = () => (state.settings.needKind === "display" ? "display" : "aisle");
const CHECK_GROUP = "Check the text";
// The products (brand + flavor) a blurb is listed under: one appearance each, or a single "?" one when none were recognized.
// The Needed list is organized by brand. The note keeps the flavor in its words; the matcher only has to get the brand right.
const brandMap = () => { const m = new Map(); for (const p of state.products) { const k = sNorm(p.brand); if (!m.has(k)) m.set(k, p.brand); } return m; };
function appearances(n) {
  const bm = brandMap(), vks = [...new Set((n.parts || []).map(p => p.vk).filter(k => bm.has(k)))];
  return vks.length ? vks.map(vk => ({ key: vk, vk })) : [{ key: "?", vk: null }];
}
const noteDone = n => appearances(n).every(a => (n.ticks || {})[a.key]);
const listed = kind => state.notes.filter(n => noteKind(n) === kind && n.status === "done" && n.text);
const openCount = kind => listed(kind).filter(n => !noteDone(n)).length;
// Blurbs are clustered by brand and flavor (Coca-Cola and Diet Coke first, then alphabetical); the ones nothing was recognized in come first.
function neededGroups(kind) {
  const bm = brandMap(), clusters = new Map();
  for (const n of listed(kind)) for (const a of appearances(n)) (clusters.get(a.key) || clusters.set(a.key, []).get(a.key)).push({ n, a });
  const rank = v => { const i = BRAND_FIRST.indexOf(v.brand); return i < 0 ? 99 : i; };
  const list = [...clusters.entries()].map(([key, rows]) => ({ key, v: key === "?" ? null : { brand: bm.get(key), flavor: "" }, rows: rows.sort((r1, r2) => r1.n.at - r2.n.at) }));
  list.sort((c1, c2) => (!c1.v ? -1 : !c2.v ? 1 : rank(c1.v) - rank(c2.v) || c1.v.brand.localeCompare(c2.v.brand) || c1.v.flavor.localeCompare(c2.v.flavor)));
  return list;
}
function wireKindSeg(v) {
  const seg = v.querySelector("#kind-seg"); if (!seg) return;
  seg.querySelectorAll("button").forEach(b => (b.onclick = () => { if (state.settings.needKind === b.dataset.k) return; state.settings.needKind = b.dataset.k; save(); renderNeeded(); }));
  syncIndicator(seg, false);
}
function renderNeeded() {
  const v = $("#view-needed");
  const kind = curKind(), q = queueState();
  const notes = listed(kind), open = notes.filter(n => !noteDone(n)).length;
  // The Aisle | Display switch is docked at the bottom, where a thumb can reach it.
  const dock = `<div class="dock-space"></div><div class="dock solid"><div class="seg" id="kind-seg">${KINDS.map(k => `<button data-k="${k}" class="${k === kind ? "active" : ""}">${KIND_LABEL[k]}${openCount(k) ? ` <span class="kcount">${openCount(k)}</span>` : ""}</button>`).join("")}</div></div>`;
  let html = `<div class="list-head"><h2>Needed</h2><span class="muted small">${notes.length ? `${open} to go` : ""}</span></div>`;
  if (q.text) html += `<div class="banner ${q.busy ? "busy" : ""}"><span class="spin"></span><span class="grow">${esc(q.text)}</span></div>`;
  const waiting = state.notes.filter(n => noteKind(n) === kind && (n.status === "empty" || n.status === "error"));   // a photo with no words yet
  if (!notes.length && !waiting.length) {
    html += `<div class="empty">${icon("list")}<h3>Nothing needed ${kind === "display" ? "on displays" : "in aisles"} yet</h3><p>Snap a ${kind === "display" ? "display" : "shelf"} and say what's missing. It lands here.</p></div>`;
    v.innerHTML = html + dock; wireKindSeg(v); v.onclick = null; return;
  }
  if (waiting.length) html += `<div class="group-h">${icon("mic")}Needs a recording</div><div class="list">${waiting.map(waitRow).join("")}</div>`;
  for (const c of neededGroups(kind)) {
    html += c.v ? `<div class="cluster-h">${esc(vName(c.v))}<span class="n">${c.rows.length}</span></div>` : `<div class="group-h">${icon("warn")}Check the text</div>`;
    html += `<div class="list">${c.rows.map(r => needRow(r.n, r.a)).join("")}</div>`;
  }
  html += `<button class="btn block quiet" id="btn-clear-all" style="margin-top:24px">Clear the whole list</button>`;
  v.innerHTML = html + dock; wireKindSeg(v);
  hydratePhotos(v);
  v.onclick = e => {
    if (e.target.closest("#btn-clear-all")) return clearAllNotes();
    const row = e.target.closest(".need[data-n]"); if (!row) return;
    const n = state.notes.find(x => x.id === row.dataset.n); if (!n) return;
    if (e.target.closest('[data-a="play"]')) return playerToggle(n);
    if (e.target.closest('[data-a="toggle"]')) { n.ticks = n.ticks || {}; n.ticks[row.dataset.k] = !n.ticks[row.dataset.k]; save(); renderAll(); }
    else openCheck(n, row.dataset.k);
  };
}
// A photo that has no words yet (nothing was heard, or the app restarted while recording): tap to record it again.
const waitRow = n => `<div class="item need tap flagged" data-n="${esc(n.id)}" data-k="?"><div class="shelf-thumb" data-photo-wrap>${n.photos[0] ? `<img data-photo="${esc(n.photos[0])}" alt="">` : icon("note")}</div>
  <div class="grow"><div class="blurb">${esc(n.status === "error" ? (n.err || "Couldn't read this note") : "Nothing was heard. Tap to record it again.")}</div>${teamTags(n) ? `<div class="chips-row">${teamTags(n)}</div>` : ""}</div>${icon("jump")}</div>`;
// The blurb with the part about this product in bold.
function markText(n, pid) {
  const t = n.text || "";
  const ranges = (n.parts || []).filter(p => p.vk === pid).map(p => [p.s, p.e]).sort((a, b) => a[0] - b[0]);
  let html = "", i = 0;
  for (const [s, e] of ranges) { if (s < i) continue; html += esc(t.slice(i, s)) + `<b class="hl">${esc(t.slice(s, e))}</b>`; i = e; }
  return html + esc(t.slice(i));
}
const chipsFor = (n, exceptVk) => { const bm = brandMap(); return [...new Set((n.parts || []).map(p => p.vk))].filter(k => k !== exceptVk && bm.has(k))
  .map(k => `<span class="chip-sm">${esc(bm.get(k))}</span>`).join(""); };
function needRow(n, a) {
  const done = !!(n.ticks || {})[a.key], chips = chipsFor(n, a.vk);
  return `<div class="item need tap${done ? " done" : ""}${n.flag ? " flagged" : ""}" data-n="${esc(n.id)}" data-k="${esc(a.key)}">
    <button class="check${done ? " on" : ""}" data-a="toggle" aria-label="Mark as pulled">${icon("check")}</button>
    <div class="shelf-thumb" data-photo-wrap>${n.photos[0] ? `<img data-photo="${esc(n.photos[0])}" alt="">` : icon("note")}</div>
    <div class="grow"><div class="blurb">${noteTextHTML(n, a.vk)}</div>${chips || n.flag || teamTags(n) ? `<div class="chips-row">${teamTags(n)}${chips}${n.flag ? `<span class="flag-tag">Check the text</span>` : ""}</div>` : ""}</div>
    ${n.audio ? `<button class="pbtn" data-a="play" data-n="${esc(n.id)}" aria-label="Play the recording">${icon("play")}</button>` : ""}
    ${icon("jump")}</div>`;
}
function clearAllNotes() {
  confirmDialog("Clear the whole list? This removes every note and photo from this phone. If you share a list, your own notes leave it too.", { ok: "Clear list", danger: true }).then(ok => {
    if (!ok) return;
    const snap = snapshot();
    for (const n of state.notes) if (n.dev) state.team.hidden[n.id] = Date.now();   // the other phone's notes just leave this phone's view
    state.notes = []; lastNoteId = null; save(); renderAll(); scheduleSweep();

// ---------- A note: photo, words, and everything you can do with it ----------
function openCheck(n, focusPid) {
  let photoIdx = 0;
  const s = el(`<div class="sheet check-sheet"><div class="handle"></div><h2>Check against the photo</h2>
    <div class="zoom-stage" id="ck-stage"><img alt=""><span class="zoom-hint">Pinch to zoom</span></div><div class="viewer-dots" id="ck-dots" style="padding:0"></div>
    <div class="transcript" id="ck-text"></div><div class="hint" id="ck-heard"></div>${n.audio ? playerBarHTML(n) : ""}<div class="chips-row" id="ck-chips"></div>
    <div class="row" id="ck-actions"></div><button class="btn primary block" data-a="close">Done</button></div>`);
  const close = openLayer(s, { onClose: () => { playerStop(); renderAll(); } });
  wirePlayerBar(s, n);
  s.querySelector("#ck-text").onclick = e => { const w = e.target.closest(".w"); if (w && n.audio) playerSeek(n, +w.dataset.s); };
  const img = s.querySelector("img");
  zoomStage(img, s.querySelector("#ck-stage"));
  const showPhoto = async () => {
    const id = n.photos[photoIdx];
    img.src = id ? (await photoURL(id)) || "" : "";
    s.querySelector("#ck-stage").classList.toggle("empty-photo", !id);
    s.querySelector("#ck-dots").innerHTML = n.photos.length > 1 ? n.photos.map((_, k) => `<button class="dot${k === photoIdx ? " on" : ""}" data-k="${k}" aria-label="Photo ${k + 1}"></button>`).join("") : "";
  };
  s.querySelector("#ck-dots").onclick = e => { const b = e.target.closest("[data-k]"); if (b) { photoIdx = +b.dataset.k; showPhoto(); } };
  const draw = () => {
    s.querySelector("#ck-heard").innerHTML = n.heard && n.heard !== n.text ? `Heard as “${esc(n.heard)}”` : "";
    s.querySelector("#ck-text").innerHTML = n.text ? `“${noteTextHTML(n, focusPid && focusPid !== "?" ? focusPid : null)}”` : "(no words: typed or no recording)";
    s.querySelector("#ck-chips").innerHTML = `<span class="pill kind ${noteKind(n)}">${KIND_LABEL[noteKind(n)]}</span>${teamTags(n)}${chipsFor(n, null)}${n.flag ? `<span class="flag-tag">Check the text</span>` : ""}`;
    s.querySelector("#ck-actions").innerHTML = `<button class="btn sm grow" data-a="edit">${icon("note")}Edit text</button><button class="btn sm grow quiet" data-a="more">More…</button>`;
    const a = s.querySelector("#ck-actions");
    a.querySelector('[data-a="edit"]').onclick = async () => { await editText(n); draw(); };
    a.querySelector('[data-a="more"]').onclick = async () => {
      const pick = await menu("This note", [
        { label: "Record again", value: "rerecord" }, { label: "Add another photo", value: "photo" },
        { label: noteKind(n) === "aisle" ? "Move to Display" : "Move to Aisle", value: "kind" }, { label: "Delete note", value: "delete", danger: true }]);
      if (pick === "rerecord") { close(); startRecording({ note: n }); }
      else if (pick === "photo") { await addPhoto(n); showPhoto(); }
      else if (pick === "kind") { n.kind = noteKind(n) === "aisle" ? "display" : "aisle"; save(); renderAll(); toast(`Moved to ${KIND_LABEL[n.kind]}`); draw(); }
      else if (pick === "delete") { close(); deleteNote(n); }
    };
    if (n.dev) {   // another phone's note: you can tick it and read it, but only they can change it
      a.innerHTML = `<button class="btn sm grow quiet" data-a="hide">Hide from my list</button>`;
      a.querySelector('[data-a="hide"]').onclick = () => { state.team.hidden[n.id] = Date.now(); state.notes = state.notes.filter(x => x.id !== n.id); save(); close(); renderAll(); toast("Hidden from this phone"); };
    }
  };
  s.querySelector('[data-a="close"]').onclick = close;
  showPhoto(); draw();
}
async function editText(n) {
  const t = await textPrompt("What was said", n.text || "");
  if (t == null) return;
  n.text = t; n.heard = null; n.parts = []; n.flag = false; n.ticks = {}; n.err = ""; n.status = t ? "heard" : "empty"; save(); renderAll(); await pump();
}
async function addPhoto(n) {
  if (n.photos.length >= 6) return toast("That's the most photos for one note");
  const blob = await cameraPhoto(); if (!blob) return;
  const id = newId("p"); await putPhoto(id, blob); n.photos.push(id); save(); renderAll();
}
function deleteNote(n) {
  const snap = snapshot();
  state.notes = state.notes.filter(x => x.id !== n.id); save(); renderAll(); scheduleSweep();
  toast("Note deleted", snap);

// Pinch to zoom, drag to pan, double-tap to toggle.
function zoomStage(img, stage) {
  let scale = 1, tx = 0, ty = 0, startDist = 0, startScale = 1, last = null, lastTap = 0;
  const pts = new Map();
  const apply = () => { img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; };
  const reset = () => { scale = 1; tx = ty = 0; apply(); };
  stage.addEventListener("pointerdown", e => {
    stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { const [a, b] = [...pts.values()]; startDist = Math.hypot(a.x - b.x, a.y - b.y) || 1; startScale = scale; }
    const now = Date.now(); if (pts.size === 1 && now - lastTap < 300) { scale > 1 ? reset() : ((scale = 2.5), apply()); } lastTap = now;
    last = { x: e.clientX, y: e.clientY };
  });
  stage.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { const [a, b] = [...pts.values()]; scale = Math.max(1, Math.min(6, startScale * Math.hypot(a.x - b.x, a.y - b.y) / startDist)); apply(); }
    else if (pts.size === 1 && scale > 1) { tx += e.clientX - last.x; ty += e.clientY - last.y; apply(); }
    last = { x: e.clientX, y: e.clientY };
  });
  const up = e => { pts.delete(e.pointerId); if (scale <= 1.02) reset(); last = null; };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
}
// ---------- Before / After photos ----------
// A photo-only twin of the Stocking tab: same camera, no voice. Five store slots sit across the top, so a shift's photos from up to
// five stores can be kept apart and reviewed until the end of the shift. The sixth button saves everything to the phone and clears it. Two switches (Before | After, Aisle | Display) decide where
// each shot is filed inside the open store. Photos stay on this phone.
const SLOTS = 5;
const baWhen = () => (state.settings.baWhen === "after" ? "after" : "before");
const baKind = () => (state.settings.baKind === "display" ? "display" : "aisle");
const baSlot = () => { const n = +state.settings.baSlot; return n >= 0 && n < SLOTS ? n : 0; };
const storeOf = i => String((state.stores || [])[i] || "").trim();
const slotCount = i => state.shots.filter(s => s.slot === i).length;
const WHEN_LABEL = { before: "Before", after: "After" };
let lastShotId = null;

// The store buttons: the store number (or + when the slot is empty) and how many photos it holds, then the Save and clear button.
function slotsHTML(active) {
  const act = `<button class="slot act" data-act="save" aria-label="Save every photo to this phone, then clear the stores and photos">${icon("download")}<small>Save</small></button>`;
  return Array.from({ length: SLOTS }, (_, i) => {
    const st = storeOf(i), n = slotCount(i);
    return `<button class="slot${i === active ? " active" : ""}" data-slot="${i}" aria-label="${st ? `Store ${esc(st)}` : `Empty store slot ${i + 1}`}${n ? `, ${n} photo${n === 1 ? "" : "s"}` : ""}"><b>${st ? esc(st) : "+"}</b><small>${n || ""}</small></button>`;
  }).join("") + act;
}

function renderBA() {
  const on = !!cam.stream, w = baWhen(), k = baKind(), slot = baSlot(), st = storeOf(slot);
  $("#ba-off").hidden = on || cam.starting;
  $("#ba-video").hidden = !on;
  $("#ba-starting").hidden = !cam.starting;
  $("#ba-error").textContent = cam.error;

  $("#ba-cam-stop").hidden = !on;

  $("#ba-slots").innerHTML = slotsHTML(slot);
  document.querySelectorAll("#ba-when-seg button").forEach(b => b.classList.toggle("active", b.dataset.w === w));
  document.querySelectorAll("#ba-kind-seg button").forEach(b => b.classList.toggle("active", b.dataset.k === k));
  if (view === "ba") { syncIndicator($("#ba-when-seg"), false); syncIndicator($("#ba-kind-seg"), false); }
  const sec = $("#view-ba");
  sec.classList.toggle("mode-display", k === "display"); sec.classList.toggle("mode-aisle", k === "aisle");
  $("#ba-band").textContent = `${st ? `#${st} · ` : ""}${WHEN_LABEL[w].toUpperCase()} · ${KIND_LABEL[k].toUpperCase()}`;
  $("#ba-hint").textContent = st ? `Photo only. Filing to store#${st} · ${WHEN_LABEL[w]} · ${KIND_LABEL[k]}.` : "Tap a store slot above to set its store number.";
  $("#ba-shutter").setAttribute("aria-label", `Take the ${w} photo of the ${k}`);
  const mine = state.shots.filter(s => s.slot === slot), last = mine.find(s => s.id === lastShotId) || mine[0], lb = $("#ba-last");
  lb.style.visibility = last ? "visible" : "hidden";
  if (last && lb.dataset.shot !== last.photo) { lb.dataset.shot = last.photo; lb.innerHTML = `<img data-photo="${esc(last.photo)}" alt="">`; hydratePhotos(lb); }
  const c = $("#ba-count"); c.hidden = !mine.length; c.textContent = mine.length;
  if (view === "ba" && cam.stream) { const v = $("#ba-video"); if (v.paused) v.play().catch(() => {}); }
}

// Asks which store a slot is (the saved number is filled in, so changing it is quick) and remembers the answer.
function askStore(slot) {
  return new Promise(resolve => {
    const d = el(`<div class="dialog"><p><b>Which store is this?</b></p>
      <input class="field" inputmode="numeric" autocomplete="off" placeholder="Store number, like 1234" aria-label="Store number">
      <div class="btns" style="margin-top:14px"><button class="btn" data-a="c">Cancel</button><button class="btn primary" data-a="ok">Continue</button></div></div>`);
    const inp = d.querySelector("input"); inp.value = storeOf(slot);
    const clean = v => String(v).trim().replace(/^store\s*#?\s*/i, "").replace(/^#\s*/, "");
    let done = false;
    const close = openLayer(d, { center: true, sticky: true, onClose: () => { if (!done) resolve(null); } });
    const go = () => {
      const v = clean(inp.value); if (!v) { inp.focus(); return; }
      done = true; state.stores[slot] = v; if (slot === baSlot()) state.storeName = v;
      save(); renderAll(); close(); resolve(v);
    };
    d.querySelector('[data-a="c"]').onclick = () => { done = true; close(); resolve(null); };
    d.querySelector('[data-a="ok"]').onclick = go;
    inp.onkeydown = e => { if (e.key === "Enter") go(); };
    setTimeout(() => { inp.focus(); inp.select(); }, 50);
  });
}
// Tapping a slot opens it (asking for the store number if it is empty); tapping the open slot again changes its number.
async function pickSlot(i) {

async function onShutterBA(forcePhone) {

// One batch = every Before photo in a store (Aisle and Display together), or every After photo. The phone's share sheet opens with
// the photos attached and a line of text already written; pick Messages and the boss's name. Before and After go as two texts.
async function shareBatch(slot, w) {
  const list = state.shots.filter(x => x.slot === slot && x.when === w).sort((a, b) => a.at - b.at);
  if (!list.length) return;
  const store = storeOf(slot) || await askStore(slot); if (store == null) return;
  const files = [];
  for (const [i, x] of list.entries()) {
    const blob = await getPhoto(x.photo).catch(() => null);
    if (blob) files.push(new File([blob], `${WHEN_LABEL[w]}-${i + 1}-${KIND_LABEL[x.kind]}.jpg`, { type: "image/jpeg" }));
  }
  if (!files.length) return toast("These photos are missing");
  const when = new Date(list[0].at).toLocaleDateString([], { month: "short", day: "numeric" });
  const text = `store#${store} - ${WHEN_LABEL[w]} - ${when}`;
  try {
    if (navigator.canShare && navigator.canShare({ files, text })) { await navigator.share({ files, text }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  toast("Sharing isn't available here. Open a photo and use Save to Photos.");
}
// Asks whether to save the photos first. Resolves "save", "clear" (just clear) or null (cancel).
function askSaveFirst(n) {
  return new Promise(resolve => {
    const d = el(`<div class="dialog"><p><b>Clear everything?</b></p>
      <p>This clears every store number and all ${n} Before/After photo${n === 1 ? "" : "s"} from the app. Do you want to save the photos to this phone first?</p>
      <div class="stack"><button class="btn primary block" data-a="save">${icon("download")}Yes, save them first</button>
      <button class="btn block" data-a="clear">No, just clear</button>
      <button class="btn block quiet" data-a="c">Cancel</button></div></div>`);
    let done = false;
    const close = openLayer(d, { center: true, sticky: true, onClose: () => { if (!done) resolve(null); } });
    for (const k of ["save", "clear", "c"]) d.querySelector(`[data-a="${k}"]`).onclick = () => { done = true; close(); resolve(k === "c" ? null : k); };
  });
}
// A note shown on screen while the share sheet is open, so nobody has to guess which button saves the photos.
function showSaveHint(n) {
  const h = el(`<div class="save-hint" role="status"><b>Next: tap “Save ${n === 1 ? "Image" : n + " Images"}”</b><span>In the list that opens, tap “Save ${n === 1 ? "Image" : n + " Images"}” (scroll down in the list if you don't see it). Your photos then go to the Photos app.</span></div>`);
  document.body.appendChild(h);

}
// End of shift: forget the store numbers and clear the photos, saving them to the phone first if asked. The share sheet gets the
// photos named like store1234_Before_Aisle_1_2026-10-01.jpg; nothing is cleared unless that has gone through.
const pad2 = n => String(n).padStart(2, "0");
function clearEverything() {
  const snap = snapshot();
  state.shots = []; state.stores = Array(SLOTS).fill(""); state.storeName = ""; state.settings.baSlot = 0; lastShotId = null;
  save(); renderAll(); scheduleSweep();
  toast("Cleared", snap);
  return true;
}
async function saveAndClear() {
  const n = state.shots.length;
  if (!n) {
    if (!state.stores.some(Boolean)) { toast("Nothing to clear"); return false; }
    return (await confirmDialog("Clear the store numbers?", { ok: "Clear", danger: true })) ? clearEverything() : false;
  }
  const choice = await askSaveFirst(n);
  if (!choice) return false;
  if (choice === "clear") return clearEverything();
  const list = [...state.shots].sort((a, b) => a.slot - b.slot || a.when.localeCompare(b.when) || a.kind.localeCompare(b.kind) || a.at - b.at), count = {}, files = [];
  for (const x of list) {
    const d = new Date(x.at), key = `${x.slot}|${x.when}|${x.kind}`; count[key] = (count[key] || 0) + 1;
    const blob = await getPhoto(x.photo).catch(() => null);
    if (blob) files.push(new File([blob], `store${(storeOf(x.slot) || "none").replace(/[^A-Za-z0-9-]/g, "")}_${WHEN_LABEL[x.when]}_${KIND_LABEL[x.kind]}_${count[key]}_${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.jpg`, { type: "image/jpeg" }));
  }
  if (files.length < list.length) { toast("Some photos are missing, so nothing was cleared"); return false; }
  const hideHint = showSaveHint(files.length);
  try {
    if (!(navigator.canShare && navigator.canShare({ files }))) throw new Error("no share");
    await navigator.share({ files });
  } catch (e) {
    hideHint();
    toast(e && e.name === "AbortError" ? "Not saved, so nothing was cleared" : "Saving isn't available here, so nothing was cleared");
    return false;
  }
  hideHint();
  return clearEverything();
}// slot = a store number to clear, or null for every store.
function clearShots(slot) {
  const msg = slot == null ? "Remove the Before/After photos of every store from this phone? Save or send the ones you need first."
    : `Remove the Before/After photos of ${storeOf(slot) ? `store#${esc(storeOf(slot))}` : "this store"} from this phone? Save or send them first.`;
  return confirmDialog(msg, { ok: "Remove", danger: true }).then(ok => {
    if (!ok) return false;
    const snap = snapshot();
    state.shots = slot == null ? [] : state.shots.filter(x => x.slot !== slot);
    lastShotId = null; save(); renderAll(); scheduleSweep();
    toast("Photos removed", snap);
    return true;
  });
}

    else if (pick === "delete") {

// ---------- Products: the brand + flavor combinations the list recognizes ----------
// Size and pack don't matter here: they stay in the words you read. Edits apply to every size of a combination
