<main>
  <!-- CAPTURE: a big viewfinder, with everything you tap sitting in the bottom third -->
  <section class="view active mode-aisle" id="view-capture">
    <div class="slots" id="cap-slots"></div>
    <div class="camera" id="camera">
      <video id="cam-video" playsinline muted autoplay hidden></video><canvas class="cam-canvas" aria-hidden="true"></canvas>
      <div class="cam-wait" id="cam-starting" hidden>Starting the camera…</div>
      <div class="cam-off" id="cam-off">
        <span data-icon="camera"></span>
        <button class="btn primary" id="btn-cam-start">Start camera</button>
        <p id="cam-error"></p>
        <button class="btn quiet" id="btn-phonecam" hidden><span data-icon="image"></span>Use phone camera instead</button>
      </div>
      <span class="cam-chip" id="cap-band">AISLE</span>
      <button class="disp-chip" id="cap-disp" hidden></button>
      <button class="cam-sound" aria-label="Shutter sound"></button>
      <div class="cam-lens" hidden><button data-lens="ultra" aria-label="Wide angle, 0.5 times">.5</button><button data-lens="wide" aria-label="Normal, 1 times">1×</button></div>
      <button class="cam-stop" id="btn-cam-stop" aria-label="Turn the camera off" hidden><span data-icon="x"></span></button>
      <div class="hold-live" id="hold-live" hidden><span class="rec-dot"></span><span id="hold-time">0:00</span><i class="hold-meter"><b id="hold-level"></b></i></div>
      <p class="queue-line" id="queue-line" hidden><span class="spin"></span><span id="queue-text"></span></p>
    </div>
    <div id="model-banner" hidden></div>
    <div class="deck">
      <div class="seg cap-seg" id="cap-seg">
        <button data-k="aisle" class="active">Aisle</button>
        <button data-k="display">Display</button>
        <button data-k="backstock">Backstock</button>
      </div>
      <div class="deck-row">
        <button class="deck-side left" id="last-note" aria-label="Add an item to the last shelf" style="visibility:hidden"></button>
        <div class="shutter-wrap"><button class="shutter-big" id="btn-shutter" aria-label="Take a photo, then say what you need"><span></span></button></div>
        <button class="deck-side right" id="btn-open-needed" aria-label="Open the Needed list"><span data-icon="list"></span><span class="badge" id="deck-badge" hidden></span></button>
      </div>
      <div class="hold-bar" id="hold-bar" hidden><span class="grow" id="hold-text"></span><button class="btn sm primary" id="hold-done">Done</button></div>
      <p class="cap-hint" id="shutter-label">Snap the aisle, then say what you need.</p>
    </div>
  </section>

  <!-- BEFORE/AFTER: the same viewfinder, photo only. Each shot is filed by the two switches. -->
  <section class="view mode-aisle" id="view-ba">
    <div class="slots" id="ba-slots"></div>
    <div class="camera" id="ba-camera">
      <video id="ba-video" playsinline muted autoplay hidden></video><canvas class="cam-canvas" aria-hidden="true"></canvas>
      <div class="cam-wait" id="ba-starting" hidden>Starting the camera…</div>
      <div class="cam-off" id="ba-off">
        <span data-icon="camera"></span>
        <button class="btn primary" id="ba-cam-start">Start camera</button>
        <p id="ba-error"></p>
        <button class="btn quiet" id="ba-phonecam" hidden><span data-icon="image"></span>Use phone camera instead</button>
      </div>
      <span class="cam-chip" id="ba-band">BEFORE · AISLE</span>
      <button class="disp-chip" id="ba-disp" hidden></button>
      <button class="cam-sound" aria-label="Shutter sound"></button>
      <div class="cam-lens" hidden><button data-lens="ultra" aria-label="Wide angle, 0.5 times">.5</button><button data-lens="wide" aria-label="Normal, 1 times">1×</button></div>
      <button class="cam-stop" id="ba-cam-stop" aria-label="Turn the camera off" hidden><span data-icon="x"></span></button>
    </div>
    <div class="deck">
      <div class="seg cap-seg" id="ba-kind-seg">
        <button data-k="aisle" class="active">Aisle</button>
        <button data-k="display">Display</button>
        <button data-k="backstock">Backstock</button>
      </div>
      <div class="deck-row">
        <button class="deck-side left" id="ba-last" aria-label="Open the last photo" style="visibility:hidden"></button>
        <div class="shutter-wrap"><button class="shutter-big" id="ba-shutter" aria-label="Take a photo"><span></span></button></div>
        <button class="deck-side right" id="ba-gallery" aria-label="Open the gallery"><span data-icon="image"></span><span class="badge" id="ba-count" hidden></span></button>
      </div>
      <p class="cap-hint" id="ba-hint"></p>
    </div>
  </section>

  <section class="view" id="view-needed"></section>
  <section class="view" id="view-gallery"></section>
  <section class="view" id="view-products"></section>
  <section class="view" id="view-changelog"></section>
  <section class="view" id="view-more"></section>
</main>

// Stored in IndexedDB (localStorage is only ~5 MB). They stay on this phone and are deleted when their note goes.
const mediaDB = (() => {
  let p = null;
  return () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open("shelfscan-b4", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("photos"); r.result.createObjectStore("audio"); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => { p = null; rej(r.error); };
  }));
})();
async function mediaTx(store, mode, fn) {

    const tx = db.transaction(store, mode), req = fn(tx.objectStore(store));

}
const photoURLs = new Map();
const putPhoto = (id, blob) => mediaTx("photos", "readwrite", s => s.put(blob, id));

const thumbId = id => id + "~t";
const delPhoto = async id => {

};

  await putPhoto(id, blob);

}

  const bmp = await createImageBitmap(blob), k = Math.min(1, 360 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();

}

const putAudio = (id, rec) => mediaTx("audio", "readwrite", s => s.put(rec, id));

async function photoURL(id) {
  if (photoURLs.has(id)) return photoURLs.get(id);

}
// Fill <img data-photo="id"> placeholders after a render, with the thumbnail when there is one (photos from before 2.0 have none).
function hydratePhotos(root) {
  root.querySelectorAll("img[data-photo]").forEach(async img => {
    img.draggable = false;   // no iPhone drag-and-drop of photos (a long hold selects in the Gallery)
    const id = img.dataset.photo;
    let u = await photoURL(thumbId(id));
    if (!u) { u = await photoURL(id); if (u) backfillThumb(id); }   // no thumbnail yet: show the photo, and make one for next time
    if (u) { img.addEventListener("load", () => img.classList.add("in"), { once: true }); img.src = u; if (img.complete && img.naturalWidth) img.classList.add("in"); }

// Missing thumbnails are made one at a time, in the background (each means decoding a full photo).
const thumbQueue = new Set(); let thumbBusy = false;
function backfillThumb(id) {

  thumbQueue.add(id); if (thumbBusy) return;

    const rec = await getAudio("_recovery").catch(() => null); if (rec && rec.photos) rec.photos.forEach(p => keepP.add(p));
    const ps = await mediaTx("photos", "readonly", s => s.getAllKeys()), as = await mediaTx("audio", "readonly", s => s.getAllKeys());
    for (const k of ps) { const base = String(k).endsWith("~t") ? String(k).slice(0, -2) : k; if (!keepP.has(base)) await delPhoto(k); }

// Resize an image or video frame to at most PHOTO_MAX px on the long side and encode it as JPEG. 4096 px keeps a whole shelf sharp when

const PHOTO_MAX = 4096;

  c.getContext("2d").drawImage(source, sx, sy, cw, ch, 0, 0, c.width, c.height);

}

}

const shutter = { ctx: null, buf: null, loading: null, idle: null };
const shutterOn = () => state.settings.beep !== false;
// The audio engine for the click exists only for a few seconds around a photo, and never while the app is hidden: an engine left open
// made the phone chime when the app was closed.
function shutterCtx() { if (!shutter.ctx || shutter.ctx.state === "closed") shutter.ctx = new (window.AudioContext || window.webkitAudioContext)(); return shutter.ctx; }
function shutterIdle() { clearTimeout(shutter.idle); shutter.idle = setTimeout(closeShutterAudio, 4000); }
function closeShutterAudio() {
  clearTimeout(shutter.idle);
  if (shutter.ctx) { try { shutter.ctx.close().catch(() => {}); } catch (e) {} }
  shutter.ctx = null; shutter.buf = null; shutter.loading = null;   // decoded again next time (a few milliseconds)
}
document.addEventListener("visibilitychange", () => { if (document.hidden) closeShutterAudio(); });
// Called first thing in a tap, before any waiting, so the phone allows the sound.
function primeShutter() {
  if (!shutterOn()) return;
  try { const c = shutterCtx(); if (c.state === "suspended") c.resume(); shutterLoad(); shutterIdle(); } catch (e) {}
}
async function shutterLoad() {
  if (shutter.buf) return shutter.buf;
  if (shutter.loading) return shutter.loading;
  const ctx = shutterCtx();
  return (shutter.loading = (async () => {
    const bin = atob(SHUTTER_MP3), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const buf = await new Promise((res, rej) => ctx.decodeAudioData(u.buffer, res, rej));
    if (shutter.ctx === ctx) shutter.buf = buf;
    return buf;

  if (!shutterOn()) return;
  try {
    const ctx = shutterCtx(), buf = await shutterLoad(); if (!buf || shutter.ctx !== ctx) return;
    if (ctx.state === "suspended") await ctx.resume();
    const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination); src.start();

// ---------- Backup (on this phone) ----------
// A backup is one small file: the product list, the settings and the store numbers. "Save a backup" hands it to the phone's share sheet
// (Save to Files, AirDrop, Mail...), and "Restore from a backup" reads such a file back. Nothing goes to any server.
// The file format is the same as the GitHub backups of 1.0 to 1.2, so those files can be restored too.
const BK_SETTINGS = ["beep", "needKind", "captureKind", "baWhen", "baKind", "baSlot", "lens", "wordTiming", "hapticShutter", "hapticTaps", "liveListen", "hideDone"];   // (pad2 is in beforeafter.js)

function bkSnapshot() {
  const settings = {}; for (const k of BK_SETTINGS) settings[k] = state.settings[k];
  return { v: 1, app: "Shelfie", at: Date.now(), settings, stores: state.stores, storeName: state.storeName || "",
    products: state.products.map(shareable), deleted: { products: state.deleted.products },
    recentStores: state.recentStores || [], pickUse: state.pickUse || {}, storeSpots: state.storeSpots || {}, learned: state.learned || {} };
}

async function saveBackup() {
  const d = new Date(), name = `shelfie-backup-${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.json`;
  const file = new File([JSON.stringify(bkSnapshot())], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  // No share sheet (a computer browser): download it instead.
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("Backup saved");
}

// Pick a backup file and put it back. The file is checked before anything changes; notes and photos stay as they are.
function pickBackupFile() {
  const inp = el(`<input type="file" accept=".json,application/json" hidden>`);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    let data = null; try { data = JSON.parse(await f.text()); } catch (e) {}
    await restoreBackup(data);
  };
  document.body.appendChild(inp); inp.click();
}
async function restoreBackup(data) {
  const okProd = p => p && typeof p.id === "string" && typeof p.brand === "string" && typeof (p.flavor ?? "") === "string" && p.id.length < 200 && p.brand.length < 120;
  if (!data || !Array.isArray(data.products) || data.products.length > 5000 || !data.products.every(okProd)) return toast("That isn't a usable Shelfie backup");
  const hasShots = state.shots.length > 0, when = data.at ? new Date(data.at).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }) : "";
  if (!(await confirmDialog(`Restore the backup${when ? ` from <b>${esc(when)}</b>` : ""}? This replaces this phone's product list and settings${hasShots ? "" : " and store numbers"}. Your notes and photos stay.`, { ok: "Restore", danger: true }))) return;
  const snap = snapshot(), next = JSON.parse(snap);
  next.products = data.products.map(p => ({ ...p }));
  next.deleted = { products: (data.deleted && data.deleted.products) || {} };
  for (const k of BK_SETTINGS) { const x = data.settings && data.settings[k]; if (x !== undefined && typeof x === typeof next.settings[k]) next.settings[k] = x; }   // same kind of value only
  if (!hasShots && Array.isArray(data.stores)) { next.stores = data.stores.slice(0, 5).map(x => String(x || "").slice(0, 20)); next.storeName = String(data.storeName || "").slice(0, 20); }   // photos are filed by slot, so store numbers only change when there are none
  if (Array.isArray(data.recentStores)) next.recentStores = data.recentStores.map(x => String(x || "").slice(0, 20)).filter(Boolean).slice(0, 8);
  if (data.pickUse && typeof data.pickUse === "object") {   // counts only: { b: {key: n}, l: {...}, f: {...} }
    const clean = o => Object.fromEntries(Object.entries(o && typeof o === "object" ? o : {}).filter(([k, v]) => k.length < 200 && Number.isFinite(v) && v >= 0).slice(0, 3000).map(([k, v]) => [k, Math.min(v, 100000)]));
    next.pickUse = { b: clean(data.pickUse.b), l: clean(data.pickUse.l), f: clean(data.pickUse.f) };
  }
  if (data.storeSpots && typeof data.storeSpots === "object") next.storeSpots = Object.fromEntries(Object.entries(data.storeSpots)
    .filter(([k, v]) => k.length <= 20 && v && Number.isFinite(v.lat) && Number.isFinite(v.lon) && Math.abs(v.lat) <= 90 && Math.abs(v.lon) <= 180).slice(0, 200)
    .map(([k, v]) => [k, { lat: v.lat, lon: v.lon, n: Math.max(1, Math.min(10, v.n | 0)) }]));

    .filter(([k, v]) => k.length <= 80 && v && typeof v.name === "string" && v.name.length <= 80).slice(0, 400).map(([k, v]) => [k, { name: v.name, at: +v.at || Date.now() }]));

}

// Most common first until the picks say otherwise; each pick moves that brand, variation and flavor up a few places for next time.
const PICK_ORDER = ["Coca-Cola", "Sprite", "Dr Pepper", "Fanta", "Powerade", "Dasani", "smartwater", "BODYARMOR", "Minute Maid",
  "Monster Energy", "vitaminwater", "Simply", "Gold Peak", "Topo Chico", "Fresca", "Barq's", "Seagram's", "Mello Yello",
  "Core Power", "Hi-C", "Reign", "NOS", "Peace Tea", "FUZE", "AHA", "Simply Pop", "Honest Kids",
  "Hubert's", "Mr. Pibb", "Full Throttle", "Moxie", "Tum-e Yummies"];

const PICK_FAMILY = { "Diet Coke": ["Coca-Cola", "Diet"], "Diet Dr Pepper": ["Dr Pepper", "Diet"], "BODYARMOR LYTE": ["BODYARMOR", "Lyte"],
  "Core Power Elite": ["Core Power", "Elite"], "Topo Chico Sabores": ["Topo Chico", "Sabores"] };
// Product lines that start the flavor name
const PICK_LINES = { "Monster Energy": ["Ultra", "Java", "Juice", "Rehab", "Reserve", "Nitro"], "Powerade": ["Power Water", "Xtra Sour"],
  "BODYARMOR": ["Flash IV", "Fit", "SportWater"], "Sprite": ["Chill", "+ Tea"], "NOS": ["Active"] };

const VAR_ORDER = ["Regular", "Diet", "Zero Sugar", "Lyte", "Caffeine-Free", "Diet Caffeine-Free", "Caffeine-Free Zero Sugar", "Light"];

const PICK_FIX = { "Monster Energy|Zero Ultra": ["Ultra", "Zero Ultra (White)"] };

  if (fix) return { fam: (PICK_FAMILY[v.brand] || [v.brand])[0], line: fix[0], flavor: fix[1] };

  if (!src) return;
  const v = el(`<div class="photo-full" role="dialog" aria-label="Photo"><div class="zoom-stage"><img alt=""></div><button class="pf-close" aria-label="Close">${icon("x")}</button></div>`);
  v.querySelector("img").src = src;
  document.body.appendChild(v); haptic();
  let gone = false;
  const close = () => { if (gone) return; gone = true; v.classList.add("closing"); setTimeout(() => v.remove(), 220); };
  zoomStage(v.querySelector("img"), v.querySelector(".zoom-stage"), {
    full: true, onSwipeDown: close,
    onTap: () => v.classList.toggle("chrome-off"),
    onPull: p => { v.style.backgroundColor = p ? `rgba(0, 0, 0, ${Math.max(0.35, 1 - p / 400)})` : ""; },
  });
  v.querySelector(".pf-close").onclick = close;
}
// ---------- Before and After ----------
// Since 2.1 the shelf photos taken on the Before tab (the Needed-list notes) are the Before pictures, and the After tab takes the After
// pictures (photo only, no voice). Five store slots, shared by both tabs, sit across the top so a shift's photos from up to five stores stay
// apart until the end of the shift; the sixth button saves everything to the phone and clears it. Photos stay on this phone.
// Notes carry the slot they were taken in (n.slot); After photos are state.shots ({ id, at, slot, when: "after", kind, photo }).
// Shots with when "before" are Before photos from 2.0 and earlier (when the second tab took both).
const SLOTS = 5;
const baKind = () => normKind(state.settings.baKind);
const baSlot = () => { const n = +state.settings.baSlot; return n >= 0 && n < SLOTS ? n : 0; };
const storeOf = i => String((state.stores || [])[i] || "").trim();
const WHEN_LABEL = { before: "Before", after: "After" };
let lastShotId = null;
// A shelf photo where nothing was said: kept as a photo-only Before picture (it shows in the Gallery, not on the Needed list).
function keepPhotoOnly(photo, slot, kind, at, msg, dg) {
  state.shots.unshift({ id: newId("s"), at: at || Date.now(), slot: Number.isInteger(slot) ? slot : baSlot(), when: "before", kind: normKind(kind), photo, ...(dg ? { dg } : {}) });
  save(); renderAll();
  toast(msg || "Nothing was heard. The photo is in the Gallery.");
}

// A store's Before pictures: each shelf photo once (several notes can share one), plus old Before shots. After: the After shots.
function beforeItems(slot) {
  const seen = new Map();
  for (const n of [...state.notes].sort((a, b) => a.at - b.at)) {
    const p = (n.photos || [])[0];
    if (!p || n.slot !== slot || seen.has(p)) continue;
    seen.set(p, { photo: p, at: n.at, kind: noteKind(n), when: "before", note: n, slot });
  }
  const old = state.shots.filter(x => x.slot === slot && x.when === "before").map(x => ({ photo: x.photo, at: x.at, kind: x.kind, when: "before", shot: x, slot }));
  return [...seen.values(), ...old].sort((a, b) => a.at - b.at);
}
const afterItems = slot => state.shots.filter(x => x.slot === slot && x.when !== "before").map(x => ({ photo: x.photo, at: x.at, kind: x.kind, when: "after", shot: x, slot })).sort((a, b) => a.at - b.at);
const itemsOf = (slot, w) => (w === "before" ? beforeItems(slot) : afterItems(slot));
const slotCount = i => beforeItems(i).length + afterItems(i).length;

// The store buttons: the store number (or + when the slot is empty) and how many photos it holds, then the Save and clear button.
function slotsHTML(active) {
  const act = `<button class="slot act" data-act="save" aria-label="Clear the stores, photos and Needed list (you can save the photos first)">${icon("x")}<small>Clear</small></button>`;
  return Array.from({ length: SLOTS }, (_, i) => {
    const st = storeOf(i), n = slotCount(i);
    return `<button class="slot${i === active ? " active" : ""}" data-slot="${i}" aria-label="${st ? `Store ${esc(st)}` : `Empty store slot ${i + 1}`}${n ? `, ${n} photo${n === 1 ? "" : "s"}` : ""}"><b>${st ? esc(st) : "+"}</b><small>${n || ""}</small></button>`;
  }).join("") + act;
}

// Draws the After tab, and the parts of the Before tab that belong to the stores (its slot row and the store on its camera label).
function renderBA() {
  const on = !!cam.stream, k = baKind(), slot = baSlot(), st = storeOf(slot), row = slotsHTML(slot);
  $("#ba-slots").innerHTML = row;
  const cs = document.getElementById("cap-slots"); if (cs) cs.innerHTML = row;
  setTextPop($("#cap-band"), `${st ? `#${st} · ` : ""}${KIND_LABEL[captureKind()].toUpperCase()}`);
  $("#ba-off").hidden = on || cam.starting;
  $("#ba-video").hidden = !on;
  $("#ba-starting").hidden = !cam.starting;
  $("#ba-error").textContent = cam.error;
  renderSoundBtn();
  renderLens();
  $("#ba-phonecam").hidden = !cam.error;
  $("#ba-cam-stop").hidden = !on;
  $("#ba-shutter").disabled = cam.starting;
  document.querySelectorAll("#ba-kind-seg button").forEach(b => b.classList.toggle("active", b.dataset.k === k));
  if (view === "ba") syncIndicator($("#ba-kind-seg"), false);
  const sec = $("#view-ba");
  setModeClass(sec, k);
  setTextPop($("#ba-band"), `${st ? `#${st} · ` : ""}AFTER · ${KIND_LABEL[k].toUpperCase()}`);
  $("#ba-hint").textContent = st ? `Snap the finished ${k}. Files under store#${st} · After · ${KIND_LABEL[k]}.` : "Tap a store slot above to set its store number.";
  $("#ba-shutter").setAttribute("aria-label", `Take the after photo of the ${k}`);
  const mine = afterItems(slot).map(i => i.shot).reverse(), last = mine.find(s => s.id === lastShotId) || mine[0], lb = $("#ba-last");
  lb.style.visibility = last ? "visible" : "hidden";
  if (last && lb.dataset.shot !== last.photo) { lb.dataset.shot = last.photo; lb.innerHTML = `<img data-photo="${esc(last.photo)}" alt="">`; hydratePhotos(lb); }
  const n = slotCount(slot), c = $("#ba-count"); c.hidden = !n; c.textContent = n;
  renderDisplayChips();
}

// Asks which store a slot is (the saved number is filled in, so changing it is quick) and remembers the answer.
function askStore(slot) {
  return new Promise(resolve => {
    const d = el(`<div class="dialog"><p><b>Which store is this?</b></p>
      <input class="field" inputmode="numeric" autocomplete="off" placeholder="Store number, like 1234" aria-label="Store number">
      ${(state.recentStores || []).length ? `<p class="recent-h">Recent stores</p><div class="recent-stores">${state.recentStores.map(s => `<button class="recent-store" data-st="${esc(s)}">#${esc(s)}</button>`).join("")}</div>` : ""}
      <div class="btns" style="margin-top:14px"><button class="btn" data-a="c">Cancel</button><button class="btn primary" data-a="ok">Continue</button></div></div>`);
    const inp = d.querySelector("input"); inp.value = storeOf(slot);
    const clean = v => String(v).trim().replace(/^store\s*#?\s*/i, "").replace(/^#\s*/, "");
    let done = false;
    const btns = () => document.querySelectorAll(`#cap-slots [data-slot="${slot}"], #ba-slots [data-slot="${slot}"], #gal-slots [data-slot="${slot}"]`);
    // what's typed shows at the top straight away (the store button and the header), and goes back if cancelled
    inp.oninput = () => {
      const v = clean(inp.value);
      btns().forEach(b => { const t = b.querySelector("b"); if (t) t.textContent = v || "+"; });
      if (slot === baSlot()) $("#hdr-store").textContent = v ? "Store " + v : "";
    };
    const close = openLayer(d, { center: true, sticky: true, onClose: () => { if (!done) { renderAll(); resolve(null); } } });
    const go = () => {
      const v = clean(inp.value); if (!v) { inp.focus(); return; }
      done = true; state.stores[slot] = v; if (slot === baSlot()) state.storeName = v;
      state.recentStores = [v, ...(state.recentStores || []).filter(x => x !== v)].slice(0, 8);
      if (state.settings.geo === undefined) setTimeout(() => askGeoOnce(v), 450); else learnSpot(v);   // 2.12: remember where this store is
      save(); renderAll(); close(); resolve(v);
      btns().forEach(b => pulse(b));
    };
    d.querySelector('[data-a="c"]').onclick = () => { done = true; close(); renderAll(); resolve(null); };
    d.querySelector('[data-a="ok"]').onclick = go;
    inp.onkeydown = e => { if (e.key === "Enter") go(); };
    d.querySelectorAll(".recent-store").forEach(b => (b.onclick = () => { inp.value = b.dataset.st; inp.oninput(); go(); }));
    if (!(state.recentStores || []).length) setTimeout(() => { inp.focus(); inp.select(); }, 50);   // with recent stores to tap, no keyboard until asked
  });
}
// Tapping a slot opens it (asking for the store number if it is empty); tapping the open slot again changes its number. Both tabs share it.
async function pickSlot(i) {
  if (i === baSlot() && storeOf(i)) { await askStore(i); return; }
  if (hold.session) endHoldSession();   // a held shelf belongs to the store it was started in
  if (displayTarget && displayTarget.slot !== i) displayTarget = null;   // "+ Photo" was for the other store
  state.settings.baSlot = i; lastShotId = null;
  if (storeOf(i)) state.storeName = storeOf(i);
  save(); renderAll(); document.querySelectorAll(`#ba-slots [data-slot="${i}"], #cap-slots [data-slot="${i}"]`).forEach(b => pulse(b));
  if (!storeOf(i)) await askStore(i);
}

async function onShutterBA(forcePhone) {
  const slot = baSlot();
  if (!storeOf(slot)) { await askStore(slot); return; }   // the first tap only asks for the store number; the next tap takes the photo
  primeShutter(); haptic("shutter"); pulse($("#ba-shutter"), "fire", 600);
  let blob = null;
  if (cam.stream && !forcePhone) { blob = await grabSharp("#ba-video", "#ba-camera"); box_flash("#ba-camera"); if (blob) flyToThumb(blob, $("#ba-camera"), $("#ba-last")); }
  else blob = await cameraPhoto();
  if (!blob) { if (cam.stream && !forcePhone) toast("The camera isn't ready yet. Try again."); return; }
  playShutter();
  const shot = { id: newId("s"), at: Date.now(), slot, when: "after", kind: baKind(), photo: newId("p") };
  const dg = takeDisplayDg(slot, "after", shot.kind); if (dg) shot.dg = dg;
  try { await savePhoto(shot.photo, blob); } catch (e) { return toast("Couldn't save the photo. Phone storage may be full."); }
  state.shots.unshift(shot); lastShotId = shot.id; save(); renderAll(); pulse($("#ba-last")); checkPhotoQuality(shot.photo);
  toast(`Saved to store#${storeOf(slot)} · After · ${KIND_LABEL[shot.kind]}`);
}

// Before tab, Backstock: one tap, one photo, filed as a Before picture of the store (no voice note).
async function snapBackstock(forcePhone) {
  if (hold.session) endHoldSession();
  const slot = baSlot();
  primeShutter(); haptic("shutter"); pulse($("#btn-shutter"), "fire", 600);
  let blob = null;
  if (cam.stream && !forcePhone) { blob = await grabSharp(); box_flash(); if (blob) flyToThumb(blob, $("#camera"), $("#btn-open-needed")); }
  else blob = await cameraPhoto();
  if (!blob) { if (cam.stream && !forcePhone) toast("The camera isn't ready yet. Try again."); return; }
  playShutter();
  const shot = { id: newId("s"), at: Date.now(), slot, when: "before", kind: "backstock", photo: newId("p") };
  try { await savePhoto(shot.photo, blob); } catch (e) { return toast("Couldn't save the photo. Phone storage may be full."); }
  state.shots.unshift(shot); save(); renderAll();
  toast(`Saved to store#${storeOf(slot)} · Before · Backstock`);
  checkPhotoQuality(shot.photo);
}

function wireBA() {
  $("#ba-cam-start").onclick = startCamera;
  $("#ba-cam-stop").onclick = () => { state.settings.camOK = false; save(); stopCamera(); };
  $("#ba-shutter").onclick = () => onShutterBA(false);
  $("#ba-phonecam").onclick = () => onShutterBA(true);
  const slotTap = e => { if (e.target.closest("[data-act]")) return saveAndClear(); const b = e.target.closest("[data-slot]"); if (b) pickSlot(+b.dataset.slot); };
  $("#ba-slots").onclick = slotTap;
  const cs = document.getElementById("cap-slots"); if (cs) cs.onclick = slotTap;
  document.querySelectorAll("#ba-kind-seg button").forEach(b => (b.onclick = () => { state.settings.baKind = b.dataset.k; save(); renderBA(); }));
  $("#ba-gallery").onclick = () => openGallery();
  for (const [id, when] of [["#cap-disp", "before"], ["#ba-disp", "after"]]) $(id).onclick = () => {
    if (displayTarget && displayTarget.when === when) { displayTarget = null; renderDisplayChips(); toast("OK, the next photo starts a display as usual"); return; }
    openDisplays(when);
  };
  $("#ba-last").onclick = () => { const s = state.shots.find(x => x.id === lastShotId && x.slot === baSlot()) || afterItems(baSlot()).map(i => i.shot).pop(); if (s) openShot(s); };
}

// ---- The Gallery tab: one store at a time, Aisle / Display, then Before (the shelf photos) and After ----
// It opens on the store and Aisle/Display that are open on the camera tabs; picking another store here only changes what the Gallery shows.
const gal = { slot: null, kind: null };
function openGallery() { showView("gallery"); }
function renderGallery() {
  const v = $("#view-gallery");
  if (gal.slot == null) gal.slot = baSlot();
  if (!gal.kind) gal.kind = baKind();
  if (gsel.on && gsel.slot !== gal.slot) galSelectEnd(true);   // a selection belongs to one store
  const slot = gal.slot, kind = gal.kind, all = [...beforeItems(slot), ...afterItems(slot)], after = afterItems(slot);
  let html = `<div class="list-head"><h2>Gallery</h2><span class="muted small">${storeOf(slot) ? `store#${esc(storeOf(slot))}` : ""}</span></div>
    <div class="slots" id="gal-slots">${slotsHTML(slot)}</div>
    <div class="row" id="gal-share">${["before", "after"].map(w => { const n = itemsOf(slot, w).length, u = untexted(slot, w); return `<button class="btn sm primary grow" data-share="${w}"${n ? "" : " disabled"}>${icon("upload")}Text all ${WHEN_LABEL[w]} (${n})${n ? (u ? `<i class="tx-dot" aria-label="not sent yet"></i>` : `<i class="tx-ok" aria-label="sent">${icon("check")}</i>`) : ""}</button>`; }).join("")}</div>
    <div class="seg" id="gal-seg">${KINDS.map(k => { const n = all.filter(x => x.kind === k).length; return `<button data-k="${k}" class="${k === kind ? "active" : ""}">${KIND_LABEL[k]} ${n ? `<span class="kcount">${n}</span>` : ""}</button>`; }).join("")}</div>`;
  for (const w of ["before", "after"]) {
    const list = itemsOf(slot, w).filter(x => x.kind === kind).reverse();
    html += `<div class="cluster-h">${WHEN_LABEL[w]}<span class="n">${list.length}</span></div>`;
    const tile = x => `<button class="shot${gsel.keys.has(w + "|" + x.photo) ? " sel" : ""}" data-w="${w}" data-p="${esc(x.photo)}" data-photo-wrap><img data-photo="${esc(x.photo)}" alt=""><span>${esc(timeOf(x.at))}</span><i class="sel-mark">${icon("check")}</i></button>`;
    html += list.length && kind === "display"   // displays: one group each, numbered like the list on the camera
      ? displayGroups(slot, w).map((g, i) => `<div class="disp-h">Display ${i + 1}<span>${g.items.length} photo${g.items.length === 1 ? "" : "s"}</span></div><div class="shot-grid">${g.items.map(tile).join("")}</div>`).join("")
      : list.length ? `<div class="shot-grid">${list.map(tile).join("")}</div>`
      : `<p class="muted small" style="margin:4px 0 0">${w === "before" ? `No shelf photos of ${KIND_PLURAL[kind]} for this store yet. Take them on the Before tab.` : `No After photos of ${KIND_PLURAL[kind]} yet. Take them on the After tab.`}</p>`;
  }
  const afterAll = state.shots.filter(x => x.when !== "before");
  if (after.length) html += `<button class="btn block quiet" data-a="clear" style="margin-top:20px">Clear ${storeOf(slot) ? `store#${esc(storeOf(slot))}` : "this store"}'s After photos</button>`;
  if (afterAll.length > after.length) html += `<button class="btn block quiet" data-a="clearall" style="margin-top:8px">Clear all stores' After photos</button>`;
  v.innerHTML = html;
  syncIndicator(v.querySelector("#gal-seg"), false);
  hydratePhotos(v);
  wireGalPress(v);
  renderGalBar();
  v.onclick = e => {
    if (galPress.fired) { galPress.fired = false; return; }   // the click that ends a long press
    if (gsel.on) { const t = e.target.closest(".shot"); if (t) { galToggle(t.dataset.w + "|" + t.dataset.p); return; } }
    if (e.target.closest("#gal-slots [data-act]")) { saveAndClear(); return; }
    const sb = e.target.closest("#gal-slots [data-slot]"); if (sb) { gal.slot = +sb.dataset.slot; renderGallery(); return; }
    const kb = e.target.closest("#gal-seg [data-k]"); if (kb) { gal.kind = kb.dataset.k; renderGallery(); return; }
    const sh = e.target.closest("[data-share]"); if (sh) { if (!sh.disabled) shareBatch(slot, sh.dataset.share); return; }
    const t = e.target.closest(".shot");
    if (t) {
      const x = itemsOf(slot, t.dataset.w).find(i => i.photo === t.dataset.p); if (!x) return;
      if (x.note) openCheck(x.note); else openShot(x.shot);   // a shelf photo opens its note (photo, words, playback)
      return;
    }
    if (e.target.closest('[data-a="clear"]')) clearShots(slot);
    if (e.target.closest('[data-a="clearall"]')) clearShots(null);
  };
}

// One batch = every Before photo of a store (Aisle and Display together), or every After photo. The phone's share sheet opens with
// the photos attached and a line of text already written; pick Messages and the boss's name. Before and After go as two texts.
async function shareBatch(slot, w) {
  const list = itemsOf(slot, w);
  if (!list.length) return;
  const store = storeOf(slot) || await askStore(slot); if (store == null) return;
  const files = [], dnum = displayNumbers();
  for (const [i, x] of list.entries()) {
    const blob = await getPhoto(x.photo).catch(() => null);
    if (blob) files.push(new File([blob], `${WHEN_LABEL[w]}-${i + 1}-${(dn => (x.kind === "display" && dn ? `Display${dn[0]}` : KIND_LABEL[x.kind]))(dnum.get(w + "|" + x.photo))}.jpg`, { type: "image/jpeg" }));
  }
  if (!files.length) return toast("These photos are missing");
  const when = new Date(list[0].at).toLocaleDateString([], { month: "short", day: "numeric" });
  const text = `store#${store} - ${WHEN_LABEL[w]} - ${when}`;
  try {
    if (navigator.canShare && navigator.canShare({ files, text })) { await navigator.share({ files, text }); markTexted(slot, w); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  toast("Sharing isn't available here. Open a photo and use Save to Photos.");
}
// Asks whether to save the photos first. Resolves "save", "clear" (just clear) or null (cancel).
function askSaveFirst(n) {
  return new Promise(resolve => {
    const d = el(`<div class="dialog"><p><b>Clear everything?</b></p>
      <p>This clears every store number, all After photos and the whole Needed list (its notes and shelf photos). Do you want to save the ${n} Before and After photo${n === 1 ? "" : "s"} to this phone first?</p>
      <div class="stack"><button class="btn primary block" data-a="save">${icon("download")}Yes, save them first</button>
      <button class="btn block" data-a="clear">No, just clear</button>
      <button class="btn block quiet" data-a="c">Cancel</button></div></div>`);
    let done = false;
    const close = openLayer(d, { center: true, sticky: true, onClose: () => { if (!done) resolve(null); } });
    for (const k of ["save", "clear", "c"]) d.querySelector(`[data-a="${k}"]`).onclick = () => { done = true; close(); resolve(k === "c" ? null : k); };
  });
}
// A note shown on screen while the share sheet is open, so nobody has to guess which button saves the photos.
function showSaveHint(n) {
  const h = el(`<div class="save-hint" role="status"><b>Next: tap “Save ${n === 1 ? "Image" : n + " Images"}”</b><span>In the list that opens, tap “Save ${n === 1 ? "Image" : n + " Images"}” (scroll down in the list if you don't see it). Your photos then go to the Photos app.</span></div>`);
  document.body.appendChild(h);
  return () => h.remove();
}
// End of shift: the store numbers, the After photos and the whole Needed list are cleared, after saving every Before and After photo to the
// phone if asked. Files are named like store1234_Before_Aisle_1_2026-10-03.jpg; nothing is cleared unless the save went through.
const pad2 = n => String(n).padStart(2, "0");
function allPhotoItems() {
  const seen = new Set(), out = [];
  for (const n of [...state.notes].sort((a, b) => a.at - b.at)) {
    const p = (n.photos || [])[0]; if (!p || seen.has(p)) continue;
    seen.add(p); out.push({ photo: p, at: n.at, kind: noteKind(n), when: "before", slot: n.slot });
  }
  for (const x of state.shots) out.push({ photo: x.photo, at: x.at, kind: x.kind, when: x.when === "before" ? "before" : "after", slot: x.slot });
  return out.sort((a, b) => (a.slot ?? 9) - (b.slot ?? 9) || a.when.localeCompare(b.when) || a.kind.localeCompare(b.kind) || a.at - b.at);
}
// Display photos: "before|photo" → [display number, photo number within it], for file names
function displayNumbers() {
  const m = new Map();
  for (let sl = 0; sl < SLOTS; sl++) for (const w of ["before", "after"]) displayGroups(sl, w).forEach((g, i) => g.items.forEach((it, j) => m.set(w + "|" + it.photo, [i + 1, j + 1])));
  return m;
}
function clearEverything() {
  const snap = snapshot();
  state.shots = []; state.notes = []; lastNoteId = null; lastShotId = null; displayTarget = null; state.texted = {};
  state.stores = Array(SLOTS).fill(""); state.storeName = ""; state.settings.baSlot = 0;
  save(); renderAll(); scheduleSweep();
  toast("Cleared", snap); haptic("ok");
  return true;
}
async function saveAndClear() {
  if (tutorialActive) { toast("That's for real work. Not during practice."); return false; }
  if (hold.session) endHoldSession();
  const list = allPhotoItems(), n = list.length;
  if (!n) {
    if (!state.stores.some(Boolean) && !state.notes.length) { toast("Nothing to clear"); return false; }
    if (!(await confirmDialog("Clear the store numbers and the Needed list?", { ok: "Clear", danger: true }))) return false;
    await rememberDisplays(); return clearEverything();
  }
  // anything not texted yet? (Text all marks what it sent)
  const unsent = [];
  for (let i = 0; i < SLOTS; i++) for (const w of ["before", "after"]) if (untexted(i, w)) unsent.push(`${storeOf(i) ? "#" + storeOf(i) : "Slot " + (i + 1)} ${WHEN_LABEL[w]}`);
  if (unsent.length && !(await confirmDialog(`Not texted yet: <b>${unsent.map(esc).join(", ")}</b>. Clear anyway?`, { ok: "Continue", cancel: "Go back" }))) return false;
  const choice = await askSaveFirst(n);
  if (!choice) return false;
  if (choice === "clear") { await rememberDisplays(); return clearEverything(); }
  const count = {}, files = [], dnum = displayNumbers();
  for (const x of list) {
    const d = new Date(x.at), key = `${x.slot}|${x.when}|${x.kind}`; count[key] = (count[key] || 0) + 1;
    const blob = await getPhoto(x.photo).catch(() => null);
    if (blob) files.push(new File([blob], `store${(storeOf(x.slot) || "none").replace(/[^A-Za-z0-9-]/g, "")}_${WHEN_LABEL[x.when]}_${(dn => (x.kind === "display" && dn ? `Display${dn[0]}_${dn[1]}` : `${KIND_LABEL[x.kind]}_${count[key]}`))(dnum.get(x.when + "|" + x.photo))}_${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.jpg`, { type: "image/jpeg" }));
  }
  if (files.length < list.length) { toast("Some photos are missing, so nothing was cleared"); return false; }
  const hideHint = showSaveHint(files.length);
  try {

    "Sharper whole-shelf photos.",
    "Listen while recording, for newer iPhones.",
    "Sharing between phones was removed; a backup file in More instead." ] },
  { v: "1.2.0", notes: ["Send Before and After photos to a teammate."] },
  { v: "1.1.0", notes: ["New name, Shelfie, with a new logo and home-screen icon."] },
  { v: "1.0.1", name: "Shelf Scan", notes: ["A shutter tap you can feel on newer iPhones.", "Separate settings for shutter and button feedback.", "Swipe notices away."] },
  { v: "1.0.0", name: "Shelf Scan", notes: [
    "The first stable release: snap a shelf and say what's needed, and the Needed list sorts it by brand.",
    "Before and After photos by store, texted to your boss.",
    "Haptics and small animations." ] },
];
function renderChangelog() {
  const v = $("#view-changelog");
  const major = x => x.v.split(".")[0];
  let html = `<button class="btn sm quiet back-btn" data-a="back">‹ More</button><div class="list-head"><h2>What's new</h2></div>`, cur = null;
  CHANGELOG.forEach((e, i) => {
    if (major(e) !== cur) { if (cur !== null) html += `</div>`; cur = major(e); html += `<div class="sec-h">${cur === "1" ? "Shelf Scan and Shelfie 1" : `Shelfie ${cur}`}</div><div class="list group">`; }
    html += `<div class="item cl-item"><div class="grow"><div class="name">${e.name ? `${esc(e.name)} ` : ""}${esc(e.v)}${i === 0 ? `<span class="cl-cur">This version</span>` : ""}</div>
      <ul class="cl-list">${e.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div></div>`;
  });
  html += `</div><p class="foot">Shelfie keeps everything on this phone.</p>`;
  v.innerHTML = html;
  v.querySelector('[data-a="back"]').onclick = () => showView("more");
}
// The running count of releases since the project began (every pushed update; the phones' old automatic sync commits don't count). Add one with each push.
const REVISION = 83;
// More
function modelRow(key) {
  const i = MODEL_INFO[key], have = haveModel(key), busy = ai.dl.key === key;
  const dot = have ? "ok" : busy ? "warn" : "";
  return `<div class="item set"><span class="status-dot ${dot}"></span><div class="grow"><div class="name">${esc(i.name)}</div><div class="sub">${esc(i.detail)} · ${esc(i.size)}</div></div>
    ${have ? `<span class="set-val">Ready</span>` : busy ? `<span class="set-val">Downloading</span>` : `<button class="btn sm primary" data-dl="${key}" ${ai.dl.key ? "disabled" : ""}>${icon("download")}Download</button>`}</div>`;
}
function renderMore() {
  const v = $("#view-more");
  const a = document.activeElement;
  if (a && v.contains(a) && a.matches("input, textarea, select")) return;   // don't wipe what is being typed; it redraws when focus leaves
  const dl = ai.dl.key;
  v.innerHTML = `
    <div class="list-head"><h2>More</h2></div>
    <div class="sec-h">Voice</div>
    <div class="list group">
      ${modelRow("asr")}
      <div class="item set"><label class="grow" for="word-timing"><div class="name">Highlight words while a note plays</div><div class="sub">Uses more memory while listening. If the app restarts after you tap Done, leave this off.</div></label><input type="checkbox" switch id="word-timing" ${state.settings.wordTiming ? "checked" : ""}></div>
      <div class="item set"><label class="grow" for="live-listen"><div class="name">Listen while recording</div><div class="sub">Turns each product into text while you say the next one, so the list is ready the moment you finish. Uses more memory at once: for newer iPhones.</div></label><input type="checkbox" switch id="live-listen" ${liveListenOn() ? "checked" : ""}></div>
    </div>
    ${dl ? `<div class="mprog" data-mprog style="margin-top:10px"><i></i></div><p class="sec-foot" data-mprog-label>Starting…</p>` : ""}
    ${ai.dl.error ? `<div class="banner warn" style="margin-top:8px">${icon("warn")}<span class="grow">${esc(ai.dl.error)}</span></div>` : ""}
    <p class="sec-foot">Listening runs on this phone, so it works with no signal. The speech model downloads once (use Wi-Fi), then stays on the phone.</p>
    ${haveModel("asr") && !dl ? `<div class="list group" style="margin-top:12px"><button class="item row-btn danger" id="btn-del-models"><span class="grow">Delete the speech model</span></button></div>` : ""}
    <div class="sec-h">Feedback</div>
    <div class="list group">
      <div class="item set"><label class="grow" for="haptic-shutter"><div class="name">Shutter feedback</div><div class="sub">A tiny blip when you press the shutter. Needs iOS 17.4 or later.</div></label><input type="checkbox" switch id="haptic-shutter" ${hapticShutterOn() ? "checked" : ""}></div>
      <div class="try-wrap" id="haptic-try"><button type="button" class="item row-btn">${icon("sliders")}<span class="grow">Try the shutter blip</span></button></div>
      <div class="item set"><label class="grow" for="haptic-taps"><div class="name">Button feedback</div><div class="sub">A light tap on buttons, tabs and switches. iOS 26.5 and later don't allow it, so it only works on older iPhones.</div></label><input type="checkbox" switch id="haptic-taps" ${hapticTapsOn() ? "checked" : ""}></div>
    </div>
    <p class="sec-foot">No tap felt? Check Settings › Sounds &amp; Haptics › System Haptics on your iPhone.</p>
    <div class="sec-h">Products</div>
    <div class="list group"><button class="item row-btn nav" id="btn-products">${icon("grid")}<span class="grow">Product list</span><span class="set-val">${variations().length}</span>${icon("jump")}</button></div>
    <p class="sec-foot">The brands and flavors the list recognizes. Add one if people say something it doesn't know, or retire ones you never stock.</p>
    <div class="sec-h">Backup</div>
    <div class="list group">
      <button class="item row-btn" id="btn-backup">${icon("download")}<span class="grow">Save a backup</span></button>
      <button class="item row-btn" id="btn-restore">${icon("upload")}<span class="grow">Restore from a backup</span></button>
    </div>
    <p class="sec-foot">One small file with the product list, settings and store numbers. Keep it in Files or send it to yourself. Notes and photos aren't included.</p>
    <div class="sec-h">Stores</div>
    <div class="list group">
      <div class="item set"><label class="grow" for="geo-on"><div class="name">Find my store by location</div><div class="sub">Opens the right store when you arrive, and skips “Still at…?” when you haven't moved. Your location stays on this phone.</div></label><input type="checkbox" switch id="geo-on" ${geoOn() ? "checked" : ""}></div>
    </div>
    <div class="sec-h">Photos</div>
    <div class="list group">
      <div class="item set"><label class="grow" for="photo-check"><div class="name">Warn about blurry or dark photos</div><div class="sub">Right after a photo, if it looks blurry or too dark, you get a Retake button.</div></label><input type="checkbox" switch id="photo-check" ${photoCheckOn() ? "checked" : ""}></div>
    </div>
    <div class="sec-h">Help</div>
    <div class="list group">
      <button class="item row-btn nav" id="btn-learned">${icon("mic")}<span class="grow">Learned words</span><span class="set-val">${Object.keys(state.learned || {}).length}</span>${icon("jump")}</button>
      <button class="item row-btn" id="btn-practice">${icon("play")}<span class="grow">Practice run</span></button>
      <button class="item row-btn nav" id="btn-whatsnew">${icon("note")}<span class="grow">What's new</span>${icon("jump")}</button>
    </div>
    <div class="list group" style="margin-top:28px"><button class="item row-btn danger" id="btn-reset"><span class="grow">Reset this phone</span></button></div>
    <p class="foot">Shelfie 2.12.0 · revision ${REVISION} · ${state.products.length} products · ${state.notes.length} note${state.notes.length === 1 ? "" : "s"}<br>
      <span style="opacity:.7">Screen ${screen.width}×${screen.height}${navigator.standalone ? " · home screen" : ""}</span></p>`;
  if (dl) updateModelProgress();
  attachHapticOverlay(v.querySelector("#haptic-try"), () => toast("Felt a tap? Then the shutter will too."));
  v.querySelector("#haptic-shutter").onchange = e => { state.settings.hapticShutter = e.target.checked; save(); syncHaptics(); };
  v.querySelector("#haptic-taps").onchange = e => { state.settings.hapticTaps = e.target.checked; save(); };
  v.querySelector("#live-listen").onchange = e => { state.settings.liveListen = e.target.checked; save(); };
  v.querySelector("#word-timing").onchange = e => { state.settings.wordTiming = e.target.checked; save(); };
  v.querySelectorAll("[data-dl]").forEach(b => (b.onclick = () => downloadModels([b.dataset.dl])));
  const del = v.querySelector("#btn-del-models"); if (del) del.onclick = async () => {
    if (!(await confirmDialog("Delete the speech model? Notes already read keep their lists. New notes wait until you download it again.", { ok: "Delete", danger: true }))) return;
    await deleteModels(); toast("Speech model deleted");
  };
  v.querySelector("#btn-products").onclick = () => showView("products");
  v.querySelector("#btn-backup").onclick = saveBackup;
  v.querySelector("#btn-restore").onclick = pickBackupFile;
  v.querySelector("#photo-check").onchange = e => { state.settings.photoCheck = e.target.checked; save(); };
  v.querySelector("#btn-practice").onclick = () => startTutorial();
  v.querySelector("#btn-learned").onclick = () => openLearned();
  v.querySelector("#geo-on").onchange = e => { state.settings.geo = e.target.checked; save(); if (e.target.checked && storeOf(baSlot())) learnSpot(storeOf(baSlot())); };
  v.querySelector("#btn-whatsnew").onclick = () => showView("changelog");
  v.querySelector("#btn-reset").onclick = async () => {
    if (!(await confirmDialog("Erase everything on this phone (notes, photos, store numbers and settings) and start fresh with the built-in product list? Save a backup first if you want to keep your product changes.", { ok: "Erase", danger: true }))) return;
    const models = state.settings.models;
    state = freshState(); state.settings.models = models; save(); renderAll(); scheduleSweep();
    toast("This phone was reset");
  };
}

// ---------- Wire up ----------
fillIcons();
load();
document.body.dataset.view = view;   // the layout keys off this (it also works where the page is wrapped by another document)
document.querySelectorAll("#tabs button").forEach(b => (b.onclick = () => showView(b.dataset.view)));
$("#btn-cam-start").onclick = startCamera;
$("#btn-cam-stop").onclick = () => { state.settings.camOK = false; save(); stopCamera(); };
document.querySelectorAll("#cap-seg button").forEach(b => (b.onclick = () => { if (hold.session && b.dataset.k !== captureKind()) endHoldSession(); state.settings.captureKind = b.dataset.k; save(); renderCapture(); }));
// The shutter is held, not tapped: a hold takes the shelf photo and records one product (see hold.js). A tap just says so, except with no
// live camera, where it opens the iPhone camera app and then the recording sheet.
$("#btn-shutter").onclick = () => {
  if (hold.justHeld) { hold.justHeld = false; return; }   // the tap that ends a hold isn't a shutter tap
  if (!storeOf(baSlot())) { askStore(baSlot()); return; }   // like the After tab: the first tap asks for the store number, nothing else
  if (!cam.stream || captureKind() === "backstock") return onShutter(false, captureKind());
  tapToPick();   // a quick tap: photo, then pick from the list (a hold talks)
};
wireHoldToTalk();
$("#btn-phonecam").onclick = () => onShutter(true, captureKind());
wireBA();
wireSoundBtn();
wireHaptics();
wireToastSwipe();
wireNeededSwipe();
document.querySelectorAll(".cam-lens button").forEach(b => (b.onclick = () => { pulse(b); setLens(b.dataset.lens); }));
renderAll();
save();
syncAllIndicators(false);
setTimeout(sweepMedia, 3000);   // tidy photos and recordings left over from deleted notes
if (state.settings.camOK) startCamera();
if (firstRun && !state.settings.tutorialSeen) setTimeout(startTutorial, 900);   // a new phone: offer the practice run
else setTimeout(awayCheck, 800);
checkLastCrash();
recoverRecording();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}   // ask iOS not to clear saved photos and recordings when space is low
verifyModels().then(() => { setTimeout(warmUp, 3000); pump(); });   // the model loads a moment after the camera starts, not at the same instant   // get the models ready, and pick up anything still waiting from last time

// Updates: check for a new version whenever the app comes back to the foreground (home-screen apps on iPhone
// stay loaded for days), and offer a one-tap reload once it's installed.
if ("serviceWorker" in navigator && location.protocol === "https:") {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) showUpdateReady(); });
}
// Centered pop-up; "Later" dismisses it until the app next comes back to the foreground.
let updatePromptOpen = false, updateWaiting = false;
function showUpdateReady() {
  updateWaiting = true;
  if (updatePromptOpen) return;
  updatePromptOpen = true;
  const d = el(`<div class="dialog update-dialog" id="update-ready">
    <div class="update-icon">${icon("refresh")}</div>
    <h3>Update available</h3>
    <p>A new version of Shelfie is ready. Reload to start using it. Your notes and settings stay as they are.</p>
    <div class="btns"><button class="btn quiet" data-a="later">Later</button><button class="btn primary" data-a="reload">Reload now</button></div></div>`);
  const close = openLayer(d, { center: true, onClose: () => (updatePromptOpen = false) });
  d.querySelector('[data-a="reload"]').onclick = () => location.reload();
  d.querySelector('[data-a="later"]').onclick = close;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && updateWaiting) showUpdateReady(); });
</script>
</body>
</html>
